name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free
      NODE_ENV: production

    steps:

      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================
      # VERSION CODE
      # ============================================
      - name: Set Version Code
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using Version Code: $VERSION_CODE"


      # ============================================
      # NODE
      # ============================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ============================================
      # JAVA
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================
      # CREATE PACKAGE.JSON
      # ============================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF


      # ============================================
      # INSTALL DEPENDENCIES
      # ============================================
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps


      # ============================================
      # BABEL CONFIG
      # ============================================
      - name: Create Babel Config
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ["babel-preset-expo"]
            };
