name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check project
        shell: bash
        run: |
          test -f package.json
          test -f App.js
          echo "Project OK"

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps
          npm install \
            expo@51.0.39 \
            react@18.2.0 \
            react-native@0.74.5 \
            @react-native-async-storage/async-storage@1.23.1 \
            --legacy-peer-deps
          npm install --save-dev babel-preset-expo@11.0.10 --legacy-peer-deps

      - name: Configure Babel
        shell: bash
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF

      - name: Configure entry
        shell: bash
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";

          registerRootComponent(App);
          EOF

      - name: Create assets
        shell: bash
        run: |
          mkdir -p assets

          python3 <<'PY'
          import struct
          import zlib
          from pathlib import Path

          def make_png(path, width, height):
              row = b"\xff\xff\xff" * width
              raw = b"".join(b"\x00" + row for _ in range(height))

              def chunk(name, data):
                  return (
                      struct.pack(">I", len(data))
                      + name
                      + data
                      + struct.pack(">I", zlib.crc32(name + data) & 0xffffffff)
                  )

              png = b"\x89PNG\r\n\x1a\n"
              png += chunk(
                  b"IHDR",
                  struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)
              )
              png += chunk(b"IDAT", zlib.compress(raw, 9))
              png += chunk(b"IEND", b"")

              Path(path).write_bytes(png)

          make_png("assets/icon.png", 1024, 1024)
          make_png("assets/adaptive-icon.png", 1024, 1024)
          make_png("assets/splash.png", 1284, 2778)
          make_png("assets/favicon.png", 48, 48)
          PY

      - name: Configure Expo
        env:
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const run = Number(process.env.RUN_NUMBER || "1");

          let app = {};

          if (fs.existsSync("app.json")) {
            app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          }

          app.expo = app.expo || {};
          app.expo.android = app.expo.android || {};

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = `2.0.${run}`;
          app.expo.orientation = "portrait";
          app.expo.icon = "./assets/icon.png";

          app.expo.splash = {
            image: "./assets/splash.png",
            resizeMode: "contain",
            backgroundColor: "#ffffff"
          };

          app.expo.android.package = "com.vyapar.khatabook.free";

          app.expo.android.versionCode = 2200 + run;

          app.expo.android.minSdkVersion = 24;

          app.expo.android.adaptiveIcon = {
            foregroundImage: "./assets/adaptive-icon.png",
            backgroundColor: "#ffffff"
          };

          app.expo.web = {
            ...(app.expo.web || {}),
            favicon: "./assets/favicon.png"
          };

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2) + "\n"
          );

          console.log("VersionCode:", app.expo.android.versionCode);
          NODE

      - name: Verify App
        shell: bash
        run: |
          node --check App.js
          npx expo config --type public

      - name: Generate Android project
        shell: bash
        run: |
          rm -rf android

          npx expo prebuild \
            --platform android \
            --clean \
            --no-install

      - name: Force API 36
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # app/build.gradle
          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'compileSdkVersion\s*=?\s*\d+',
              'compileSdkVersion 36',
              s
          )

          s = re.sub(
              r'targetSdkVersion\s*=?\s*\d+',
              'targetSdkVersion 36',
              s
          )

          s = re.sub(
              r'minSdkVersion\s*=?\s*\d+',
              'minSdkVersion 24',
              s
          )

          p.write_text(s)

          # android/build.gradle
          p = Path("android/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'kotlinVersion\s*=\s*["\'][^"\']+["\']',
              'kotlinVersion = "1.9.23"',
              s
          )

          if "kotlinVersion = '1.9.23'" not in s and \
             'kotlinVersion = "1.9.23"' not in s:
              if "ext {" in s:
                  s = s.replace(
                      "ext {",
                      "ext {\n        kotlinVersion = '1.9.23'",
                      1
                  )

          if "compileSdkVersion = 36" not in s:
              if "ext {" in s:
                  s = s.replace(
                      "ext {",
                      "ext {\n        compileSdkVersion = 36",
                      1
                  )

          if "targetSdkVersion = 36" not in s:
              if "ext {" in s:
                  s = s.replace(
                      "ext {",
                      "ext {\n        targetSdkVersion = 36",
                      1
                  )

          p.write_text(s)

          # gradle.properties
          p = Path("android/gradle.properties")
          old = p.read_text() if p.exists() else ""

          lines = [
              x for x in old.splitlines()
              if not x.startswith("android.minSdkVersion=")
              and not x.startswith("android.compileSdkVersion=")
              and not x.startswith("android.targetSdkVersion=")
              and not x.startswith("android.suppressUnsupportedCompileSdk=")
          ]

          lines.extend([
              "android.minSdkVersion=24",
              "android.compileSdkVersion=36",
              "android.targetSdkVersion=36",
              "android.suppressUnsupportedCompileSdk=36"
          ])

          p.write_text("\n".join(dict.fromkeys(lines)) + "\n")

          # Expo 51 Kotlin null-safety fix
          p = Path(
              "node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt"
          )

          if p.exists():
              s = p.read_text()

              s = s.replace(
                  "requestedPermissions.contains(permission)",
                  "requestedPermissions?.contains(permission) ?: false"
              )

              p.write_text(s)

          print("API 36 and Kotlin configuration completed.")
          PY

          echo "===== FINAL SDK VALUES ====="

          grep -RniE \
            "compileSdkVersion|targetSdkVersion|compileSdk|targetSdk" \
            android/app/build.gradle \
            android/build.gradle \
            android/gradle.properties \
            || true

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Keystore restored."

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "storeFile file('upload-keystore.jks')" not in s:

              marker = "signingConfigs {"

              block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
              """

              if marker not in s:
                  raise SystemExit("signingConfigs not found")

              s = s.replace(
                  marker,
                  marker + block,
                  1
              )

          s = s.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(s)
          PY

      - name: Verify signing certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Build Android AAB
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          cd android

          chmod +x gradlew

          ./gradlew \
            clean \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Find AAB
        shell: bash
        run: |
          AAB=$(find android \
            -type f \
            -name "*.aab" |
            head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not generated."
            exit 1
          fi

          echo "AAB FOUND:"
          echo "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Build complete
        shell: bash
        run: |
          echo "================================"
          echo "VYAPAR KHATA AAB BUILD COMPLETE"
          echo "================================"
