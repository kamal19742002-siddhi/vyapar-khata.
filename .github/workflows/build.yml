name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version Code
        shell: bash
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using Version Code: $VERSION_CODE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify App Source
        shell: bash
        run: |
          if [ ! -f App.js ]; then
            echo "ERROR: App.js is missing."
            exit 1
          fi

      - name: Create package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "expo-contacts": "~13.0.5",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Babel Config
        shell: bash
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF

      - name: Create index.js
        shell: bash
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";
          registerRootComponent(App);
          EOF

      - name: Create app.json
        shell: bash
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE}
              }
            }
          }
          EOF

      - name: Expo Prebuild
        shell: bash
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

      - name: Fix Splash Resource
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Set and Verify Android Minimum SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          app_gradle = Path("android/app/build.gradle")
          root_gradle = Path("android/build.gradle")
          properties = Path("android/gradle.properties")

          for path in (app_gradle, root_gradle, properties):
              if not path.exists():
                  sys.exit(f"ERROR: Required file not found: {path}")

          prop_text = properties.read_text()
          prop_text = re.sub(
              r'(?m)^[ \t]*android\.minSdkVersion[ \t]*=.*(?:\n|$)',
              '',
              prop_text
          ).rstrip()

          prop_text += '\nandroid.minSdkVersion=24\n'
          properties.write_text(prop_text)

          root_text = root_gradle.read_text()
          if not re.search(
              r'findProperty\s*\(\s*[\'"]android\.minSdkVersion[\'"]\s*\)',
              root_text
          ):
              if not re.search(
                  r'\bminSdkVersion\s*=\s*24\b',
                  root_text
              ):
                  sys.exit(
                      "ERROR: Root Gradle SDK configuration needs "
                      "manual verification."
                  )

          print("Minimum SDK property configured successfully.")
          PY

      - name: Restore Existing Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore could not be restored."
            exit 1
          fi

          echo "Signing keystore restored."

      - name: Configure Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -s android/app/upload-keystore.jks || {
            echo "ERROR: Upload keystore is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfigs {" not in text:
              sys.exit("ERROR: signingConfigs block not found.")

          if "buildTypes {" not in text:
              sys.exit("ERROR: buildTypes block not found.")

          start = text.find("buildTypes {")
          release = re.search(r'\brelease\s*\{', text[start:])
          if not release:
              sys.exit("ERROR: release build type not found.")

          release_start = start + release.start()
          opening = text.find("{", release_start)
          depth = 0
          end = -1

          for i in range(opening, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break

          if end < 0:
              sys.exit("ERROR: release block is malformed.")

          block = text[release_start:end + 1]

          if "vyaparRelease" not in text:
              signing = """
              signingConfigs {
                  vyaparRelease {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              """
              text = text[:start] + signing + text[start:]
              start = text.find("buildTypes {")
              release = re.search(r'\brelease\s*\{', text[start:])
              release_start = start + release.start()
              opening = text.find("{", release_start)
              depth = 0
              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              block = text[release_start:end + 1]

          block = re.sub(
              r'(?m)^\s*signingConfig\s+signingConfigs\.\w+\s*$',
              '            signingConfig signingConfigs.vyaparRelease',
              block
          )

          if "signingConfig signingConfigs.vyaparRelease" not in block:
              block = block[:-1] + (
                  "\n        signingConfig signingConfigs.vyaparRelease\n"
                  "    }"
              )

          text = text[:release_start] + block + text[end + 1:]
          path.write_text(text)
          print("Release signing configured.")
          PY

          echo "Checking the certificate used by GitHub..."
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E "SHA1:|SHA256:"

      - name: Verify Release Signing Configuration
        shell: bash
        run: |
          echo "Checking release signing configuration..."
          grep -n -A 12 -B 4 "signingConfigs" android/app/build.gradle
          grep -n -A 15 "buildTypes" android/app/build.gradle
          echo "Checking keystore file..."
          ls -l android/app/upload-keystore.jks
      - name: Build Production Android App Bundle (AAB)
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace --info
      - name: Verify AAB File
        if: success()
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          echo "Searching for generated AAB files..."
          find android -type f -name "*.aab" -print

          if [ ! -s "$AAB" ]; then
            echo "ERROR: Expected AAB file not found: $AAB"
            exit 1
          fi

          ls -lh "$AAB"
          echo "AAB file verified."

      - name: Upload AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vyapar-Khata-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Verify Upload Key SHA1
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E "SHA1:"
