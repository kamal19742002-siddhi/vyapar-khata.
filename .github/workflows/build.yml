                                style={styles.actionBadge}
                                onPress={() => shareEntryReceipt(entry)}
                              >
                                <Text style={styles.actionBadgeText}>📤 Share Details</Text>
                              </TouchableOpacity>
                              <TouchableOpacity
                                style={[styles.actionBadge, { backgroundColor: "#e8f5e9" }]}
                                onPress={() => sendWhatsAppText(entry)}
                              >
                                <Text style={[styles.actionBadgeText, { color: "#2e7d32" }]}>💬 WhatsApp</Text>
                              </TouchableOpacity>
                            </View>
                          </View>
                          <View style={{ alignItems: "flex-end", justifyContent: "space-between" }}>
                            <Text
                              style={[
                                styles.entryAmount,
                                { color: entry.type === "Credit" ? "#16835c" : "#c62828" }
                              ]}
                            >
                              {(entry.type === "Credit" ? "+ " : "- ") + "₹" + entry.amount.toLocaleString("en-IN")}
                            </Text>
                            <View style={{ flexDirection: "row", gap: 10, marginTop: 8 }}>
                              <TouchableOpacity onPress={() => startEditEntry(entry)}>
                                <Text style={{ color: "#0759a8", fontWeight: "700", fontSize: 13 }}>✏️ Edit</Text>
                              </TouchableOpacity>
                              <TouchableOpacity onPress={() => deleteEntry(entry.id)}>
                                <Text style={{ color: "#c62828", fontWeight: "700", fontSize: 13 }}>🗑️ Del</Text>
                              </TouchableOpacity>
                            </View>
                          </View>
                        </View>
                      ))
                    )}
                    <View style={styles.form}>
                      <Button text="BACK TO PROFILE" secondary onPress={() => setScreen("profile")} />
                      <View style={{ height: 60 }} />
                    </View>
                  </ScrollView>
                </SafeAreaView>
              );
            }

            const currentList = tab === "Customers" ? customers : suppliers;

            return (
              <SafeAreaView style={styles.container}>
                <StatusBar barStyle="light-content" backgroundColor="#0759a8" />
                <ScrollView keyboardShouldPersistTaps="handled" contentContainerStyle={styles.scrollContainer}>
                  <View style={styles.header}>
