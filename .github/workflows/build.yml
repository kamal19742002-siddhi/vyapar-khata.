
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # NODE
      # ---------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # CREATE EXPO APP
      # ---------------------------------------------------------
      - name: Create Expo App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank@sdk-51 --no-install
          cd vyapar-khata
          npm install
          npx expo install @react-native-async-storage/async-storage

      # ---------------------------------------------------------
      # CONFIGURE APP
      # ---------------------------------------------------------
      - name: Configure App
        working-directory: vyapar-khata
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(
            fs.readFileSync("app.json", "utf8")
          );

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";

          /*
           * Version name changes automatically.
           */
          app.expo.version = "1.0.${process.env.RUN_NUMBER}";

          /*
           * IMPORTANT:
           * Start above the old 1083 version code.
           * 2000 + GitHub run number gives 2001, 2002...
           */
          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 2000 + parseInt(process.env.RUN_NUMBER || "1", 10)
          };

          /*
           * Force Android target SDK 36.
           */
          app.expo.android.targetSdkVersion = 36;

          /*
           * Compile against SDK 36.
           */
          app.expo.android.compileSdkVersion = 36;

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2)
          );
          NODE
        env:
          RUN_NUMBER: ${{ github.run_number }}

      # ---------------------------------------------------------
      # CREATE APP.JS
      # ---------------------------------------------------------
      - name: Create App.js
        working-directory: vyapar-khata
        run: |
          cat > App.js <<'APPJS'
          import React, { useEffect, useState } from "react";
          import {
            SafeAreaView,
            ScrollView,
            View,
            Text,
            TextInput,
            TouchableOpacity,
            StyleSheet,
            Alert,
            StatusBar
          } from "react-native";

          import AsyncStorage from "@react-native-async-storage/async-storage";

          const DATA_KEY = "VYAPAR_KHATA_DATA";

          /*
           * Master PIN
           */
          const MASTER_PIN = "9999";

          export default function App() {

            const [records, setRecords] = useState([]);

            const [name, setName] = useState("");
            const [invoice, setInvoice] = useState("");
            const [original, setOriginal] = useState("");
            const [second, setSecond] = useState("");

            const [master, setMaster] = useState(false);
            const [pin, setPin] = useState("");

            useEffect(() => {
              loadData();
            }, []);

            async function loadData() {
              try {
                const saved = await AsyncStorage.getItem(DATA_KEY);

                if (saved) {
                  setRecords(JSON.parse(saved));
                }
              } catch (error) {
                console.log("Load error:", error);
              }
            }

            async function saveData(list) {
              try {
                setRecords(list);

                await AsyncStorage.setItem(
                  DATA_KEY,
                  JSON.stringify(list)
                );
              } catch (error) {
                Alert.alert(
                  "Storage Error",
                  "Data save nahi ho paya."
                );
              }
            }

            function unlockMaster() {

              if (pin === MASTER_PIN) {

                setMaster(true);
                setPin("");

                Alert.alert(
                  "Master Open",
                  "Master ledger open ho gaya."
                );

              } else {

                Alert.alert(
                  "Access Denied",
                  "Wrong Master PIN"
                );

                setPin("");
              }
            }

            function addInvoice() {

              if (
                !name.trim() ||
                !invoice.trim() ||
                !original.trim()
              ) {

                Alert.alert(
                  "Required",
                  "Customer, Invoice aur Original Amount bharein."
                );

                return;
              }

              const originalAmount = Number(original);

              if (
                !Number.isFinite(originalAmount) ||
                originalAmount < 0
              ) {

                Alert.alert(
                  "Invalid Amount",
                  "Please valid amount enter karein."
                );

                return;
              }

              const secondAmount =
                master && second.trim()
                  ? Number(second)
                  : 0;

              if (
                !Number.isFinite(secondAmount) ||
                secondAmount < 0
              ) {

                Alert.alert(
                  "Invalid Amount",
                  "Second Amount valid hona chahiye."
                );

                return;
              }

              const item = {
                id: Date.now(),
                name: name.trim(),
                invoice: invoice.trim(),
                original: originalAmount,
                second: master ? secondAmount : 0,
                createdAt: new Date().toISOString()
              };

              saveData([
                item,
                ...records
              ]);

              setName("");
              setInvoice("");
              setOriginal("");
              setSecond("");

              Alert.alert(
                "Saved",
                "Invoice successfully save ho gaya."
              );
            }

            function deleteInvoice(id) {

              Alert.alert(
                "Delete",
                "Kya ye invoice delete karna hai?",
                [
                  {
                    text: "Cancel",
                    style: "cancel"
                  },
                  {
                    text: "Delete",
                    style: "destructive",
                    onPress: () => {

                      const list =
                        records.filter(
                          item => item.id !== id
                        );

                      saveData(list);
                    }
                  }
                ]
              );
            }

            function formatAmount(amount) {

              return Number(amount || 0)
                .toLocaleString("en-IN");
            }

            const totalOriginal = records.reduce(
              (sum, item) =>
                sum + Number(item.original || 0),
              0
            );

            const totalSecond = records.reduce(
              (sum, item) =>
                sum + Number(item.second || 0),
              0
            );

            const totalDue =
              totalOriginal + totalSecond;

            return (
              <SafeAreaView style={styles.page}>

                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#0759A8"
                />

                <ScrollView
                  keyboardShouldPersistTaps="handled"
                >

                  {/* HEADER */}
                  <View style={styles.header}>

                    <Text style={styles.logo}>
                      Vyapar Khata
                    </Text>

                    <Text style={styles.subtitle}>
                      {master
                        ? "MASTER CONSOLIDATED VIEW"
                        : "OFFICIAL REGULAR VIEW"}
                    </Text>

                  </View>

                  {/* MASTER LOGIN */}
                  {!master ? (

                    <View style={styles.box}>

                      <Text style={styles.title}>
                        Master Access
                      </Text>

                      <Text style={styles.description}>
                        Private consolidated ledger ke liye
                        Master PIN enter karein.
                      </Text>

                      <TextInput
                        style={styles.input}
                        placeholder="Master PIN"
                        keyboardType="numeric"
                        secureTextEntry
                        value={pin}
                        onChangeText={setPin}
                        maxLength={8}
                      />

                      <TouchableOpacity
                        style={styles.masterButton}
                        onPress={unlockMaster}
                      >

                        <Text style={styles.buttonText}>
                          OPEN MASTER
                        </Text>

                      </TouchableOpacity>

                    </View>

                  ) : (

                    <View style={styles.box}>

                      <TouchableOpacity
                        style={styles.closeButton}
                        onPress={() => setMaster(false)}
                      >

                        <Text style={styles.closeText}>
                          CLOSE MASTER MODE
                        </Text>

                      </TouchableOpacity>

                    </View>
                  )}

                  {/* DASHBOARD */}
                  <View style={styles.dashboard}>

                    <View style={styles.statCard}>

                      <Text style={styles.statLabel}>
                        INVOICES
                      </Text>

                      <Text style={styles.statValue}>
                        {records.length}
                      </Text>

                    </View>

                    <View style={styles.statCard}>

                      <Text style={styles.statLabel}>
                        ORIGINAL
                      </Text>

                      <Text style={styles.statValue}>
                        ₹ {formatAmount(totalOriginal)}
                      </Text>

                    </View>

                    {master && (

                      <View style={styles.statCard}>

                        <Text style={styles.statLabel}>
                          TOTAL DUE
                        </Text>

                        <Text style={styles.statValue}>
                          ₹ {formatAmount(totalDue)}
                        </Text>

                      </View>

                    )}

                  </View>

                  {/* NEW INVOICE */}
                  <View style={styles.box}>

                    <Text style={styles.title}>
                      New Invoice
                    </Text>

                    <TextInput
                      style={styles.input}
                      placeholder="Customer Name"
                      value={name}
                      onChangeText={setName}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Invoice Number"
                      value={invoice}
                      onChangeText={setInvoice}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Original Invoice Amount"
                      keyboardType="numeric"
                      value={original}
                      onChangeText={setOriginal}
                    />

                    {master && (

                      <TextInput
                        style={styles.secretInput}
                        placeholder="Second Amount"
                        keyboardType="numeric"
                        value={second}
                        onChangeText={setSecond}
                      />

                    )}

                    <TouchableOpacity
                      style={styles.saveButton}
                      onPress={addInvoice}
                    >

                      <Text style={styles.buttonText}>
                        SAVE INVOICE
                      </Text>

                    </TouchableOpacity>

                  </View>

                  {/* RECORDS */}
                  <Text style={styles.listTitle}>
                    Invoice Records ({records.length})
                  </Text>

                  {records.length === 0 ? (

                    <View style={styles.box}>

                      <Text style={styles.empty}>
                        Abhi koi invoice nahi hai.
                      </Text>

                    </View>

                  ) : (

                    records.map(item => {

                      const originalAmount =
                        Number(item.original || 0);

                      const secondAmount =
                        Number(item.second || 0);

                      const total =
                        originalAmount +
                        secondAmount;

                      return (

                        <View
                          key={item.id}
                          style={styles.card}
                        >

                          <View style={styles.row}>

                            <Text style={styles.name}>
                              {item.name}
                            </Text>

                            <TouchableOpacity
                              onPress={() =>
                                deleteInvoice(item.id)
                              }
                            >

                              <Text style={styles.delete}>
                                DELETE
                              </Text>

                            </TouchableOpacity>

                          </View>

                          <Text style={styles.invoice}>
                            Invoice: {item.invoice}
                          </Text>

                          <Text style={styles.original}>
                            Original Invoice: ₹{" "}
                            {formatAmount(originalAmount)}
                          </Text>

                          {!master ? (

                            <Text style={styles.due}>
                              Original Due: ₹{" "}
                              {formatAmount(originalAmount)}
                            </Text>

                          ) : (

                            <View style={styles.masterBox}>

                              <Text style={styles.second}>
                                Second Amount: ₹{" "}
                                {formatAmount(secondAmount)}
                              </Text>

                              <Text style={styles.total}>
                                TOTAL DUE: ₹{" "}
                                {formatAmount(total)}
                              </Text>

                            </View>

                          )}

                        </View>
                      );
                    })
                  )}

                  <View style={{ height: 60 }} />

                </ScrollView>

              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({

            page: {
              flex: 1,
              backgroundColor: "#F3F6FA"
            },

            header: {
              backgroundColor: "#0759A8",
              padding: 20
            },

            logo: {
              color: "#FFFFFF",
              fontSize: 25,
              fontWeight: "bold"
            },

            subtitle: {
              color: "#DCEEFF",
              marginTop: 5,
              fontSize: 13
            },

            box: {
              backgroundColor: "#FFFFFF",
              margin: 12,
              padding: 15,
              borderRadius: 10,
              elevation: 2
            },

            title: {
              fontSize: 18,
              fontWeight: "bold",
              marginBottom: 8
            },

            description: {
              color: "#666666",
              marginBottom: 12,
              lineHeight: 19
            },

            input: {
              borderWidth: 1,
              borderColor: "#CCCCCC",
              borderRadius: 8,
              padding: 12,
              marginBottom: 10,
              backgroundColor: "#FFFFFF"
            },

            secretInput: {
              borderWidth: 1,
              borderColor: "#7B1FA2",
              borderRadius: 8,
              padding: 12,
              marginBottom: 10,
              backgroundColor: "#FDF7FF"
            },

            saveButton: {
              backgroundColor: "#0759A8",
              padding: 14,
              borderRadius: 8,
              alignItems: "center"
            },

            masterButton: {
              backgroundColor: "#7B1FA2",
              padding: 14,
              borderRadius: 8,
              alignItems: "center"
            },

            buttonText: {
              color: "#FFFFFF",
              fontWeight: "bold",
              fontSize: 15
            },

            closeButton: {
              backgroundColor: "#FCE4EC",
              padding: 13,
              borderRadius: 8,
              alignItems: "center"
            },

            closeText: {
              color: "#C2185B",
              fontWeight: "bold"
            },

            dashboard: {
              flexDirection: "row",
              flexWrap: "wrap",
              marginHorizontal: 8
            },

            statCard: {
              backgroundColor: "#FFFFFF",
              margin: 4,
              padding: 12,
              borderRadius: 10,
              minWidth: 105,
              flexGrow: 1,
              elevation: 2
            },

            statLabel: {
              color: "#777777",
              fontSize: 11,
              fontWeight: "bold"
            },

            statValue: {
              color: "#0759A8",
              fontSize: 17,
              fontWeight: "bold",
              marginTop: 5
            },

            listTitle: {
              fontSize: 19,
              fontWeight: "bold",
              marginHorizontal: 14,
              marginTop: 8,
              marginBottom: 5
            },

            card: {
              backgroundColor: "#FFFFFF",
              marginHorizontal: 12,
              marginBottom: 10,
              padding: 15,
              borderRadius: 10,
              elevation: 2
            },

            row: {
              flexDirection: "row",
              justifyContent: "space-between"
            },

            name: {
              fontSize: 17,
              fontWeight: "bold",
              flex: 1,
              marginRight: 10
            },

            delete: {
              color: "#C62828",
              fontWeight: "bold"
            },

            invoice: {
              color: "#666666",
              marginTop: 4
            },

            original: {
              color: "#16835C",
              fontSize: 16,
              fontWeight: "bold",
              marginTop: 7
            },

            due: {
              color: "#C62828",
              fontSize: 16,
              fontWeight: "bold",
              marginTop: 4
            },

            masterBox: {
              marginTop: 10,
              padding: 10,
              backgroundColor: "#F3E5F5",
              borderRadius: 8
            },

            second: {
              color: "#7B1FA2",
              fontSize: 15,
              fontWeight: "bold"
            },

            total: {
              color: "#B71C1C",
              fontSize: 17,
              fontWeight: "bold",
              marginTop: 5
            },

            empty: {
              textAlign: "center",
              color: "#888888"
            }

          });
          APPJS

      # ---------------------------------------------------------
      # PREBUILD
      # ---------------------------------------------------------
      - name: Prebuild Android
        working-directory: vyapar-khata
        run: |
          npx expo prebuild --platform android --no-install

      # ---------------------------------------------------------
      # FORCE TARGET SDK 36
      # ---------------------------------------------------------
      - name: Force Android SDK 36
        working-directory: vyapar-khata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit("android/app/build.gradle not found")

          data = p.read_text()

          /*
           * Replace targetSdkVersion 34/35 with 36.
           */
          import re

          data = re.sub(
              r'targetSdkVersion\s+\d+',
              'targetSdkVersion 36',
              data
          )

          /*
           * Replace compileSdkVersion with 36.
           */
          data = re.sub(
              r'compileSdkVersion\s+\d+',
              'compileSdkVersion 36',
              data
          )

          /*
           * Also handle root variables if Expo generated them.
           */
          data = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              data
          )

          data = re.sub(
              r'targetSdk\s*=\s*\d+',
              'targetSdk = 36',
              data
          )

          p.write_text(data)

          print("Android target SDK forced to 36.")
          PY

      # ---------------------------------------------------------
      # GRADLE CONFIG
      # ---------------------------------------------------------
      - name: Configure Gradle
        working-directory: vyapar-khata
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      # ---------------------------------------------------------
      # RESTORE EXISTING PLAY UPLOAD KEY
      # ---------------------------------------------------------
      - name: Restore Release Upload Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          mkdir -p vyapar-khata/android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > vyapar-khata/android/app/upload-keystore.jks

          test -s vyapar-khata/android/app/upload-keystore.jks

          echo "Existing upload keystore restored."

      # ---------------------------------------------------------
      # RELEASE SIGNING
      # ---------------------------------------------------------
      - name: Configure Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")

          data = p.read_text()

          if "signingConfigs {" not in data:
              raise SystemExit(
                  "signingConfigs block not found"
              )

          block = """
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
          """

          if "storeFile file('upload-keystore.jks')" not in data:

              data = data.replace(
                  "signingConfigs {",
                  "signingConfigs {" + block,
                  1
              )

          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(data)

          print("Release signing configured.")
          PY

      # ---------------------------------------------------------
      # VERIFY SDK + VERSION BEFORE BUILD
      # ---------------------------------------------------------
      - name: Verify Android Configuration
        working-directory: vyapar-khata
        run: |
          echo "===== APP CONFIG ====="
          cat app.json

          echo "===== BUILD GRADLE SDK SETTINGS ====="
          grep -n -E "compileSdk|targetSdk|versionCode|versionName" \
            android/app/build.gradle || true

          echo "===== GRADLE PROPERTIES ====="
          cat android/gradle.properties

      # ---------------------------------------------------------
      # BUILD AAB
      # ---------------------------------------------------------
      - name: Build Release AAB
        working-directory: vyapar-khata/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

          NODE_ENV: production

        run: |
          chmod +x gradlew

          ./gradlew clean bundleRelease --no-daemon

      # ---------------------------------------------------------
      # UPLOAD AAB
      # ---------------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
```
