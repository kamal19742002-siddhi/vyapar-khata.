name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Vyapar Khata App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata

          npm install
          npx expo install @react-native-async-storage/async-storage

          node <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(fs.readFileSync("app.json"));

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.11";

          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 16
          };

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2)
          );
          NODE

          cat > App.js <<'EOF'
          import React, { useEffect, useMemo, useState } from "react";
          import {
            SafeAreaView,
            View,
            Text,
            TextInput,
            TouchableOpacity,
            FlatList,
            StyleSheet,
            StatusBar,
            Alert,
            ScrollView
          } from "react-native";

          import AsyncStorage from "@react-native-async-storage/async-storage";

          const initialCustomers = [
            {
              id: "1",
              name: "Ramesh Kumar",
              phone: "9876543210",
              balance: -500,
              type: "customer"
            },
            {
              id: "2",
              name: "Suresh Patel",
              phone: "9876501234",
              balance: 1200,
              type: "customer"
            },
            {
              id: "3",
              name: "Mohan Sharma",
              phone: "9988776655",
              balance: 0,
              type: "customer"
            }
          ];

          const initialSuppliers = [
            {
              id: "4",
              name: "Sharma Suppliers",
              phone: "9876543211",
              balance: 2500,
              type: "supplier"
            },
            {
              id: "5",
              name: "Patel Traders",
              phone: "9876543222",
              balance: 1800,
              type: "supplier"
            }
          ];

          export default function App() {

            const [customers, setCustomers] = useState([]);
            const [suppliers, setSuppliers] = useState([]);

            const [activeTab, setActiveTab] = useState("customer");
            const [screen, setScreen] = useState("home");

            const [name, setName] = useState("");
            const [phone, setPhone] = useState("");
            const [amount, setAmount] = useState("");

            const [search, setSearch] = useState("");

            useEffect(() => {
              loadData();
            }, []);

            const loadData = async () => {
              try {
                const c = await AsyncStorage.getItem("customers");
                const s = await AsyncStorage.getItem("suppliers");

                setCustomers(c ? JSON.parse(c) : initialCustomers);
                setSuppliers(s ? JSON.parse(s) : initialSuppliers);
              } catch (e) {
                setCustomers(initialCustomers);
                setSuppliers(initialSuppliers);
              }
            };

            const saveData = async (c, s) => {
              await AsyncStorage.setItem(
                "customers",
                JSON.stringify(c)
              );

              await AsyncStorage.setItem(
                "suppliers",
                JSON.stringify(s)
              );
            };

            const currentList =
              activeTab === "customer"
                ? customers
                : suppliers;

            const filteredList = useMemo(() => {
              return currentList.filter(item =>
                item.name
                  .toLowerCase()
                  .includes(search.toLowerCase())
              );
            }, [currentList, search]);

            const totalReceive = customers
              .filter(x => x.balance > 0)
              .reduce((a, x) => a + x.balance, 0);

            const totalPay = customers
              .filter(x => x.balance < 0)
              .reduce((a, x) => a + Math.abs(x.balance), 0);

            const addEntry = (mode) => {

              if (!name.trim()) {
                Alert.alert(
                  "Customer/Supplier",
                  "Please enter name"
                );
                return;
              }

              const value = Number(amount);

              if (!value || value <= 0) {
                Alert.alert(
                  "Amount",
                  "Please enter a valid amount"
                );
                return;
              }

              const list =
                activeTab === "customer"
                  ? [...customers]
                  : [...suppliers];

              const index = list.findIndex(
                x =>
                  x.name.toLowerCase() ===
                  name.trim().toLowerCase()
              );

              const change =
                mode === "receive"
                  ? value
                  : -value;

              if (index >= 0) {

                list[index] = {
                  ...list[index],
                  balance:
                    list[index].balance + change
                };

              } else {

                list.unshift({
                  id: Date.now().toString(),
                  name: name.trim(),
                  phone: phone.trim(),
                  balance: change,
                  type: activeTab
                });

              }

              if (activeTab === "customer") {
                setCustomers(list);
                saveData(list, suppliers);
              } else {
                setSuppliers(list);
                saveData(customers, list);
              }

              setName("");
              setPhone("");
              setAmount("");

              Alert.alert(
                "Success",
                mode === "receive"
                  ? "Entry added successfully"
                  : "Payment entry added successfully"
              );
            };

            const deletePerson = (id) => {

              Alert.alert(
                "Delete",
                "Delete this account?",
                [
                  {
                    text: "Cancel",
                    style: "cancel"
                  },
                  {
                    text: "Delete",
                    style: "destructive",
                    onPress: () => {

                      if (activeTab === "customer") {

                        const updated =
                          customers.filter(x => x.id !== id);

                        setCustomers(updated);
                        saveData(updated, suppliers);

                      } else {

                        const updated =
                          suppliers.filter(x => x.id !== id);

                        setSuppliers(updated);
                        saveData(customers, updated);
                      }
                    }
                  }
                ]
              );
            };

            const renderPerson = ({ item }) => (

              <View style={styles.personCard}>

                <View style={styles.avatar}>
                  <Text style={styles.avatarText}>
                    {item.name.charAt(0).toUpperCase()}
                  </Text>
                </View>

                <View style={styles.personInfo}>
                  <Text style={styles.personName}>
                    {item.name}
                  </Text>

                  <Text style={styles.phone}>
                    {item.phone || "No phone number"}
                  </Text>
                </View>

                <View style={styles.balanceBox}>

                  <Text
                    style={[
                      styles.balance,
                      {
                        color:
                          item.balance >= 0
                            ? "#087f5b"
                            : "#b4232d"
                      }
                    ]}
                  >
                    ₹ {Math.abs(item.balance)}
                  </Text>

                  <Text style={styles.balanceText}>
                    {item.balance >= 0
                      ? "Milna hai"
                      : "Dena hai"}
                  </Text>

                  <TouchableOpacity
                    onPress={() =>
                      deletePerson(item.id)
                    }
                  >
                    <Text style={styles.deleteText}>
                      Delete
                    </Text>
                  </TouchableOpacity>

                </View>

              </View>
            );

            const Home = () => (

              <View style={{ flex: 1 }}>

                <View style={styles.header}>

                  <Text style={styles.business}>
                    Siddhi Enterprises
                  </Text>

                  <Text style={styles.location}>
                    📍 Business Khata
                  </Text>

                  <Text style={styles.title}>
                    व्यापार खाता
                  </Text>

                  <Text style={styles.subtitle}>
                    Vyapar Khata • Digital Bahi Khata
                  </Text>

                </View>

                <View style={styles.tabs}>

                  <TouchableOpacity
                    style={[
                      styles.tab,
                      activeTab === "customer" &&
                        styles.activeTab
                    ]}
                    onPress={() =>
                      setActiveTab("customer")
                    }
                  >
                    <Text style={styles.tabText}>
                      CUSTOMERS
                    </Text>
                  </TouchableOpacity>

                  <TouchableOpacity
                    style={[
                      styles.tab,
                      activeTab === "supplier" &&
                        styles.activeTab
                    ]}
                    onPress={() =>
                      setActiveTab("supplier")
                    }
                  >
                    <Text style={styles.tabText}>
                      SUPPLIERS
                    </Text>
                  </TouchableOpacity>

                </View>

                <View style={styles.summary}>

                  <View style={styles.summaryBox}>
                    <Text style={styles.summaryLabel}>
                      You will give
                    </Text>

                    <Text style={styles.give}>
                      ₹ {totalPay}
                    </Text>
                  </View>

                  <View style={styles.summaryBox}>
                    <Text style={styles.summaryLabel}>
                      You will get
                    </Text>

                    <Text style={styles.get}>
                      ₹ {totalReceive}
                    </Text>
                  </View>

                </View>

                <View style={styles.actionRow}>

                  <TouchableOpacity
                    style={styles.actionButton}
                    onPress={() =>
                      setScreen("reports")
                    }
                  >
                    <Text style={styles.actionText}>
                      📄 View Reports
                    </Text>
                  </TouchableOpacity>

                  <TouchableOpacity
                    style={styles.actionButton}
                    onPress={() =>
                      setScreen("passbook")
                    }
                  >
                    <Text style={styles.actionText}>
                      📒 Passbook
                    </Text>
                  </TouchableOpacity>

                </View>

                <View style={styles.searchRow}>

                  <TextInput
                    style={styles.search}
                    placeholder={
                      activeTab === "customer"
                        ? "Search Customer"
                        : "Search Supplier"
                    }
                    value={search}
                    onChangeText={setSearch}
                  />

                  <TouchableOpacity
                    style={styles.cashButton}
                    onPress={() =>
                      setScreen("entry")
                    }
                  >
                    <Text style={styles.cashText}>
                      + Entry
                    </Text>
                  </TouchableOpacity>

                </View>

                <Text style={styles.sectionTitle}>
                  {activeTab === "customer"
                    ? "Customer Accounts"
                    : "Supplier Accounts"}
                </Text>

                <FlatList
                  data={filteredList}
                  keyExtractor={item => item.id}
                  renderItem={renderPerson}
                  contentContainerStyle={{
                    paddingBottom: 100
                  }}
                  ListEmptyComponent={
                    <Text style={styles.empty}>
                      No accounts found
                    </Text>
                  }
                />

                <TouchableOpacity
                  style={styles.addButton}
                  onPress={() =>
                    setScreen("entry")
                  }
                >
                  <Text style={styles.addText}>
                    ＋ ADD{" "}
                    {activeTab === "customer"
                      ? "CUSTOMER"
                      : "SUPPLIER"}
                  </Text>
                </TouchableOpacity>

              </View>
            );

            const Entry = () => (

              <ScrollView
                contentContainerStyle={
                  styles.entryContainer
                }
              >

                <Text style={styles.pageTitle}>
                  New Khata Entry
                </Text>

                <View style={styles.switchRow}>

                  <TouchableOpacity
                    style={[
                      styles.switchButton,
                      activeTab === "customer" &&
                        styles.switchActive
                    ]}
                    onPress={() =>
                      setActiveTab("customer")
                    }
                  >
                    <Text style={styles.switchText}>
                      Customer
                    </Text>
                  </TouchableOpacity>

                  <TouchableOpacity
                    style={[
                      styles.switchButton,
                      activeTab === "supplier" &&
                        styles.switchActive
                    ]}
                    onPress={() =>
                      setActiveTab("supplier")
                    }
                  >
                    <Text style={styles.switchText}>
                      Supplier
                    </Text>
                  </TouchableOpacity>

                </View>

                <TextInput
                  style={styles.input}
                  placeholder={
                    activeTab === "customer"
                      ? "Customer Name"
                      : "Supplier Name"
                  }
                  value={name}
                  onChangeText={setName}
                />

                <TextInput
                  style={styles.input}
                  placeholder="Mobile Number"
                  keyboardType="phone-pad"
                  value={phone}
                  onChangeText={setPhone}
                />

                <TextInput
                  style={styles.input}
                  placeholder="Amount (₹)"
                  keyboardType="numeric"
                  value={amount}
                  onChangeText={setAmount}
                />

                <View style={styles.entryButtons}>

                  <TouchableOpacity
                    style={styles.diya}
                    onPress={() =>
                      addEntry("pay")
                    }
                  >
                    <Text style={styles.bigButtonText}>
                      − Diya / Paid
                    </Text>
                  </TouchableOpacity>

                  <TouchableOpacity
                    style={styles.mila}
                    onPress={() =>
                      addEntry("receive")
                    }
                  >
                    <Text style={styles.bigButtonText}>
                      + Mila / Received
                    </Text>
                  </TouchableOpacity>

                </View>

                <TouchableOpacity
                  style={styles.backButton}
                  onPress={() =>
                    setScreen("home")
                  }
                >
                  <Text style={styles.backText}>
                    ← Back to Home
                  </Text>
                </TouchableOpacity>

              </ScrollView>
            );

            const Reports = () => (

              <ScrollView
                contentContainerStyle={
                  styles.reportContainer
                }
              >

                <Text style={styles.pageTitle}>
                  Business Reports
                </Text>

                <View style={styles.reportCard}>
                  <Text style={styles.reportLabel}>
                    Total Customers
                  </Text>

                  <Text style={styles.reportValue}>
                    {customers.length}
                  </Text>
                </View>

                <View style={styles.reportCard}>
                  <Text style={styles.reportLabel}>
                    Total Suppliers
                  </Text>

                  <Text style={styles.reportValue}>
                    {suppliers.length}
                  </Text>
                </View>

                <View style={styles.reportCard}>
                  <Text style={styles.reportLabel}>
                    You will receive
                  </Text>

                  <Text style={styles.get}>
                    ₹ {totalReceive}
                  </Text>
                </View>

                <View style={styles.reportCard}>
                  <Text style={styles.reportLabel}>
                    You will pay
                  </Text>

                  <Text style={styles.give}>
                    ₹ {totalPay}
                  </Text>
                </View>

                <TouchableOpacity
                  style={styles.backButton}
                  onPress={() =>
                    setScreen("home")
                  }
                >
                  <Text style={styles.backText}>
                    ← Back to Home
                  </Text>
                </TouchableOpacity>

              </ScrollView>
            );

            const Passbook = () => (

              <View style={styles.passbook}>

                <Text style={styles.pageTitle}>
                  Passbook
                </Text>

                <Text style={styles.passbookInfo}>
                  Customer and supplier account
                  summary
                </Text>

                {currentList.map(item => (

                  <View
                    key={item.id}
                    style={styles.passbookRow}
                  >

                    <Text style={styles.passName}>
                      {item.name}
                    </Text>

                    <Text
                      style={[
                        styles.passAmount,
                        {
                          color:
                            item.balance >= 0
                              ? "#087f5b"
                              : "#b4232d"
                        }
                      ]}
                    >
                      ₹ {Math.abs(item.balance)}
                    </Text>

                  </View>

                ))}

                <TouchableOpacity
                  style={styles.backButton}
                  onPress={() =>
                    setScreen("home")
                  }
                >
                  <Text style={styles.backText}>
                    ← Back to Home
                  </Text>
                </TouchableOpacity>

              </View>
            );

            return (

              <SafeAreaView style={styles.container}>

                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#0759a8"
                />

                {screen === "home" && <Home />}
                {screen === "entry" && <Entry />}
                {screen === "reports" && <Reports />}
                {screen === "passbook" && <Passbook />}

              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({

            container: {
              flex: 1,
              backgroundColor: "#f5f7fa"
            },

            header: {
              backgroundColor: "#0759a8",
              paddingTop: 18,
              paddingHorizontal: 18,
              paddingBottom: 16
            },

            business: {
              color: "#fff",
              fontSize: 21,
              fontWeight: "bold"
            },

            location: {
              color: "#dcecff",
              marginTop: 3,
              fontSize: 13
            },

            title: {
              color: "#fff",
              fontSize: 31,
              fontWeight: "bold",
              textAlign: "center",
              marginTop: 8
            },

            subtitle: {
              color: "#d9e7ff",
              textAlign: "center",
              fontSize: 15,
              marginTop: 2
            },

            tabs: {
              flexDirection: "row",
              backgroundColor: "#0759a8"
            },

            tab: {
              flex: 1,
              paddingVertical: 13,
              alignItems: "center"
            },

            activeTab: {
              borderBottomWidth: 4,
              borderBottomColor: "#ffc928"
            },

            tabText: {
              color: "#fff",
              fontWeight: "bold",
              fontSize: 15
            },

            summary: {
              flexDirection: "row",
              backgroundColor: "#fff",
              margin: 14,
              borderRadius: 18,
              elevation: 3,
              paddingVertical: 15
            },

            summaryBox: {
              flex: 1,
              alignItems: "center"
            },

            summaryLabel: {
              color: "#4b5563",
              fontSize: 15
            },

            give: {
              color: "#b4232d",
              fontSize: 24,
              fontWeight: "bold",
              marginTop: 5
            },

            get: {
              color: "#087f5b",
              fontSize: 24,
              fontWeight: "bold",
              marginTop: 5
            },

            actionRow: {
              flexDirection: "row",
              marginHorizontal: 14,
              marginBottom: 10,
              gap: 8
            },

            actionButton: {
              flex: 1,
              backgroundColor: "#e5f0fc",
              padding: 13,
              borderRadius: 10,
              alignItems: "center"
            },

            actionText: {
              color: "#0759a8",
              fontWeight: "bold",
              fontSize: 14
            },

            searchRow: {
              flexDirection: "row",
              marginHorizontal: 14,
              marginBottom: 10,
              gap: 8
            },

            search: {
              flex: 1,
              backgroundColor: "#fff",
              borderWidth: 1,
              borderColor: "#d5dbe5",
              borderRadius: 12,
              paddingHorizontal: 15,
              fontSize: 16,
              height: 52
            },

            cashButton: {
              backgroundColor: "#fff",
              borderWidth: 1,
              borderColor: "#0759a8",
              borderRadius: 12,
              justifyContent: "center",
              paddingHorizontal: 15
            },

            cashText: {
              color: "#0759a8",
              fontWeight: "bold"
            },

            sectionTitle: {
              fontSize: 20,
              fontWeight: "bold",
              color: "#222",
              marginHorizontal: 18,
              marginVertical: 8
            },

            personCard: {
              backgroundColor: "#fff",
              marginHorizontal: 14,
              marginBottom: 8,
              padding: 13,
              borderRadius: 13,
              flexDirection: "row",
              alignItems: "center",
              elevation: 2
            },

            avatar: {
              width: 48,
              height: 48,
              borderRadius: 24,
              backgroundColor: "#edf2f7",
              justifyContent: "center",
              alignItems: "center"
            },

            avatarText: {
              fontSize: 20,
              fontWeight: "bold",
              color: "#0759a8"
            },

            personInfo: {
              flex: 1,
              marginLeft: 12
            },

            personName: {
              fontSize: 17,
              fontWeight: "bold",
              color: "#222"
            },

            phone: {
              color: "#777",
              marginTop: 3
            },

            balanceBox: {
              alignItems: "flex-end"
            },

            balance: {
              fontSize: 18,
              fontWeight: "bold"
            },

            balanceText: {
              color: "#777",
              fontSize: 12
            },

            deleteText: {
              color: "#b4232d",
              fontSize: 11,
              marginTop: 3
            },

            addButton: {
              position: "absolute",
              right: 18,
              bottom: 18,
              backgroundColor: "#c00062",
              borderRadius: 28,
              paddingHorizontal: 23,
              paddingVertical: 16,
              elevation: 5
            },

            addText: {
              color: "#fff",
              fontWeight: "bold",
              fontSize: 15
            },

            empty: {
              textAlign: "center",
              color: "#777",
              marginTop: 30
            },

            entryContainer: {
              padding: 18,
              paddingBottom: 40
            },

            pageTitle: {
              fontSize: 27,
              fontWeight: "bold",
              color: "#222",
