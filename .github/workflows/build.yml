name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Project and Setup WebView
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata

          npm install
          npx expo install react-native-webview

          node -e "
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json'));
          app.expo.name = 'Vyapar Khata Book';
          app.expo.slug = 'vyapar-khata';
          app.expo.version = '1.0.8';
          app.expo.android = {
            package: 'com.vyapar.khatabook.free',
            versionCode: 13
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

          cat << 'EOF' > App.js
          import React from 'react';
          import { SafeAreaView, StyleSheet, StatusBar } from 'react-native';
          import { WebView } from 'react-native-webview';

          export default function App() {
            return (
              <SafeAreaView style={styles.container}>
                <StatusBar
                  barStyle="dark-content"
                  backgroundColor="#ffffff"
                />

                <WebView
                  source={{ uri: 'https://smart.onrender.com' }}
                  style={{ flex: 1 }}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                  startInLoadingState={true}
                />
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: {
              flex: 1,
              backgroundColor: '#ffffff'
            }
          });
          EOF

          CI=1 npx expo prebuild --platform android --no-install

      - name: Restore Permanent Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks
          ls -lh vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Permanent Gradle Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          data = p.read_text()

          signing_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + signing_block,
              1
          )

          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(data)
          PY

      - name: Build Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-v13
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
