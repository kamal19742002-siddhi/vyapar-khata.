                      </TouchableOpacity>
                    ))
                  )}

                  <View style={{ margin: 14, marginTop: 20 }}>
                    <TouchableOpacity onPress={() => setIsSettingPin(true)}>
                      <Text style={{ textAlign: "center", color: "#0759a8", fontWeight: "700" }}>
                        ⚙️ Change Security PIN
                      </Text>
                    </TouchableOpacity>
                  </View>
                  <View style={{ height: 60 }} />
                </ScrollView>
              </SafeAreaView>
            );
          }

