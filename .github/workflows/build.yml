name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Vyapar Khata Project
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata
          
          # App configuration
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json'));
            app.expo.name = 'Vyapar Khata Book';
            app.expo.slug = 'vyapar-khata';
            app.expo.version = '1.0.1';
            app.expo.android = {
              package: 'com.vyapar.khatabook.free',
              versionCode: 2
            };
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

          # Add Real Vyapar Khata Book UI & Functionality
          cat << 'EOF' > App.js
          import React, { useState } from 'react';
          import { StyleSheet, Text, View, TextInput, TouchableOpacity, FlatList, SafeAreaView, StatusBar, Alert } from 'react-native';

          export default function App() {
            const [customers, setCustomers] = useState([
              { id: '1', name: 'Ramesh Kumar', balance: -500 },
              { id: '2', name: 'Suresh Patel', balance: 1200 },
              { id: '3', name: 'Mohan Sharma', balance: 0 },
            ]);
            const [name, setName] = useState('');
            const [amount, setAmount] = useState('');

            const addTransaction = (type) => {
              if (!name.trim() || !amount.trim()) {
                Alert.alert('Error', 'Kripya customer ka naam aur amount bharein');
                return;
              }
              const amt = parseFloat(amount);
              if (isNaN(amt) || amt <= 0) {
                Alert.alert('Error', 'Sahi amount dalein');
                return;
              }

              const change = type === 'jama' ? amt : -amt;
              const existingIndex = customers.findIndex(c => c.name.toLowerCase() === name.trim().toLowerCase());

              if (existingIndex > -1) {
                const updated = [...customers];
                updated[existingIndex].balance += change;
                setCustomers(updated);
              } else {
                setCustomers([{ id: Date.now().toString(), name: name.trim(), balance: change }, ...customers]);
              }

              setName('');
              setAmount('');
              Alert.alert('Success', type === 'jama' ? 'Jama (Credit) jud gaya!' : 'Udhar (Debit) jud gaya!');
            };

            const totalBalance = customers.reduce((acc, c) => acc + c.balance, 0);

            return (
              <SafeAreaView style={styles.container}>
                <StatusBar barStyle="light-content" backgroundColor="#1a237e" />
                
                {/* Header */}
                <View style={styles.header}>
                  <Text style={styles.headerTitle}>व्यापार खाता (Vyapar Khata)</Text>
                  <Text style={styles.headerSubtitle}>Digital Bahi Khata & Ledger</Text>
                </View>

                {/* Dashboard Summary Card */}
                <View style={styles.card}>
                  <Text style={styles.cardLabel}>Kul Bakaya / Net Balance</Text>
                  <Text style={[styles.cardValue, { color: totalBalance >= 0 ? '#2e7d32' : '#c62828' }]}>
                    ₹ {Math.abs(totalBalance)} {totalBalance >= 0 ? '(Lena hai)' : '(Dena hai)'}
                  </Text>
                </View>

                {/* Entry Form */}
                <View style={styles.formContainer}>
                  <TextInput
                    style={styles.input}
                    placeholder="Customer Name (Grahak ka Naam)"
                    placeholderTextColor="#777"
                    value={name}
                    onChangeText={setName}
                  />
                  <TextInput
                    style={styles.input}
                    placeholder="Amount (₹ Rashi)"
                    placeholderTextColor="#777"
                    keyboardType="numeric"
                    value={amount}
                    onChangeText={setAmount}
                  />
                  <View style={styles.buttonRow}>
                    <TouchableOpacity style={[styles.btn, styles.btnUdhar]} onPress={() => addTransaction('udhar')}>
                      <Text style={styles.btnText}>- Diya (Udhar)</Text>
                    </TouchableOpacity>
                    <TouchableOpacity style={[styles.btn, styles.btnJama]} onPress={() => addTransaction('jama')}>
                      <Text style={styles.btnText}>+ Mila (Jama)</Text>
                    </TouchableOpacity>
                  </View>
                </View>

                {/* Customer List */}
                <View style={styles.listHeader}>
                  <Text style={styles.listTitle}>Customer Accounts</Text>
                  <Text style={styles.listSub}>{customers.length} Grahak</Text>
                </View>

                <FlatList
                  data={customers}
                  keyExtractor={item => item.id}
                  renderItem={({ item }) => (
                    <View style={styles.listItem}>
                      <View>
                        <Text style={styles.itemName}>{item.name}</Text>
                        <Text style={styles.itemDate}>Updated just now</Text>
                      </View>
                      <View style={{ alignItems: 'flex-end' }}>
                        <Text style={[styles.itemAmount, { color: item.balance >= 0 ? '#2e7d32' : '#c62828' }]}>
                          ₹ {Math.abs(item.balance)}
                        </Text>
                        <Text style={styles.itemType}>
                          {item.balance >= 0 ? 'Mileni hai' : 'Dene hain'}
                        </Text>
                      </View>
                    </View>
                  )}
                />
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1, backgroundColor: '#f4f6f8' },
            header: { backgroundColor: '#1a237e', padding: 18, alignItems: 'center' },
            headerTitle: { color: '#fff', fontSize: 20, fontWeight: 'bold' },
            headerSubtitle: { color: '#c5cae9', fontSize: 13, marginTop: 2 },
            card: {
              backgroundColor: '#fff', marginHorizontal: 16, marginTop: 12, padding: 16,
              borderRadius: 10, elevation: 3, alignItems: 'center'
            },
            cardLabel: { color: '#666', fontSize: 13, fontWeight: '600' },
            cardValue: { fontSize: 24, fontWeight: 'bold', marginTop: 4 },
            formContainer: { backgroundColor: '#fff', margin: 16, padding: 14, borderRadius: 10, elevation: 3 },
            input: {
              backgroundColor: '#f9f9f9', borderWidth: 1, borderColor: '#ddd',
              borderRadius: 8, padding: 10, fontSize: 15, marginBottom: 10
            },
            buttonRow: { flexDirection: 'row', justifyContent: 'space-between', gap: 10 },
            btn: { flex: 1, paddingVertical: 12, borderRadius: 8, alignItems: 'center' },
            btnUdhar: { backgroundColor: '#d32f2f' },
            btnJama: { backgroundColor: '#2e7d32' },
            btnText: { color: '#fff', fontWeight: 'bold', fontSize: 15 },
            listHeader: { flexDirection: 'row', justifyContent: 'space-between', paddingHorizontal: 18, marginBottom: 6 },
            listTitle: { fontSize: 16, fontWeight: 'bold', color: '#333' },
            listSub: { fontSize: 13, color: '#777' },
            listItem: {
              backgroundColor: '#fff', marginHorizontal: 16, marginBottom: 8, padding: 14,
              borderRadius: 8, flexDirection: 'row', justifyContent: 'space-between', elevation: 1
            },
            itemName: { fontSize: 16, fontWeight: '600', color: '#222' },
            itemDate: { fontSize: 12, color: '#888', marginTop: 2 },
            itemAmount: { fontSize: 17, fontWeight: 'bold' },
            itemType: { fontSize: 11, color: '#666', marginTop: 2 }
          });
          EOF
          
          npm install
          npx expo prebuild --platform android --no-install

      - name: Generate Release Keystore
        run: |
          cd vyapar-khata/android/app
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias vyapar-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=VyaparKhata, O=Vyapar, C=IN"

      - name: Configure Gradle Signing
        run: |
          cd vyapar-khata/android
          cat << 'EOF' > configure_signing.py
          with open("app/build.gradle", "r") as f:
              data = f.read()

          signing_block = """
                  release {
                      storeFile file('release.keystore')
                      storePassword 'android'
                      keyAlias 'vyapar-key'
                      keyPassword 'android'
                  }
          """
          data = data.replace("signingConfigs {", "signingConfigs {" + signing_block)
          data = data.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")

          with open("app/build.gradle", "w") as f:
              f.write(data)
          EOF
          python3 configure_signing.py

      - name: Build Android App Bundle (.aab)
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
