name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Vyapar Khata Project
        run: |
          npx create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata
          
          # Configure App Identity
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json'));
            app.expo.name = 'Vyapar Khata Book';
            app.expo.slug = 'vyapar-khata';
            app.expo.version = '1.0.0';
            app.expo.android = {
              package: 'com.vyapar.khatabook.free',
              versionCode: 1
            };
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "
          
          npm install
          npx expo prebuild --platform android --no-install

      - name: Generate Release Keystore
        run: |
          cd vyapar-khata/android/app
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias vyapar-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=VyaparKhata, O=Vyapar, C=IN"

      - name: Configure Gradle Signing
        run: |
          cd vyapar-khata/android
          cat << 'EOF' > configure_signing.py
          with open("app/build.gradle", "r") as f:
              data = f.read()

          signing_block = """
                  release {
                      storeFile file('release.keystore')
                      storePassword 'android'
                      keyAlias 'vyapar-key'
                      keyPassword 'android'
                  }
          """
          data = data.replace("signingConfigs {", "signingConfigs {" + signing_block)
          data = data.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")

          with open("app/build.gradle", "w") as f:
              f.write(data)
          EOF
          python3 configure_signing.py

      - name: Build Android App Bundle (.aab)
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Vyapar Khata"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vyapar.khatabook.free'
              compileSdk 34

              defaultConfig {
                  applicationId "com.vyapar.khatabook.free"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "android"
                      keyAlias "androidreleasekey"
                      keyPassword "android"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Vyapar Khata Book</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/vyapar/khatabook/free/MainActivity.java
          package com.vyapar.khatabook.free;

          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("Vyapar Khata - Bahi Khata Offline Ledger");
                  tv.setTextSize(22);
                  tv.setPadding(50, 100, 50, 50);
                  setContentView(tv);
              }
          }
          EOF

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias androidreleasekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=VyaparKhata, OU=App, O=Vyapar, L=City, S=State, C=IN"

      - name: Build Android App Bundle (AAB)
        run: gradle :app:bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
