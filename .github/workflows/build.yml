name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Vyapar Khata App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata

          npm install

          node - <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(
            fs.readFileSync("app.json", "utf8")
          );

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.16";

          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 16
          };

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2)
          );
          NODE

          cat > App.js <<'EOF'
          import React, { useMemo, useState } from "react";
          import {
            StyleSheet,
            Text,
            View,
            TextInput,
            TouchableOpacity,
            FlatList,
            SafeAreaView,
            StatusBar,
            Alert,
            ScrollView
          } from "react-native";

          export default function App() {

            const [customers, setCustomers] = useState([
              {
                id: "c1",
                name: "Ramesh Kumar",
                balance: 500
              },
              {
                id: "c2",
                name: "Suresh Patel",
                balance: 1200
              }
            ]);

            const [suppliers, setSuppliers] = useState([
              {
                id: "s1",
                name: "ABC Traders",
                balance: 800
              },
              {
                id: "s2",
                name: "Sharma Suppliers",
                balance: 1500
              }
            ]);

            const [activeTab, setActiveTab] =
              useState("customers");

            const [name, setName] = useState("");
            const [amount, setAmount] = useState("");

            const currentList =
              activeTab === "customers"
                ? customers
                : suppliers;

            const customerTotal = useMemo(() => {
              return customers.reduce(
                (sum, item) => sum + item.balance,
                0
              );
            }, [customers]);

            const supplierTotal = useMemo(() => {
              return suppliers.reduce(
                (sum, item) => sum + item.balance,
                0
              );
            }, [suppliers]);

            const saveEntry = (type) => {

              if (!name.trim()) {
                Alert.alert(
                  "Missing Name",
                  "Please enter a name."
                );
                return;
              }

              if (!amount.trim()) {
                Alert.alert(
                  "Missing Amount",
                  "Please enter an amount."
                );
                return;
              }

              const value = Number(amount);

              if (!Number.isFinite(value) || value <= 0) {
                Alert.alert(
                  "Invalid Amount",
                  "Please enter a valid amount."
                );
                return;
              }

              const list =
                activeTab === "customers"
                  ? customers
                  : suppliers;

              const index = list.findIndex(
                item =>
                  item.name.toLowerCase() ===
                  name.trim().toLowerCase()
              );

              const change =
                type === "add"
                  ? value
                  : -value;

              const updated = [...list];

              if (index >= 0) {

                updated[index] = {
                  ...updated[index],
                  balance:
                    updated[index].balance + change
                };

              } else {

                updated.unshift({
                  id: Date.now().toString(),
                  name: name.trim(),
                  balance: change
                });

              }

              if (activeTab === "customers") {
                setCustomers(updated);
              } else {
                setSuppliers(updated);
              }

              setName("");
              setAmount("");

              Alert.alert(
                "Entry Saved",
                activeTab === "customers"
                  ? "Customer account updated."
                  : "Supplier account updated."
              );
            };

            const renderAccount = ({ item }) => {

              const positive =
                item.balance >= 0;

              return (
                <View style={styles.accountCard}>

                  <View style={styles.accountLeft}>

                    <Text style={styles.accountName}>
                      {item.name}
                    </Text>

                    <Text style={styles.accountSub}>
                      {activeTab === "customers"
                        ? positive
                          ? "Amount Receivable"
                          : "Credit Balance"
                        : positive
                          ? "Amount Payable"
                          : "Advance Paid"}
                    </Text>

                  </View>

                  <View style={styles.accountRight}>

                    <Text
                      style={[
                        styles.accountAmount,
                        {
                          color:
                            activeTab === "customers"
                              ? positive
                                ? "#2e7d32"
                                : "#c62828"
                              : positive
                                ? "#c62828"
                                : "#2e7d32"
                        }
                      ]}
                    >
                      ₹ {Math.abs(item.balance)}
                    </Text>

                    <Text style={styles.accountStatus}>
                      {activeTab === "customers"
                        ? positive
                          ? "To Receive"
                          : "Adjusted"
                        : positive
                          ? "To Pay"
                          : "Adjusted"}
                    </Text>

                  </View>

                </View>
              );
            };

            return (
              <SafeAreaView style={styles.container}>

                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#1a237e"
                />

                <ScrollView>

                  <View style={styles.header}>

                    <Text style={styles.headerTitle}>
                      Vyapar Khata
                    </Text>

                    <Text style={styles.headerSubtitle}>
                      Digital Business Ledger
                    </Text>

                  </View>

                  <View style={styles.summaryRow}>

                    <View style={styles.summaryCard}>

                      <Text style={styles.summaryTitle}>
                        Customers
                      </Text>

                      <Text style={styles.customerAmount}>
                        ₹ {customerTotal}
                      </Text>

                      <Text style={styles.summaryLabel}>
                        Receivable
                      </Text>

                    </View>

                    <View style={styles.summaryCard}>

                      <Text style={styles.summaryTitle}>
                        Suppliers
                      </Text>

                      <Text style={styles.supplierAmount}>
                        ₹ {supplierTotal}
                      </Text>

                      <Text style={styles.summaryLabel}>
                        Payable
                      </Text>

                    </View>

                  </View>

                  <View style={styles.tabs}>

                    <TouchableOpacity
                      style={[
                        styles.tab,
                        activeTab === "customers" &&
                          styles.activeTab
                      ]}
                      onPress={() =>
                        setActiveTab("customers")
                      }
                    >
                      <Text
                        style={[
                          styles.tabText,
                          activeTab === "customers" &&
                            styles.activeTabText
                        ]}
                      >
                        Customers
                      </Text>
                    </TouchableOpacity>

                    <TouchableOpacity
                      style={[
                        styles.tab,
                        activeTab === "suppliers" &&
                          styles.activeTab
                      ]}
                      onPress={() =>
                        setActiveTab("suppliers")
                      }
                    >
                      <Text
                        style={[
                          styles.tabText,
                          activeTab === "suppliers" &&
                            styles.activeTabText
                        ]}
                      >
                        Suppliers
                      </Text>
                    </TouchableOpacity>

                  </View>

                  <View style={styles.form}>

                    <Text style={styles.formTitle}>
                      {activeTab === "customers"
                        ? "Customer Entry"
                        : "Supplier Entry"}
                    </Text>

                    <TextInput
                      style={styles.input}
                      placeholder={
                        activeTab === "customers"
                          ? "Customer Name"
                          : "Supplier Name"
                      }
                      placeholderTextColor="#777"
                      value={name}
                      onChangeText={setName}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Amount (₹)"
                      placeholderTextColor="#777"
                      keyboardType="numeric"
                      value={amount}
                      onChangeText={setAmount}
                    />

                    <View style={styles.buttonRow}>

                      <TouchableOpacity
                        style={[
                          styles.actionButton,
                          styles.minusButton
                        ]}
                        onPress={() =>
                          saveEntry("subtract")
                        }
                      >
                        <Text style={styles.buttonText}>
                          − Payment
                        </Text>
                      </TouchableOpacity>

                      <TouchableOpacity
                        style={[
                          styles.actionButton,
                          styles.plusButton
                        ]}
                        onPress={() =>
                          saveEntry("add")
                        }
                      >
                        <Text style={styles.buttonText}>
                          + Entry
                        </Text>
                      </TouchableOpacity>

                    </View>

                  </View>

                  <View style={styles.listHeader}>

                    <Text style={styles.listTitle}>
                      {activeTab === "customers"
                        ? "Customer Accounts"
                        : "Supplier Accounts"}
                    </Text>

                    <Text style={styles.listCount}>
                      {currentList.length} Accounts
                    </Text>

                  </View>

                  <FlatList
                    data={currentList}
                    scrollEnabled={false}
                    keyExtractor={item => item.id}
                    renderItem={renderAccount}
                    contentContainerStyle={
                      styles.listContainer
                    }
                  />

                  <View style={styles.footer}>

                    <Text style={styles.footerText}>
                      Vyapar Khata • Business Accounting
                    </Text>

                  </View>

                </ScrollView>

              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({

            container: {
              flex: 1,
              backgroundColor: "#f4f6f8"
            },

            header: {
              backgroundColor: "#1a237e",
              paddingVertical: 20,
              alignItems: "center"
            },

            headerTitle: {
              color: "#ffffff",
              fontSize: 28,
              fontWeight: "bold"
            },

            headerSubtitle: {
              color: "#c5cae9",
              fontSize: 14,
              marginTop: 4
            },

            summaryRow: {
              flexDirection: "row",
              paddingHorizontal: 12,
              marginTop: 12
            },

            summaryCard: {
              flex: 1,
              backgroundColor: "#ffffff",
              marginHorizontal: 5,
              padding: 15,
              borderRadius: 12,
              elevation: 3
            },

            summaryTitle: {
              fontSize: 15,
              fontWeight: "bold",
              color: "#333333"
            },

            customerAmount: {
              color: "#2e7d32",
              fontSize: 22,
              fontWeight: "bold",
              marginTop: 7
            },

            supplierAmount: {
              color: "#c62828",
              fontSize: 22,
              fontWeight: "bold",
              marginTop: 7
            },

            summaryLabel: {
              color: "#777777",
              fontSize: 12,
              marginTop: 3
            },

            tabs: {
              flexDirection: "row",
              backgroundColor: "#ffffff",
              margin: 16,
              padding: 4,
              borderRadius: 10,
              elevation: 2
            },

            tab: {
              flex: 1,
              paddingVertical: 12,
              alignItems: "center",
              borderRadius: 8
            },

            activeTab: {
              backgroundColor: "#1a237e"
            },

            tabText: {
              color: "#555555",
              fontWeight: "600"
            },

            activeTabText: {
              color: "#ffffff"
            },

            form: {
              backgroundColor: "#ffffff",
              marginHorizontal: 16,
              marginBottom: 16,
              padding: 15,
              borderRadius: 12,
              elevation: 3
            },

            formTitle: {
              fontSize: 19,
              fontWeight: "bold",
              color: "#333333",
              marginBottom: 12
            },

            input: {
              backgroundColor: "#f9f9f9",
              borderWidth: 1,
              borderColor: "#dddddd",
              borderRadius: 8,
              padding: 12,
              fontSize: 16,
              marginBottom: 10
            },

            buttonRow: {
              flexDirection: "row"
            },

            actionButton: {
              flex: 1,
              paddingVertical: 14,
              borderRadius: 8,
              alignItems: "center"
            },

            minusButton: {
              backgroundColor: "#c62828",
              marginRight: 5
            },

            plusButton: {
              backgroundColor: "#2e7d32",
              marginLeft: 5
            },

            buttonText: {
              color: "#ffffff",
              fontWeight: "bold",
              fontSize: 14
            },

            listHeader: {
              flexDirection: "row",
              justifyContent: "space-between",
              paddingHorizontal: 18,
              marginBottom: 8
            },

            listTitle: {
              fontSize: 18,
              fontWeight: "bold",
              color: "#333333"
            },

            listCount: {
              fontSize: 13,
              color: "#777777"
            },

            listContainer: {
              paddingBottom: 10
            },

            accountCard: {
              backgroundColor: "#ffffff",
              marginHorizontal: 16,
              marginBottom: 9,
              padding: 15,
              borderRadius: 10,
              flexDirection: "row",
              justifyContent: "space-between",
              elevation: 2
            },

            accountLeft: {
              flex: 1
            },

            accountName: {
              fontSize: 17,
              fontWeight: "600",
              color: "#222222"
            },

            accountSub: {
              fontSize: 12,
              color: "#777777",
              marginTop: 5
            },

            accountRight: {
              alignItems: "flex-end"
            },

            accountAmount: {
              fontSize: 18,
              fontWeight: "bold"
            },

            accountStatus: {
              fontSize: 11,
              color: "#777777",
              marginTop: 3
            },

            footer: {
              padding: 20,
              alignItems: "center"
            },

            footerText: {
              color: "#888888",
              fontSize: 12
            }

          });
          EOF

          npx expo prebuild --platform android --no-install

      - name: Restore Existing Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > \
            vyapar-khata/android/app/upload-keystore.jks

          test -s vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          if "upload-keystore.jks" not in text:

              signing = """
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              """

              marker = "signingConfigs {"

              if marker not in text:
                  raise SystemExit(
                      "Could not find signingConfigs block."
                  )

              text = text.replace(
                  marker,
                  marker + signing,
                  1
              )

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          path.write_text(text)
          PY

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-v16-aab
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
