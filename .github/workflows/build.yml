name: Build Vyapar Khata AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate Project Root
        id: set-path
        run: |
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            PROJECT_DIR=$(dirname "$PKG_PATH")
          else
            GRADLE_PATH=$(find . -name "build.gradle" -not -path "*/build/*" | head -n 1)
            if [ -n "$GRADLE_PATH" ]; then
              PROJECT_DIR=$(dirname $(dirname "$GRADLE_PATH"))
            else
              PROJECT_DIR="."
            fi
          fi
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: ${{ steps.set-path.outputs.project_dir }}
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi

      - name: Auto-Patch Expo Modules Core for API 36
        working-directory: ${{ steps.set-path.outputs.project_dir }}
        run: |
          FILE=$(find . -path "*/expo/modules/adapters/react/ModuleRegistryAdapter.kt" 2>/dev/null | head -n 1)
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
            echo "Patching $FILE..."
            sed -i 's/\.filterIsInstance/?.filterIsInstance/g' "$FILE"
            sed -i 's/\.map {/?.map {/g' "$FILE"
          fi
          find . -name "gradle.properties" -not -path "*/build/*" -exec sh -c 'echo "android.suppressUnsupportedCompileSdk=36" >> "$1"' _ {} \;

      - name: Configure Keystore and Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APP_GRADLE=$(find . -name "build.gradle" | grep -E "(app/build.gradle|android/app/build.gradle)" | head -n 1)
          if [ -z "$APP_GRADLE" ]; then
            echo "Searching for any application build.gradle..."
            APP_GRADLE=$(grep -l "com.android.application" $(find . -name "build.gradle") | head -n 1)
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "Could not find app build.gradle!"
            exit 1
          fi

          TARGET_DIR=$(dirname "$APP_GRADLE")
          mkdir -p "$TARGET_DIR"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$TARGET_DIR/upload-keystore.jks"
            echo "Keystore successfully written to $TARGET_DIR/upload-keystore.jks"
          fi

          python3 - << EOF
          import os

          gradle_path = "$APP_GRADLE"
          with open(gradle_path, "r") as f:
              data = f.read()

          release_block = """
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
          """
          if "signingConfigs {" in data and "release {" not in data:
              data = data.replace("signingConfigs {", "signingConfigs {" + release_block, 1)
              data = data.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              with open(gradle_path, "w") as f:
                  f.write(data)
              print("Injected release signing config into", gradle_path)
          EOF

      - name: Grant Execute Permission for Gradlew
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_FILE" ]; then
            chmod +x "$GRADLEW_FILE"
          fi

      - name: Build Android App Bundle (AAB)
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew not found!"
            exit 1
          fi
          BUILD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$BUILD_DIR"
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: |
            **/build/outputs/bundle/release/*.aab
