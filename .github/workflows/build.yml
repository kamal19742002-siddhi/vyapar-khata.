name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Project files:"
          ls -la
          echo ""

          if [ ! -f package.json ]; then
            echo "ERROR: package.json is not in repository root."
            exit 1
          fi

          echo "package.json found."

      - name: Install dependencies
        run: npm ci || npm install

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Set Android version
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")
          if not path.exists():
              path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("ERROR: android/app/build.gradle not found")

          text = path.read_text()

          text = re.sub(r"versionCode\s*=*\s*\d+", "versionCode 2001", text)
          text = re.sub(r"targetSdkVersion\s*=*\s*[\w\.]+", "targetSdkVersion 36", text)
          text = re.sub(r"compileSdkVersion\s*=*\s*[\w\.]+", "compileSdkVersion 36", text)

          path.write_text(text)

          print("versionCode = 2001")
          print("targetSdkVersion = 36")
          print("compileSdkVersion = 36")
          PY

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Upload keystore restored successfully."

      - name: Configure release signing
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")
          if not path.exists():
              path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("ERROR: app/build.gradle not found")

          text = path.read_text()

          signing_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          if "upload-keystore.jks" not in text:
              if "signingConfigs {" in text:
                  text = text.replace("signingConfigs {", "signingConfigs {\n" + signing_block, 1)
              else:
                  text = text.replace("android {", "android {\nsigningConfigs {\n" + signing_block + "\n}", 1)

          text = re.sub(r'signingConfig\s+signingConfigs\.debug', 'signingConfig signingConfigs.release', text)

          path.write_text(text)

          print("Release signing configured.")
          PY

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Find AAB
        run: |
          echo "Searching for AAB..."

          find android -type f -name "*.aab" -print

          AAB=$(find android -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB NOT FOUND"
            exit 1
          fi

          echo ""
          echo "AAB FOUND:"
          echo "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
