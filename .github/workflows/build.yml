name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version Code
        shell: bash
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using Version Code: $VERSION_CODE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify App Source
        run: |
          if [ ! -f App.js ]; then
            echo "ERROR: App.js is missing. Keep your existing app source."
            exit 1
          fi

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Babel Config
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF

      - name: Create index.js
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";
          registerRootComponent(App);
          EOF

      - name: Create app.json
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE}
              }
            }
          }
          EOF

      - name: Expo Prebuild
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

      - name: Fix Splash Resource
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Set Android Minimum SDK to 24
        shell: bash
        run: |
          python3 <<'PYCODE'
          from pathlib import Path
          import re
          import sys

          # Search recursively through all generated gradle files across the native project tree
          candidates = list(Path("android").rglob("*.gradle"))
          changed = []

          print(f"Scanning {len(candidates)} Gradle configuration files for SDK variables...")

          for path in candidates:
              original = path.read_text()
              text = original

              # Pattern 1: Catch variables like minSdkVersion = 23 or minSdk = 23
              text = re.sub(
                  r'\b(minSdkVersion\s*=\s*)\d+',
                  r'\g<1>24',
                  text
              )

              # Pattern 2: Catch space notation like minSdkVersion 23
              text = re.sub(
                  r'\b(minSdkVersion\s+)\d+(\b)',
                  r'\g<1>24\g<2>',
                  text
              )

              # Pattern 3: Catch modern Android DSL configuration lines like minSdk 23 or minSdk = 23
              text = re.sub(
                  r'\b(minSdk\s*=\s*)\d+',
                  r'\g<1>24',
                  text
              )
              text = re.sub(
                  r'\b(minSdk\s+)\d+(\b)',
                  r'\g<1>24\g<2>',
                  text
              )

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          # Double-check specific core native execution files to ensure total Google Play compliance
          app_gradle = Path("android/app/build.gradle")
          root_gradle = Path("android/build.gradle")
          
          all_text = ""
          if app_gradle.exists(): all_text += app_gradle.read_text()
          if root_gradle.exists(): all_text += root_gradle.read_text()

          # Strict structural verification regex match check
          verified = bool(re.search(r'minSdkVersion\s*=\s*24|minSdkVersion\s+24|\bminSdk\s*=\s*24|\bminSdk\s+24', all_text))

          if not verified:
              print("Warning: Standard matching pattern missed base code configurations. Enforcing fallback block injection...")
              if app_gradle.exists():
                  content = app_gradle.read_text()
                  if "minSdkVersion" in content:
                      content = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', content)
                      app_gradle.write_text(content)
                      verified = True

          if not verified:
              sys.exit(
                  "ERROR: Verification failed. The system could not modify the minSdkVersion configuration "
                  "to 24 in the generated native build files."
              )

          print(
              "Success! Minimum SDK version 24 successfully injected and verified.\n"
              + "Modified files: " + (", ".join(changed) if changed else "None (Already set upstream)")
          )
          PYCODE

      - name: Restore Existing Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not restored."
            exit 1
          fi

          echo "Existing signing keystore restored."

      - name: Configure Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Signing secrets are missing."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = re.sub(
              r'(?s)// VYAPAR_SIGNING_START.*?// VYAPAR_SIGNING_END',
              '',
              text
          )

          text = re.sub(
              r'\n\s*signingConfig\s+signingConfigs\.vyaparRelease',
              '',
              text
          )

          text = re.sub(
              r'\n\s*signingConfig\s+signingConfigs\.getByName\(["\']vyaparRelease["\']\)',
              '',
              text
          )

          android_pos = text.find("android {")
          if android_pos == -1:
              raise SystemExit("ERROR: android block not found")

          build_types_pos = text.find("buildTypes {", android_pos)
          if build_types_pos == -1:
              raise SystemExit("ERROR: buildTypes block not found")

          signing_block = '''
              // VYAPAR_SIGNING_START
              signingConfigs {
                  vyaparRelease {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              // VYAPAR_SIGNING_END

          '''

          text = (
              text[:build_types_pos]
              + signing_block
              + text[build_types_pos:]
          )

          build_types_pos = text.find("buildTypes {")
          release_pos = text.find("release {", build_types_pos)

          if release_pos == -1:
              raise SystemExit("ERROR: release block not found")

          depth = 0
          release_end = None

          for i in range(release_pos, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      release_end = i
                      break

          if release_end is None:
              raise SystemExit("ERROR: release block end not found")

          release_content = text[release_pos:release_end]

          if "signingConfig" not in release_content:
              insert_at = release_pos + len("release {")
              text = text[:insert_at] + "\n            signingConfig signingConfigs.vyaparRelease" + text[insert_at:]

          path.write_text(text)
          print("Signing block and configurations successfully injected into build.gradle pipeline.")
          PY

      - name: Build Production Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

