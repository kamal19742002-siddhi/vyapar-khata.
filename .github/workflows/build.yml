
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 4. Check files
      # --------------------------------------------------
      - name: Check project
        shell: bash
        run: |
          echo "===== PROJECT ====="
          ls -la
          echo "==================="

          test -f package.json || {
            echo "ERROR: package.json missing"
            exit 1
          }

          test -f App.js || {
            echo "ERROR: App.js missing"
            exit 1
          }

      # --------------------------------------------------
      # 5. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps

          npm install \
            expo@51.0.39 \
            react@18.2.0 \
            react-native@0.74.5 \
            @react-native-async-storage/async-storage \
            --legacy-peer-deps

          npm install --save-dev \
            babel-preset-expo@11.0.10 \
            --legacy-peer-deps

      # --------------------------------------------------
      # 6. Babel
      # --------------------------------------------------
      - name: Configure Babel
        shell: bash
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF

      # --------------------------------------------------
      # 7. Expo entry
      # --------------------------------------------------
      - name: Configure entry
        shell: bash
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";

          registerRootComponent(App);
          EOF

      # --------------------------------------------------
      # 8. Configure package + app
      # --------------------------------------------------
      - name: Configure Expo
        env:
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const run = parseInt(
            process.env.RUN_NUMBER || "1",
            10
          );

          const packageJson =
            JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );

          packageJson.main = "index.js";

          fs.writeFileSync(
            "package.json",
            JSON.stringify(packageJson, null, 2)
          );

          let app = {
            expo: {}
          };

          if (fs.existsSync("app.json")) {
            app = JSON.parse(
              fs.readFileSync("app.json", "utf8")
            );
          }

          app.expo = app.expo || {};

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = `2.0.${run}`;
          app.expo.orientation = "portrait";

          app.expo.android = {
            ...(app.expo.android || {}),
            package: "com.vyapar.khatabook.free",
            versionCode: 2000 + run
          };

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2)
          );

          console.log(
            "VERSION:",
            `2.0.${run}`
          );

          console.log(
            "VERSION CODE:",
            2000 + run
          );
          NODE

      # --------------------------------------------------
      # 9. Verify Expo
      # --------------------------------------------------
      - name: Verify Expo configuration
        shell: bash
        run: |
          npx expo --version
          npx expo config --type public

      # --------------------------------------------------
      # 10. Prebuild Android
      # --------------------------------------------------
      - name: Generate Android project
        shell: bash
        run: |
          rm -rf android

          npx expo prebuild \
            --platform android \
            --clean \
            --no-install

      # --------------------------------------------------
      # 11. Configure Android SDK 36
      # --------------------------------------------------
      - name: Configure Android SDK 36
        shell: bash
        run: |
          test -f android/app/build.gradle || {
            echo "ERROR: android/app/build.gradle missing"
            exit 1
          }

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          text = p.read_text()

          text = re.sub(
              r'targetSdkVersion\s+\d+',
              'targetSdkVersion 36',
              text
          )

          text = re.sub(
              r'compileSdkVersion\s+\d+',
              'compileSdkVersion 36',
              text
          )

          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 36',
              text
          )

          text = re.sub(
              r'targetSdk\s*=\s*\d+',
              'targetSdk = 36',
              text
          )

          p.write_text(text)

          print("Android SDK 36 configured")
          PY

          touch android/gradle.properties

          grep -q \
            "android.suppressUnsupportedCompileSdk=36" \
            android/gradle.properties || \
            echo "android.suppressUnsupportedCompileSdk=36" \
            >> android/gradle.properties

          grep -q \
            "org.gradle.jvmargs" \
            android/gradle.properties || \
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" \
            >> android/gradle.properties

      # --------------------------------------------------
      # 12. Restore SAME upload keystore
      # --------------------------------------------------
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret missing"
            exit 1
          }

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode >
            android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks || {
            echo "ERROR: Keystore is empty"
            exit 1
          }

          echo "Upload keystore restored"

      # --------------------------------------------------
      # 13. Configure release signing
      # --------------------------------------------------
      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD missing"
            exit 1
          }

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          # Add release signing configuration
          if "storeFile file('upload-keystore.jks')" not in text:
              marker = "signingConfigs {"

              release_block = """
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              """

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + release_block,
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: signingConfigs block not found"
                  )

          # Make release use upload key
          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(text)

          print("Release signing configured")
          PY

      # --------------------------------------------------
      # 14. Verify upload certificate
      # --------------------------------------------------
      - name: Verify upload certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          echo "===== UPLOAD CERTIFICATE ====="

          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E \
              "Alias name|Entry type|SHA1:|SHA-256:" \
              || true

          echo "=============================="

      # --------------------------------------------------
      # 15. Check Gradle
      # --------------------------------------------------
      - name: Check Gradle
        shell: bash
        run: |
          cd android
          chmod +x gradlew

          ./gradlew --version

      # --------------------------------------------------
      # 16. Build AAB
      # --------------------------------------------------
      - name: Build Android Release AAB
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          cd android

          chmod +x gradlew

          ./gradlew \
            bundleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # --------------------------------------------------
      # 17. Find AAB
      # --------------------------------------------------
      - name: Find generated AAB
        shell: bash
        run: |
          echo "===== AAB FILES ====="

          find android \
            -type f \
            -name "*.aab" \
            -print

          AAB=$(find android \
            -type f \
            -name "*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was NOT generated"
            exit 1
          fi

          echo "AAB FOUND:"
          echo "$AAB"

      # --------------------------------------------------
      # 18. Upload AAB artifact
      # --------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
