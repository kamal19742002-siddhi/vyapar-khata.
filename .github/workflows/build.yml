name: Build Vyapar Khata AAB
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Locate project
        id: locate
        shell: bash
        run: |
          PKG_PATH=$(find . -type f -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Found package.json: $PKG_PATH"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Dynamic versioning & SDK update via Expo Config before prebuild
      - name: Inject Version and Target SDK into app.json
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          # Use GITHUB_RUN_NUMBER to guarantee a continuously rising, unique version code
          # Example: If your last build was 1083, offset it by 1100 to get 1100 + run_number
          VERSION_CODE=$((1100 + GITHUB_RUN_NUMBER))
          echo "Setting Android Version Code to: $VERSION_CODE"
          
          node -e "
            const fs = require('fs');
            const file = 'app.json';
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            
            if (!data.expo) data.expo = {};
            if (!data.expo.android) data.expo.android = {};
            
            // Forces the version code to always increase
            data.expo.android.versionCode = $VERSION_CODE;
            
            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          "

      - name: Expo prebuild
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          # Expo explicitly looks for these env variables to set SDK levels during prebuild
          ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
          ANDROID_COMPILE_SDK_VERSION: "36"
          ANDROID_TARGET_SDK_VERSION: "36"
        shell: bash
        run: |
          npx expo prebuild --platform android --no-install

      - name: Restore upload keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created"
            exit 1
          fi
          echo "Keystore restored successfully"

      - name: Configure release signing
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle")
          if not path.exists(): raise SystemExit("ERROR: app/build.gradle not found")
          text = path.read_text()
          if "upload-keystore.jks" not in text:
              signing_block = """
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              """
              text = text.replace("android {", "android {\n" + signing_block, 1)
              text = text.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              if "signingConfig signingConfigs.release" not in text:
                  text = text.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }", 1)
              path.write_text(text)
              print("Release signing configured")
          PY

      - name: Verify configuration
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          echo "=== Final Android configuration ==="
          grep -nE "compileSdk|targetSdk|versionCode|signingConfig" app/build.gradle || true

      - name: Build release AAB
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew bundleRelease --no-daemon

      - name: Find AAB
        shell: bash
        run: |
          AAB=$(find . -type f -name "*.aab" | head -n 1)
          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi
          echo "AAB FOUND: $AAB"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 7
