name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create and Configure App
        run: |
          # Create clean standard Expo app
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata
          
          npm install
          npx expo install expo-document-picker @react-native-async-storage/async-storage expo-contacts expo-image-picker

          # Configure app.json
          node - <<'NODE'
          const fs = require("fs");
          const p = "app.json";
          const app = JSON.parse(fs.readFileSync(p, "utf8"));
          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.41";
          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 41,
            permissions: [
              "android.permission.READ_CONTACTS",
              "android.permission.CAMERA",
              "android.permission.READ_EXTERNAL_STORAGE"
            ]
          };
          fs.writeFileSync(p, JSON.stringify(app, null, 2));
          NODE

          # Create robust App.js
          cat > App.js <<'APPJS'
          import React, { useEffect, useMemo, useState } from "react";
          import {
            Alert,
            Linking,
            SafeAreaView,
            ScrollView,
            Share,
            StatusBar,
            StyleSheet,
            Text,
            TextInput,
            TouchableOpacity,
            View,
            Modal
          } from "react-native";
          import AsyncStorage from "@react-native-async-storage/async-storage";
          import * as DocumentPicker from "expo-document-picker";
          import * as ImagePicker from "expo-image-picker";
          import * as Contacts from "expo-contacts";

          const STORE = "@vyapar_khata_data_v2";
          const PIN_STORE = "@vyapar_khata_pin_v1";
          const MASTER_PIN_STORE = "@vyapar_khata_master_pin_v1";

          const today = () => {
            const d = new Date();
            const day = String(d.getDate()).padStart(2, "0");
            const mon = String(d.getMonth() + 1).padStart(2, "0");
            const yr = d.getFullYear();
            return day + "/" + mon + "/" + yr;
          };

          const Header = ({ title, rightElement }) => (
            <View style={styles.header}>
              <View style={{ flexDirection: "row", justifyContent: "space-between", alignItems: "center" }}>
                <Text style={styles.logoTitle}>{title}</Text>
                {rightElement}
              </View>
            </View>
          );

          const Info = ({ title, value }) => (
            <View style={styles.infoRow}>
              <Text style={styles.infoLabel}>{title}</Text>
              <Text style={styles.infoValue}>{value || "—"}</Text>
            </View>
          );

          const Button = ({ text, onPress, secondary, danger }) => (
            <TouchableOpacity
              style={[
                styles.btn,
                secondary && styles.btnSecondary,
                danger && styles.btnDanger
              ]}
              onPress={onPress}
            >
              <Text
                style={[
                  styles.btnText,
                  secondary && styles.btnTextSecondary,
                  danger && styles.btnTextDanger
                ]}
              >
                {text}
              </Text>
            </TouchableOpacity>
          );

          export default function App() {
            const [savedPin, setSavedPin] = useState(null);
            const [savedMasterPin, setSavedMasterPin] = useState("9999");
            const [isLocked, setIsLocked] = useState(true);
            const [inputPin, setInputPin] = useState("");
            const [newPin, setNewPin] = useState("");
            const [confirmPin, setConfirmPin] = useState("");
            const [isSettingPin, setIsSettingPin] = useState(false);

            const [isMasterMode, setIsMasterMode] = useState(false);
            const [showMasterModal, setShowMasterModal] = useState(false);
            const [masterInputPin, setMasterInputPin] = useState("");

            const [screen, setScreen] = useState("home");
            const [tab, setTab] = useState("Customers");
            const [customers, setCustomers] = useState([]);
            const [suppliers, setSuppliers] = useState([]);
            const [selected, setSelected] = useState(null);

            const [editingPersonId, setEditingPersonId] = useState(null);
            const [name, setName] = useState("");
            const [phone, setPhone] = useState("");
            const [gst, setGst] = useState("");
            const [address, setAddress] = useState("");
            const [email, setEmail] = useState("");

            const [editingEntryId, setEditingEntryId] = useState(null);
            const [docFormat, setDocFormat] = useState("Invoice");
            const [invoiceNo, setInvoiceNo] = useState("");
            const [invoiceDate, setInvoiceDate] = useState(today());
            const [amount, setAmount] = useState("");
            const [paymentMode, setPaymentMode] = useState("Cash");
            const [paymentRef, setPaymentRef] = useState("");
            const [entryType, setEntryType] = useState("Credit");
            const [attachment, setAttachment] = useState(null);

            useEffect(() => {
              loadAuthAndData();
            }, []);

            const loadAuthAndData = async () => {
              try {
                const storedPin = await AsyncStorage.getItem(PIN_STORE);
                const storedMaster = await AsyncStorage.getItem(MASTER_PIN_STORE);
                if (storedMaster) setSavedMasterPin(storedMaster);

                if (storedPin) {
                  setSavedPin(storedPin);
                  setIsLocked(true);
                } else {
                  setIsSettingPin(true);
                  setIsLocked(false);
                }

                const raw = await AsyncStorage.getItem(STORE);
                if (raw) {
                  const data = JSON.parse(raw);
                  setCustomers(data.customers || []);
                  setSuppliers(data.suppliers || []);
                }
              } catch (e) {
                console.log(e);
              }
            };

            const handleUnlock = () => {
              if (inputPin === savedPin) {
                setIsLocked(false);
                setInputPin("");
              } else {
                Alert.alert("Authentication Failed", "Galat Security PIN enter kiya gaya hai.");
                setInputPin("");
              }
            };

            const handleSaveNewPin = async () => {
              if (newPin.length !== 4 || isNaN(Number(newPin))) {
                Alert.alert("Invalid PIN", "4-digit numerical PIN banayein.");
                return;
              }
              if (newPin !== confirmPin) {
                Alert.alert("Mismatch", "PIN match nahi ho rahe.");
                return;
              }
              await AsyncStorage.setItem(PIN_STORE, newPin);
              setSavedPin(newPin);
              setIsSettingPin(false);
              setNewPin("");
              setConfirmPin("");
              Alert.alert("Success", "Security PIN set ho gaya.");
            };

            const handleUnlockMasterMode = () => {
              if (masterInputPin === savedMasterPin) {
                setIsMasterMode(true);
                setShowMasterModal(false);
                setMasterInputPin("");
                Alert.alert("Master Mode Enabled", "Consolidated (Official + Proforma / Quotation) ledger active ho gaya.");
              } else {
                Alert.alert("Access Denied", "Galat Secret Master Code.");
                setMasterInputPin("");
              }
            };

            const saveData = async (c, s) => {
              await AsyncStorage.setItem(
                STORE,
                JSON.stringify({ customers: c, suppliers: s })
              );
            };

            const resetProfile = () => {
              setEditingPersonId(null);
              setName("");
              setPhone("");
              setGst("");
              setAddress("");
              setEmail("");
              resetEntryForm();
            };

            const resetEntryForm = () => {
              setEditingEntryId(null);
              // Automatic default classification:
              // Agar party ke paas valid GST hai toh default "Invoice", warna "Proforma"
              const autoType = (selected && selected.gst && selected.gst.trim().length >= 5) ? "Invoice" : "Proforma";
              setDocFormat(autoType);
              setInvoiceNo("");
              setInvoiceDate(today());
              setAmount("");
              setPaymentMode("Cash");
              setPaymentRef("");
              setEntryType("Credit");
              setAttachment(null);
            };

            const pickContact = async () => {
              try {
                const { status } = await Contacts.requestPermissionsAsync();
                if (status !== "granted") {
                  Alert.alert("Permission Required", "Contacts permission allow karein.");
                  return;
                }
                const contact = await Contacts.presentContactPickerAsync();
                if (contact) {
                  if (contact.name) setName(contact.name);
                  if (contact.phoneNumbers && contact.phoneNumbers.length > 0) {
                    const clean = contact.phoneNumbers[0].number.replace(/[^0-9+]/g, "");
                    setPhone(clean);
                  }
                }
              } catch (err) {
                Alert.alert("Error", "Contact select nahi ho saka.");
              }
            };

            const savePerson = async () => {
              if (!name.trim()) {
                Alert.alert("Required", "Kripya naam enter karein.");
                return;
              }

              const list = tab === "Customers" ? customers : suppliers;

              if (editingPersonId) {
                const updated = list.map((p) =>
                  p.id === editingPersonId
                    ? {
                        ...p,
                        name: name.trim(),
                        phone: phone.trim(),
                        gst: gst.trim(),
                        address: address.trim(),
                        email: email.trim()
                      }
                    : p
                );

                if (tab === "Customers") {
                  setCustomers(updated);
                  await saveData(updated, suppliers);
                } else {
                  setSuppliers(updated);
                  await saveData(customers, updated);
                }

                const fresh = updated.find((x) => x.id === editingPersonId);
                setSelected(fresh);
                resetProfile();
                setScreen("profile");
                Alert.alert("Updated", "Account update ho gaya.");
              } else {
                const person = {
                  id: Date.now().toString(),
                  name: name.trim(),
                  phone: phone.trim(),
                  gst: gst.trim(),
                  address: address.trim(),
                  email: email.trim(),
                  entries: []
                };

                if (tab === "Customers") {
                  const updated = [person, ...customers];
                  setCustomers(updated);
                  await saveData(updated, suppliers);
                } else {
                  const updated = [person, ...suppliers];
                  setSuppliers(updated);
                  await saveData(customers, updated);
                }

                resetProfile();
                setScreen("home");
                Alert.alert("Saved", "Account profile save ho gayi.");
              }
            };

            const startEditProfile = () => {
              if (!selected) return;
              setEditingPersonId(selected.id);
              setName(selected.name);
              setPhone(selected.phone || "");
              setGst(selected.gst || "");
              setAddress(selected.address || "");
              setEmail(selected.email || "");
              setScreen("new");
            };

            const deleteProfile = () => {
              if (!selected) return;
              const typeName = tab === "Customers" ? "Customer" : "Supplier";
              Alert.alert(
                "Delete Account",
                "Kya aap sach me " + selected.name + " ka poora account delete karna chahte hain?",
                [
                  { text: "Cancel", style: "cancel" },
                  {
                    text: "Delete",
                    style: "destructive",
                    onPress: async () => {
                      const list = tab === "Customers" ? customers : suppliers;
                      const updated = list.filter((p) => p.id !== selected.id);
                      if (tab === "Customers") {
                        setCustomers(updated);
                        await saveData(updated, suppliers);
                      } else {
                        setSuppliers(updated);
                        await saveData(customers, updated);
                      }
                      setSelected(null);
                      setScreen("home");
                      Alert.alert("Deleted", typeName + " delete ho gaya.");
                    }
                  }
                ]
              );
            };

            const startEditEntry = (entry) => {
              setEditingEntryId(entry.id);
              setDocFormat(entry.docFormat || "Invoice");
              setInvoiceNo(entry.invoiceNo);
              setInvoiceDate(entry.invoiceDate);
              setAmount(String(entry.amount));
              setPaymentMode(entry.paymentMode || "Cash");
              setPaymentRef(entry.paymentRef || "");
              setEntryType(entry.type || "Credit");
              setAttachment(
                entry.attachment
                  ? { name: entry.attachment, uri: entry.attachmentUri }
                  : null
              );
            };

            const deleteEntry = (entryId) => {
