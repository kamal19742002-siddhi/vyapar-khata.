name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Vyapar Khata Project
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata

          npm install

          npx expo install expo-document-picker
          npx expo install @react-native-async-storage/async-storage
          npx expo install @react-native-picker/picker

          node - <<'NODE'
          const fs = require("fs");

          const file = "app.json";
          const app = JSON.parse(fs.readFileSync(file, "utf8"));

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.28";

          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 28
          };

          fs.writeFileSync(file, JSON.stringify(app, null, 2));
          NODE

          cat > App.js <<'APPJS'
          import React, { useEffect, useState } from "react";
          import {
            Alert,
            FlatList,
            SafeAreaView,
            ScrollView,
            StatusBar,
            StyleSheet,
            Text,
            TextInput,
            TouchableOpacity,
            View
          } from "react-native";

          import AsyncStorage from "@react-native-async-storage/async-storage";
          import * as DocumentPicker from "expo-document-picker";
          import { Picker } from "@react-native-picker/picker";

          const STORAGE_KEY = "@vyapar_khata_entries_v1";

          const today = () => {
            const d = new Date();
            const day = String(d.getDate()).padStart(2, "0");
            const month = String(d.getMonth() + 1).padStart(2, "0");
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
          };

          export default function App() {

            const [activeTab, setActiveTab] = useState("Customers");
            const [entries, setEntries] = useState([]);

            const [name, setName] = useState("");
            const [invoiceNo, setInvoiceNo] = useState("");
            const [invoiceDate, setInvoiceDate] = useState(today());
            const [amount, setAmount] = useState("");
            const [paymentMode, setPaymentMode] = useState("Cash");
            const [attachment, setAttachment] = useState(null);

            useEffect(() => {
              loadEntries();
            }, []);

            const loadEntries = async () => {
              try {
                const saved = await AsyncStorage.getItem(STORAGE_KEY);

                if (saved) {
                  setEntries(JSON.parse(saved));
                } else {
                  setEntries([
                    {
                      id: "1",
                      type: "Customers",
                      name: "Ramesh Kumar",
                      invoiceNo: "INV-001",
                      invoiceDate: today(),
                      amount: 500,
                      paymentMode: "Credit",
                      attachment: null,
                      createdAt: Date.now()
                    },
                    {
                      id: "2",
                      type: "Customers",
                      name: "Suresh Patel",
                      invoiceNo: "INV-002",
                      invoiceDate: today(),
                      amount: 1200,
                      paymentMode: "UPI",
                      attachment: null,
                      createdAt: Date.now()
                    },
                    {
                      id: "3",
                      type: "Suppliers",
                      name: "ABC Traders",
                      invoiceNo: "PUR-001",
                      invoiceDate: today(),
                      amount: 2500,
                      paymentMode: "Bank",
                      attachment: null,
                      createdAt: Date.now()
                    }
                  ]);
                }
              } catch (e) {
                console.log(e);
              }
            };

            const saveEntries = async (data) => {
              try {
                await AsyncStorage.setItem(
                  STORAGE_KEY,
                  JSON.stringify(data)
                );
              } catch (e) {
                console.log(e);
              }
            };

            const chooseAttachment = async () => {
              try {
                const result = await DocumentPicker.getDocumentAsync({
                  type: [
                    "image/*",
                    "application/pdf"
                  ],
                  copyToCacheDirectory: true
                });

                if (!result.canceled && result.assets?.length > 0) {
                  setAttachment(result.assets[0]);
                }
              } catch (e) {
                Alert.alert(
                  "Attachment",
                  "Unable to select the invoice copy."
                );
              }
            };

            const addEntry = async () => {

              if (!name.trim()) {
                Alert.alert(
                  "Missing Information",
                  "Please enter Customer or Supplier name."
                );
                return;
              }

              if (!amount.trim()) {
                Alert.alert(
                  "Missing Information",
                  "Please enter amount."
                );
                return;
              }

              const numericAmount = Number(amount);

              if (
                !Number.isFinite(numericAmount) ||
                numericAmount <= 0
              ) {
                Alert.alert(
                  "Invalid Amount",
                  "Please enter a valid amount."
                );
                return;
              }

              const newEntry = {
                id: Date.now().toString(),
                type: activeTab,
                name: name.trim(),
                invoiceNo:
                  invoiceNo.trim() ||
                  `${activeTab === "Customers" ? "INV" : "PUR"}-${Date.now()}`,
                invoiceDate: invoiceDate.trim() || today(),
                amount: numericAmount,
                paymentMode,
                attachment: attachment
                  ? {
                      name: attachment.name,
                      uri: attachment.uri,
                      mimeType: attachment.mimeType || ""
                    }
                  : null,
                createdAt: Date.now()
              };

              const updated = [
                newEntry,
                ...entries
              ];

              setEntries(updated);
              await saveEntries(updated);

              setName("");
              setInvoiceNo("");
              setInvoiceDate(today());
              setAmount("");
              setPaymentMode("Cash");
              setAttachment(null);

              Alert.alert(
                "Saved",
                `${activeTab === "Customers" ? "Customer" : "Supplier"} entry saved successfully.`
              );
            };

            const filteredEntries = entries.filter(
              item => item.type === activeTab
            );

            const customerTotal = entries
              .filter(item => item.type === "Customers")
              .reduce((sum, item) => sum + Number(item.amount || 0), 0);

            const supplierTotal = entries
              .filter(item => item.type === "Suppliers")
              .reduce((sum, item) => sum + Number(item.amount || 0), 0);

            const openEntry = (item) => {
              Alert.alert(
                item.name,
                `Invoice No: ${item.invoiceNo}\n` +
                `Invoice Date: ${item.invoiceDate}\n` +
                `Amount: ₹${item.amount}\n` +
                `Payment Mode: ${item.paymentMode}\n` +
                `Invoice Copy: ${item.attachment ? item.attachment.name : "Not attached"}`
              );
            };

            const renderEntry = ({ item }) => (
              <TouchableOpacity
                style={styles.entryCard}
                onPress={() => openEntry(item)}
              >

                <View style={styles.entryLeft}>

                  <Text style={styles.entryName}>
                    {item.name}
                  </Text>

                  <Text style={styles.entryInvoice}>
                    Invoice: {item.invoiceNo}
                  </Text>

                  <Text style={styles.entryDate}>
                    Date: {item.invoiceDate}
                  </Text>

                  <Text style={styles.entryPayment}>
                    Payment: {item.paymentMode}
                  </Text>

                  {item.attachment ? (
                    <Text style={styles.attachmentText}>
                      📎 {item.attachment.name}
                    </Text>
                  ) : null}

                </View>

                <View style={styles.entryRight}>

                  <Text style={styles.amount}>
                    ₹{Number(item.amount).toLocaleString("en-IN")}
                  </Text>

                  <Text style={styles.viewText}>
                    View
                  </Text>

                </View>

              </TouchableOpacity>
            );

            return (
              <SafeAreaView style={styles.container}>

                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#0759a8"
                />

                <ScrollView
                  contentContainerStyle={styles.scroll}
                  keyboardShouldPersistTaps="handled"
                >

                  <View style={styles.header}>

                    <Text style={styles.logoTitle}>
                      Vyapar Khata
                    </Text>

                    <Text style={styles.subtitle}>
                      Digital Business Ledger
                    </Text>

                    <Text style={styles.businessName}>
                      Siddhi Enterprises
                    </Text>

                  </View>

                  <View style={styles.summary}>

                    <View style={styles.summaryBox}>
                      <Text style={styles.summaryLabel}>
                        Customers
                      </Text>

                      <Text style={styles.summaryValue}>
                        ₹{customerTotal.toLocaleString("en-IN")}
                      </Text>
                    </View>

                    <View style={styles.summaryBox}>
                      <Text style={styles.summaryLabel}>
                        Suppliers
                      </Text>

                      <Text style={styles.summaryValue}>
                        ₹{supplierTotal.toLocaleString("en-IN")}
                      </Text>
                    </View>

                  </View>

                  <View style={styles.tabs}>

                    <TouchableOpacity
                      style={[
                        styles.tab,
                        activeTab === "Customers" &&
                        styles.activeTab
                      ]}
                      onPress={() => setActiveTab("Customers")}
                    >
                      <Text
                        style={[
                          styles.tabText,
                          activeTab === "Customers" &&
                          styles.activeTabText
                        ]}
                      >
                        CUSTOMERS
                      </Text>
                    </TouchableOpacity>

                    <TouchableOpacity
                      style={[
                        styles.tab,
                        activeTab === "Suppliers" &&
                        styles.activeTab
                      ]}
                      onPress={() => setActiveTab("Suppliers")}
                    >
                      <Text
                        style={[
                          styles.tabText,
                          activeTab === "Suppliers" &&
                          styles.activeTabText
                        ]}
                      >
                        SUPPLIERS
                      </Text>
                    </TouchableOpacity>

                  </View>

                  <View style={styles.formCard}>

                    <Text style={styles.formTitle}>
                      {activeTab === "Customers"
                        ? "New Customer Entry"
                        : "New Supplier Entry"}
                    </Text>

                    <TextInput
                      style={styles.input}
                      placeholder={
                        activeTab === "Customers"
                          ? "Customer Name"
                          : "Supplier Name"
                      }
                      placeholderTextColor="#777"
                      value={name}
                      onChangeText={setName}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Invoice Number"
                      placeholderTextColor="#777"
                      value={invoiceNo}
                      onChangeText={setInvoiceNo}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Invoice Date (DD/MM/YYYY)"
                      placeholderTextColor="#777"
                      value={invoiceDate}
                      onChangeText={setInvoiceDate}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Amount (₹)"
                      placeholderTextColor="#777"
                      keyboardType="numeric"
                      value={amount}
                      onChangeText={setAmount}
                    />

                    <View style={styles.pickerBox}>

                      <Text style={styles.pickerLabel}>
                        Mode of Payment
                      </Text>

                      <Picker
                        selectedValue={paymentMode}
                        onValueChange={value =>
                          setPaymentMode(value)
                        }
                        style={styles.picker}
                      >
                        <Picker.Item
                          label="Cash"
                          value="Cash"
                        />

                        <Picker.Item
                          label="UPI"
                          value="UPI"
                        />

                        <Picker.Item
                          label="Bank Transfer"
                          value="Bank"
                        />

                        <Picker.Item
                          label="Cheque"
                          value="Cheque"
                        />

                        <Picker.Item
                          label="Credit"
                          value="Credit"
                        />

                        <Picker.Item
                          label="Other"
                          value="Other"
                        />

                      </Picker>

                    </View>

                    <TouchableOpacity
                      style={styles.attachButton}
                      onPress={chooseAttachment}
                    >
                      <Text style={styles.attachText}>
                        📎 Attach Invoice Copy
                      </Text>
                    </TouchableOpacity>

                    {attachment ? (
                      <Text style={styles.selectedFile}>
                        Selected: {attachment.name}
                      </Text>
                    ) : null}

                    <TouchableOpacity
                      style={styles.saveButton}
                      onPress={addEntry}
                    >
                      <Text style={styles.saveText}>
                        + SAVE ENTRY
                      </Text>
                    </TouchableOpacity>

                  </View>

                  <View style={styles.passbookCard}>

                    <View>
                      <Text style={styles.passbookTitle}>
                        Passbook
                      </Text>

                      <Text style={styles.passbookSub}>
                        View all account entries
                      </Text>
                    </View>

                    <TouchableOpacity
                      style={styles.passbookButton}
                      onPress={() =>
                        Alert.alert(
                          "Passbook",
                          `Customers: ${entries.filter(e => e.type === "Customers").length}\n` +
                          `Suppliers: ${entries.filter(e => e.type === "Suppliers").length}`
                        )
                      }
                    >
                      <Text style={styles.passbookButtonText}>
                        OPEN
                      </Text>
                    </TouchableOpacity>

                  </View>

                  <View style={styles.sectionHeader}>

                    <Text style={styles.sectionTitle}>
                      {activeTab}
                    </Text>

                    <Text style={styles.count}>
                      {filteredEntries.length} Entries
                    </Text>

                  </View>

                  <FlatList
                    data={filteredEntries}
                    keyExtractor={item => item.id}
                    renderItem={renderEntry}
                    scrollEnabled={false}
                    ListEmptyComponent={
                      <View style={styles.empty}>
                        <Text style={styles.emptyText}>
                          No {activeTab.toLowerCase()} entries yet.
                        </Text>
                      </View>
                    }
                  />

                  <View style={styles.footerSpace} />

                </ScrollView>

              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({

            container: {
              flex: 1,
              backgroundColor: "#f3f6fa"
            },

            scroll: {
              paddingBottom: 30
            },

            header: {
              backgroundColor: "#0759a8",
              paddingTop: 25,
              paddingBottom: 22,
              paddingHorizontal: 20
            },

            logoTitle: {
              color: "#fff",
              fontSize: 29,
              fontWeight: "800"
            },

            subtitle: {
              color: "#dbeaff",
              fontSize: 15,
              marginTop: 4
            },

            businessName: {
              color: "#fff",
              fontSize: 14,
              marginTop: 14,
              fontWeight: "600"
            },

            summary: {
              flexDirection: "row",
              backgroundColor: "#fff",
              marginHorizontal: 14,
              marginTop: -2,
              borderRadius: 16,
              paddingVertical: 18,
              elevation: 4,
              shadowOpacity: 0.1
            },

            summaryBox: {
              flex: 1,
              alignItems: "center"
            },

            summaryLabel: {
              color: "#555",
              fontSize: 14,
              marginBottom: 6
            },

            summaryValue: {
              color: "#16835c",
              fontSize: 22,
              fontWeight: "800"
            },

            tabs: {
              flexDirection: "row",
              backgroundColor: "#0759a8",
              marginTop: 15
            },

            tab: {
              flex: 1,
              alignItems: "center",
              paddingVertical: 14
            },

            activeTab: {
              borderBottomWidth: 4,
              borderBottomColor: "#ffc928"
            },

            tabText: {
              color: "#dcecff",
              fontSize: 15,
              fontWeight: "700"
            },

            activeTabText: {
              color: "#fff"
            },

            formCard: {
              backgroundColor: "#fff",
              margin: 14,
              padding: 18,
              borderRadius: 18,
              elevation: 3
            },

            formTitle: {
              fontSize: 21,
              fontWeight: "800",
              color: "#252525",
              marginBottom: 14
            },

            input: {
              borderWidth: 1,
              borderColor: "#d4d8de",
              borderRadius: 12,
              paddingHorizontal: 14,
              paddingVertical: 13,
              fontSize: 16,
              color: "#222",
              marginBottom: 11,
              backgroundColor: "#fafbfc"
            },

            pickerBox: {
              borderWidth: 1,
              borderColor: "#d4d8de",
              borderRadius: 12,
              marginBottom: 12,
              overflow: "hidden"
            },

            pickerLabel: {
              fontSize: 12,
              color: "#666",
              paddingLeft: 14,
              paddingTop: 8
            },

            picker: {
              height: 50
            },

            attachButton: {
              backgroundColor: "#e9f2ff",
              borderWidth: 1,
              borderColor: "#b9d5f7",
              paddingVertical: 14,
              borderRadius: 12,
              alignItems: "center",
              marginBottom: 8
            },

            attachText: {
              color: "#0759a8",
              fontSize: 15,
              fontWeight: "700"
            },

            selectedFile: {
              color: "#16835c",
              fontSize: 13,
              marginBottom: 10
            },

            saveButton: {
              backgroundColor: "#0759a8",
              paddingVertical: 16,
              borderRadius: 12,
              alignItems: "center",
              marginTop: 4
            },

            saveText: {
              color: "#fff",
              fontSize: 16,
              fontWeight: "800"
            },

            passbookCard: {
              backgroundColor: "#fff",
              marginHorizontal: 14,
              marginBottom: 15,
              padding: 16,
              borderRadius: 16,
              flexDirection: "row",
              justifyContent: "space-between",
              alignItems: "center",
              elevation: 2
            },

            passbookTitle: {
              fontSize: 19,
              fontWeight: "800",
              color: "#222"
            },

            passbookSub: {
              color: "#777",
              marginTop: 4
            },

            passbookButton: {
              backgroundColor: "#16835c",
              paddingHorizontal: 20,
              paddingVertical: 11,
              borderRadius: 10
            },

            passbookButtonText: {
              color: "#fff",
              fontWeight: "800"
            },

            sectionHeader: {
              flexDirection: "row",
              justifyContent: "space-between",
              alignItems: "center",
              paddingHorizontal: 18,
              marginBottom: 8
            },

            sectionTitle: {
              fontSize: 22,
              fontWeight: "800",
              color: "#222"
            },

            count: {
              color: "#777",
              fontSize: 14
            },

            entryCard: {
              backgroundColor: "#fff",
              marginHorizontal: 14,
              marginBottom: 9,
              padding: 15,
              borderRadius: 14,
              flexDirection: "row",
              justifyContent: "space-between",
              elevation: 2
            },

            entryLeft: {
              flex: 1,
              paddingRight: 10
            },

            entryRight: {
              alignItems: "flex-end",
              justifyContent: "center"
            },

            entryName: {
              fontSize: 17,
              fontWeight: "800",
              color: "#222"
            },

            entryInvoice: {
              color: "#0759a8",
              fontSize: 13,
              marginTop: 5
            },

            entryDate: {
              color: "#777",
              fontSize: 12,
              marginTop: 3
            },

            entryPayment: {
              color: "#555",
              fontSize: 12,
              marginTop: 3
            },

            attachmentText: {
              color: "#16835c",
              fontSize: 12,
              marginTop: 5
            },

            amount: {
              color: "#b3263e",
              fontSize: 19,
              fontWeight: "800"
            },

            viewText: {
              color: "#0759a8",
              marginTop: 5,
              fontWeight: "700"
            },

            empty: {
              backgroundColor: "#fff",
              marginHorizontal: 14,
              padding: 25,
              borderRadius: 14,
              alignItems: "center"
            },

            emptyText: {
              color: "#777",
              fontSize: 15
            },

            footerSpace: {
              height: 30
            }

          });
          APPJS

          npx expo prebuild --platform android --no-install

      - name: Restore Existing Permanent Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks
          test -s vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Permanent Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          data = p.read_text()

          release_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          if "signingConfigs {" not in data:
              raise SystemExit("signingConfigs block not found")

          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + release_block,
              1
          )

          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(data)
          PY

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release-v28
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
