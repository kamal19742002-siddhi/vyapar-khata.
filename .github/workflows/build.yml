name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version Code
        shell: bash
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using Version Code: $VERSION_CODE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify App Source
        run: |
          if [ ! -f App.js ]; then
            echo "ERROR: App.js is missing. Keep your existing app source."
            exit 1
          fi

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Babel Config
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF

      - name: Create index.js
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";
          registerRootComponent(App);
          EOF

      - name: Create app.json
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE}
              }
            }
          }
          EOF

      - name: Expo Prebuild
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

      - name: Fix Splash Resource
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Set Android Minimum SDK to 24
        shell: bash
        run: |
          python3 <<'PYCODE'
          from pathlib import Path
          import re
          import sys

          candidates = [
              Path("android/build.gradle"),
              Path("android/app/build.gradle"),
          ]

          changed = []

          for path in candidates:
              if not path.exists():
                  continue

              original = path.read_text()
              text = original

              text = re.sub(
                  r'(minSdkVersion\s*=\s*)\d+',
                  r'\g<1>24',
                  text
              )

              text = re.sub(
                  r'(minSdkVersion\s+)\d+(\b)',
                  r'\g<1>24\g<2>',
                  text
              )

              text = re.sub(
                  r'(minSdk\s*=\s*)\d+',
                  r'\g<1>24',
                  text
              )

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          all_text = "\n".join(
              p.read_text() for p in candidates if p.exists()
          )

          verified = bool(re.search(
              r'minSdkVersion\s*=\s*24|minSdkVersion\s+24|\bminSdk\s*=\s*24',
              all_text
          ))

          if not verified:
              sys.exit(
                  "ERROR: Could not verify minSdkVersion 24 "
                  "in generated Gradle files."
              )

          print(
              "Minimum SDK 24 verified. Updated: "
              + (", ".join(changed) if changed else "existing setting already 24")
          )
          PYCODE

      - name: Restore Existing Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not restored."
            exit 1
          fi

          echo "Existing signing keystore restored."

      - name: Configure Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Signing secrets are missing."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = re.sub(
              r'(?s)// VYAPAR_SIGNING_START.*?// VYAPAR_SIGNING_END',
              '',
              text
          )

          text = re.sub(
              r'\n\s*signingConfig\s+signingConfigs\.vyaparRelease',
              '',
              text
          )

          text = re.sub(
              r'\n\s*signingConfig\s+signingConfigs\.getByName\(["\']vyaparRelease["\']\)',
              '',
              text
          )

          android_pos = text.find("android {")
          if android_pos == -1:
              raise SystemExit("ERROR: android block not found")

          build_types_pos = text.find("buildTypes {", android_pos)
          if build_types_pos == -1:
              raise SystemExit("ERROR: buildTypes block not found")

          signing_block = '''
              // VYAPAR_SIGNING_START
              signingConfigs {
                  vyaparRelease {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              // VYAPAR_SIGNING_END

          '''

          text = (
              text[:build_types_pos]
              + signing_block
              + text[build_types_pos:]
          )

          build_types_pos = text.find("buildTypes {", android_pos)
          release_pos = text.find("release {", build_types_pos)

          if release_pos == -1:
              raise SystemExit("ERROR: release block not found")

          depth = 0
          release_end = None

          for i in range(release_pos, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      release_end = i
                      break

          if release_end is None:
              raise SystemExit("ERROR: release block end not found")

          release_content = text[release_pos:release_end]

          if "signingConfig" not in release_content:
              insert_at = release_pos + len("release {")
              text = (
                  text[:insert_at]
                  + "\n        signingConfig signingConfigs.vyaparRelease\n"
                  + text[insert_at:]
              )

          path.write_text(text)
          print("Signing configuration added.")
          PY

      - name: Verify Signing Configuration
        run: |
          grep -n -A12 -B3 "VYAPAR_SIGNING_START" \
            android/app/build.gradle || true

          grep -n "signingConfig" \
            android/app/build.gradle || true

      - name: Verify Existing Signing Key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Fix Expo Modules Core Kotlin
        run: |
          FILE="node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: PermissionsService.kt not found."
            exit 1
          fi

          echo "===== ORIGINAL SOURCE ====="
          nl -ba "$FILE" | sed -n '158,172p'

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()

          if len(lines) < 166:
              raise SystemExit("ERROR: Source has fewer than 166 lines.")

          index = 165
          line = lines[index]
          print("Original line 166:", line)

          patterns = [
              (r'(\b[A-Za-z_]\w*)\.contains\(', r'\1!!.contains('),
              (r'(\b[A-Za-z_]\w*)\.any\s*\{', r'\1!!.any {'),
              (r'(\b[A-Za-z_]\w*)\.indexOf\(', r'\1!!.indexOf('),
              (r'(\b[A-Za-z_]\w*)\.isEmpty\(\)', r'\1!!.isEmpty()'),
              (r'(\b[A-Za-z_]\w*)\.isNotEmpty\(\)', r'\1!!.isNotEmpty()')
          ]

          patched = line

          for pattern, replacement in patterns:
              candidate = re.sub(pattern, replacement, patched, count=1)
              if candidate != patched:
                  patched = candidate
                  break

          if patched == line:
              raise SystemExit(
                  "ERROR: Could not safely identify the nullable operation "
                  "on line 166. No change was made."
              )

          lines[index] = patched
          path.write_text("\n".join(lines) + "\n")

          print("Patched line 166:", patched)
          PY

          echo "===== PATCHED SOURCE ====="
          nl -ba "$FILE" | sed -n '158,172p'

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Check AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not created."
            exit 1
          fi

          echo "Package Name: ${PACKAGE_NAME}"
          echo "Version Code: ${VERSION_CODE}"
          echo "AAB File: ${AAB}"
          ls -lh "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build Successful
        run: |
          echo "Vyapar Khata build completed."
          echo "Package: ${PACKAGE_NAME}"
          echo "Version Code: ${VERSION_CODE}"
