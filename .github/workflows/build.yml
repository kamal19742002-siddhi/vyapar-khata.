          APPJS

      - name: Create Android Project
        run: |
          cd vyapar-khata
          npx expo prebuild --platform android --no-install

      - name: Verify Android Project
        run: |
          test -f vyapar-khata/android/app/build.gradle
          echo "Android app build.gradle found successfully."

      - name: Setup Signing and Memory Optimizations
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd vyapar-khata

          # Decode Keystore if available
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "Keystore written to android/app/upload-keystore.jks"
          fi

          # Add memory limits to gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

          # Inject Release Signing into android/app/build.gradle
          python3 - << 'EOF'
          import os

          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r") as f:
                  data = f.read()

              release_block = """
                      release {
                          storeFile file('upload-keystore.jks')
                          storePassword System.getenv('KEYSTORE_PASSWORD')
                          keyAlias System.getenv('KEY_ALIAS')
                          keyPassword System.getenv('KEY_PASSWORD')
                      }
              """
              if "signingConfigs {" in data and "release {" not in data:
                  data = data.replace("signingConfigs {", "signingConfigs {" + release_block, 1)
                  data = data.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
                  with open(gradle_path, "w") as f:
                      f.write(data)
                  print("Signing config successfully added to app/build.gradle")
          EOF

      - name: Grant Execute Permission for Gradlew
        run: chmod +x vyapar-khata/android/gradlew

      - name: Build Android App Bundle (AAB)
        working-directory: vyapar-khata/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
