
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version Code
        shell: bash
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Version Code: $VERSION_CODE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "scripts": {
              "start": "expo start",
              "android": "expo run:android"
            },
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "expo-contacts": "~13.0.5",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF

      - name: Install Dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps

      - name: Create Babel Config
        shell: bash
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ['babel-preset-expo']
            };
          };
          EOF

      - name: Create index.js
        shell: bash
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from 'expo';
          import App from './App';

          registerRootComponent(App);
          EOF

      - name: Create app.json
        shell: bash
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",

              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE},
                "permissions": [
                  "READ_CONTACTS"
                ]
              },

              "plugins": [
                [
                  "expo-contacts",
                  {
                    "contactsPermission": "Allow Vyapar Khata to access your contacts so you can add customers and suppliers."
                  }
                ]
              ]
            }
          }
          EOF

      - name: Expo Prebuild
        shell: bash
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

      - name: Fix Kotlin Compatibility
        shell: bash
        run: |
          echo "Applying Kotlin compatibility fix..."

          cat >> android/gradle.properties <<'EOF'

          # Kotlin compatibility
          kotlin.code.style=official
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Force Kotlin 1.9.24
          if [ -f android/build.gradle ]; then
            python3 <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle")
          text = path.read_text()

          # Replace existing Kotlin plugin versions
          import re

          text = re.sub(
              r'kotlinVersion\s*=\s*["\'][^"\']+["\']',
              'kotlinVersion = "1.9.24"',
              text
          )

          text = re.sub(
              r'kotlin_version\s*=\s*["\'][^"\']+["\']',
              'kotlin_version = "1.9.24"',
              text
          )

          if 'kotlinVersion = "1.9.24"' not in text and \
             'kotlin_version = "1.9.24"' not in text:

              if 'ext {' in text:
                  text = text.replace(
                      'ext {',
                      'ext {\n        kotlinVersion = "1.9.24"',
                      1
                  )
              else:
                  text = 'ext {\n    kotlinVersion = "1.9.24"\n}\n\n' + text

          path.write_text(text)

          print("Kotlin version configured.")
          PY
          fi

      - name: Fix Expo Modules Kotlin Source
        shell: bash
        run: |
          FILE="node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt"

          if [ -f "$FILE" ]; then
            echo "Patching PermissionsService.kt..."

            python3 <<'PY'
          from pathlib import Path

          path = Path(
              "node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt"
          )

          text = path.read_text()

          old = "manifestPermissions.map { it }"

          if old in text:
              text = text.replace(
                  old,
                  "manifestPermissions?.map { it } ?: emptyArray()"
              )

          old2 = "manifestPermissions.map"

          if old2 in text and "manifestPermissions?.map" not in text:
              text = text.replace(
                  old2,
                  "manifestPermissions?.map"
              )

          path.write_text(text)

          print("PermissionsService.kt patched.")
          PY
          else
            echo "PermissionsService.kt not found - continuing."
          fi

      - name: Fix Android Splash Resource
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Configure Android SDK 36
        shell: bash
        run: |
          cat >> android/gradle.properties <<'EOF'

          android.compileSdkVersion=36
          android.targetSdkVersion=36
          android.buildToolsVersion=36.0.0
          EOF

      - name: Restore Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          echo "Existing signing keystore restored."

      - name: Configure Release Signing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          def find_block_end(s, start):
              depth = 0
              opened = False

              for i in range(start, len(s)):
                  if s[i] == "{":
                      depth += 1
                      opened = True

                  elif s[i] == "}":
                      depth -= 1

                      if opened and depth == 0:
                          return i + 1

              return -1

          # Add keystore properties loader
          if "keystorePropertiesFile" not in text:
              block = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''

              text = text.replace(
                  "android {",
                  block + "android {",
                  1
              )

          android_pos = text.find("android {")

          if android_pos == -1:
              raise SystemExit("ERROR: android block not found")

          android_end = find_block_end(text, android_pos)

          signing_pos = text.find(
              "signingConfigs {",
              android_pos,
              android_end
          )

          if signing_pos == -1:
              signing = r'''
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }

          '''

              insert_pos = android_pos + len("android {")

              text = (
                  text[:insert_pos]
                  + signing
                  + text[insert_pos:]
              )

          android_pos = text.find("android {")
          android_end = find_block_end(text, android_pos)

          build_types_pos = text.find(
              "buildTypes {",
              android_pos,
              android_end
          )

          if build_types_pos == -1:
              raise SystemExit("ERROR: buildTypes block not found")

          build_types_end = find_block_end(
              text,
              build_types_pos
          )

          build_types_block = text[
              build_types_pos:build_types_end
          ]

          release_relative = build_types_block.find(
              "release {"
          )

          if release_relative != -1:

              release_pos = (
                  build_types_pos
                  + release_relative
              )

              release_end = find_block_end(
                  text,
                  release_pos
              )

              release_block = text[
                  release_pos:release_end
              ]

              if "signingConfig signingConfigs.release" not in release_block:

                  insert_pos = release_pos + len("release {")

                  text = (
                      text[:insert_pos]
                      + "\n            signingConfig signingConfigs.release"
                      + text[insert_pos:]
                  )

          else:

              release_block = r'''
                  release {
                      signingConfig signingConfigs.release
                  }
              '''

              text = (
                  text[:build_types_end - 1]
                  + release_block
                  + "\n"
                  + text[build_types_end - 1:]
              )

          path.write_text(text)

          print("Release signing configured successfully.")
          PY

      - name: Verify Configuration
        shell: bash
        run: |
          echo "======================================"
          echo "VYAPAR KHATA BUILD"
          echo "======================================"
          echo "Package      : ${PACKAGE_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "======================================"

          node --version
          java -version

          echo "Checking App.js..."
          test -f App.js

          echo "Checking Android project..."
          test -d android

          echo "Configuration OK."

      - name: Build Release AAB
        shell: bash
        run: |
          cd android

          chmod +x gradlew

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Check AAB
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          echo "======================================"
          echo "AAB CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build Successful
        shell: bash
        run: |
          echo "======================================"
          echo "VYAPAR KHATA BUILD SUCCESSFUL"
          echo "======================================"
          echo "Package      : ${PACKAGE_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "======================================"
