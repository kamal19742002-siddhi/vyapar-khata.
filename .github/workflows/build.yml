name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "1.0.0",
            "private": true,
            "main": "index.js",
            "scripts": {
              "start": "expo start"
            },
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "expo-contacts": "~13.0.5",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "^11.0.0"
            }
          }
          EOF

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps

      - name: Create Babel config
        shell: bash
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ['babel-preset-expo']
            };
          };
          EOF

      - name: Create index.js
        shell: bash
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from 'expo';
          import App from './App';

          registerRootComponent(App);
          EOF

      - name: Create assets
        shell: bash
        run: |
          mkdir -p assets

          python3 - <<'PY'
          import base64

          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )

          for name in [
              "icon.png",
              "adaptive-icon.png",
              "splash.png",
              "favicon.png"
          ]:
              with open("assets/" + name, "wb") as f:
                  f.write(png)
          PY

      - name: Create Expo app.json
        shell: bash
        run: |
          VERSION_CODE=$((3000 + GITHUB_RUN_NUMBER))

          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "icon": "./assets/icon.png",
              "userInterfaceStyle": "light",

              "splash": {
                "image": "./assets/splash.png",
                "resizeMode": "contain",
                "backgroundColor": "#ffffff"
              },

              "android": {
                "package": "com.vyapar.khatabook.free",
                "versionCode": ${VERSION_CODE},
                "compileSdkVersion": 36,
                "targetSdkVersion": 36,

                "permissions": [
                  "android.permission.READ_CONTACTS"
                ],

                "adaptiveIcon": {
                  "foregroundImage": "./assets/adaptive-icon.png",
                  "backgroundColor": "#ffffff"
                }
              },

              "plugins": [
                "expo-contacts"
              ]
            }
          }
          EOF

          echo "Version Code: ${VERSION_CODE}"

      - name: Prebuild Android
        shell: bash
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Verify Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not created."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Gradle wrapper was not created."
            exit 1
          fi

          echo "Android project created successfully."

      - name: Check Android SDK
        shell: bash
        run: |
          echo "Android project:"
          ls -la android

          echo "Gradle wrapper:"
          ls -lh android/gradlew

      - name: Check signing secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "ERROR: KEY_ALIAS is missing"
            exit 1
          fi

          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "ERROR: KEY_PASSWORD is missing"
            exit 1
          fi

          echo "All signing secrets are available."

      - name: Restore signing keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vyapar-upload.jks

          if [ ! -s "android/app/vyapar-upload.jks" ]; then
            echo "ERROR: Keystore file is empty or was not created."
            exit 1
          fi

          echo "Keystore restored successfully."

      - name: Verify keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/app/vyapar-upload.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Build Release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/vyapar-upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify AAB
        shell: bash
        run: |
          echo "Checking AAB..."

          if [ ! -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "ERROR: app-release.aab was not generated."
            exit 1
          fi

          ls -lh android/app/build/outputs/bundle/release/app-release.aab

          echo "=========================================="
          echo "       AAB BUILD SUCCESSFUL"
          echo "=========================================="

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
