name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Expo App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank@sdk-51 --no-install
          cd vyapar-khata

          npm install

          npx expo install @react-native-async-storage/async-storage

      - name: Configure App
        working-directory: vyapar-khata
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.${{ github.run_number }}";

          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 1000 + ${{ github.run_number }}
          };

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2)
          );
          NODE

      - name: Create App.js
        working-directory: vyapar-khata
        run: |
          cat > App.js <<'APPJS'
          import React, { useEffect, useState } from "react";
          import {
            SafeAreaView,
            ScrollView,
            View,
            Text,
            TextInput,
            TouchableOpacity,
            StyleSheet,
            Alert,
            StatusBar
          } from "react-native";

          import AsyncStorage from "@react-native-async-storage/async-storage";

          const DATA_KEY = "VYAPAR_KHATA_DATA";
          const MASTER_PIN = "9999";

          export default function App() {

            const [records, setRecords] = useState([]);
            const [name, setName] = useState("");
            const [invoice, setInvoice] = useState("");
            const [original, setOriginal] = useState("");
            const [second, setSecond] = useState("");

            const [master, setMaster] = useState(false);
            const [pin, setPin] = useState("");

            useEffect(() => {
              loadData();
            }, []);

            async function loadData() {
              try {
                const saved = await AsyncStorage.getItem(DATA_KEY);

                if (saved) {
                  setRecords(JSON.parse(saved));
                }
              } catch (error) {
                console.log(error);
              }
            }

            async function saveData(list) {
              setRecords(list);
              await AsyncStorage.setItem(
                DATA_KEY,
                JSON.stringify(list)
              );
            }

            function unlockMaster() {

              if (pin === MASTER_PIN) {
                setMaster(true);
                setPin("");

                Alert.alert(
                  "Master Open",
                  "Master ledger open ho gaya."
                );

              } else {
                Alert.alert(
                  "Access Denied",
                  "Wrong Master PIN"
                );

                setPin("");
              }
            }

            function addInvoice() {

              if (
                !name.trim() ||
                !invoice.trim() ||
                !original.trim()
              ) {
                Alert.alert(
                  "Required",
                  "Customer, Invoice aur Original Amount bharein."
                );
                return;
              }

              const item = {
                id: Date.now(),
                name: name.trim(),
                invoice: invoice.trim(),
                original: Number(original),
                second: master ? Number(second || 0) : 0
              };

              saveData([item, ...records]);

              setName("");
              setInvoice("");
              setOriginal("");
              setSecond("");

              Alert.alert(
                "Saved",
                "Invoice save ho gaya."
              );
            }

            function deleteInvoice(id) {

              Alert.alert(
                "Delete",
                "Kya ye invoice delete karna hai?",
                [
                  {
                    text: "Cancel",
                    style: "cancel"
                  },
                  {
                    text: "Delete",
                    style: "destructive",
                    onPress: () => {
                      const list = records.filter(
                        item => item.id !== id
                      );

                      saveData(list);
                    }
                  }
                ]
              );
            }

            return (
              <SafeAreaView style={styles.page}>

                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#0759A8"
                />

                <ScrollView
                  keyboardShouldPersistTaps="handled"
                >

                  <View style={styles.header}>
                    <Text style={styles.logo}>
                      Vyapar Khata
                    </Text>

                    <Text style={styles.subtitle}>
                      {master
                        ? "MASTER CONSOLIDATED VIEW"
                        : "OFFICIAL REGULAR VIEW"}
                    </Text>
                  </View>

                  {!master ? (

                    <View style={styles.box}>

                      <Text style={styles.title}>
                        Master Access
                      </Text>

                      <TextInput
                        style={styles.input}
                        placeholder="Master PIN"
                        keyboardType="numeric"
                        secureTextEntry
                        value={pin}
                        onChangeText={setPin}
                      />

                      <TouchableOpacity
                        style={styles.masterButton}
                        onPress={unlockMaster}
                      >
                        <Text style={styles.buttonText}>
                          OPEN MASTER
                        </Text>
                      </TouchableOpacity>

                    </View>

                  ) : (

                    <View style={styles.box}>

                      <TouchableOpacity
                        style={styles.closeButton}
                        onPress={() => setMaster(false)}
                      >
                        <Text style={styles.closeText}>
                          CLOSE MASTER MODE
                        </Text>
                      </TouchableOpacity>

                    </View>

                  )}

                  <View style={styles.box}>

                    <Text style={styles.title}>
                      New Invoice
                    </Text>

                    <TextInput
                      style={styles.input}
                      placeholder="Customer Name"
                      value={name}
                      onChangeText={setName}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Invoice Number"
                      value={invoice}
                      onChangeText={setInvoice}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Original Invoice Amount"
                      keyboardType="numeric"
                      value={original}
                      onChangeText={setOriginal}
                    />

                    {master && (
                      <TextInput
                        style={styles.secretInput}
                        placeholder="Second Amount"
                        keyboardType="numeric"
                        value={second}
                        onChangeText={setSecond}
                      />
                    )}

                    <TouchableOpacity
                      style={styles.saveButton}
                      onPress={addInvoice}
                    >
                      <Text style={styles.buttonText}>
                        SAVE INVOICE
                      </Text>
                    </TouchableOpacity>

                  </View>

                  <Text style={styles.listTitle}>
                    Invoice Records ({records.length})
                  </Text>

                  {records.length === 0 ? (

                    <View style={styles.box}>
                      <Text style={styles.empty}>
                        Abhi koi invoice nahi hai.
                      </Text>
                    </View>

                  ) : (

                    records.map(item => {

                      const originalAmount =
                        Number(item.original || 0);

                      const secondAmount =
                        Number(item.second || 0);

                      const totalDue =
                        originalAmount + secondAmount;

                      return (

                        <View
                          key={item.id}
                          style={styles.card}
                        >

                          <View style={styles.row}>

                            <Text style={styles.name}>
                              {item.name}
                            </Text>

                            <TouchableOpacity
                              onPress={() =>
                                deleteInvoice(item.id)
                              }
                            >
                              <Text style={styles.delete}>
                                DELETE
                              </Text>
                            </TouchableOpacity>

                          </View>

                          <Text style={styles.invoice}>
                            Invoice: {item.invoice}
                          </Text>

                          <Text style={styles.original}>
                            Original Invoice: ₹
                            {originalAmount.toLocaleString("en-IN")}
                          </Text>

                          {!master ? (

                            <Text style={styles.due}>
                              Original Due: ₹
                              {originalAmount.toLocaleString("en-IN")}
                            </Text>

                          ) : (

                            <View style={styles.masterBox}>

                              <Text style={styles.second}>
                                Second Amount: ₹
                                {secondAmount.toLocaleString("en-IN")}
                              </Text>

                              <Text style={styles.total}>
                                TOTAL DUE: ₹
                                {totalDue.toLocaleString("en-IN")}
                              </Text>

                            </View>

                          )}

                        </View>
                      );
                    })
                  )}

                  <View style={{ height: 50 }} />

                </ScrollView>
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({

            page: {
              flex: 1,
              backgroundColor: "#F3F6FA"
            },

            header: {
              backgroundColor: "#0759A8",
              padding: 20
            },

            logo: {
