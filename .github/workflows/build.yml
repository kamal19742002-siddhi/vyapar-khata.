```yaml
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Vyapar Khata App
        shell: bash
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata

          npm install
          npx expo install react-native-webview

          node <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(
            fs.readFileSync("app.json", "utf8")
          );

          app.expo.name = "Vyapar Khata Book";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.10";

          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 15
          };

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2)
          );
          NODE

          cat > App.js <<'EOF'
          import React from "react";
          import {
            SafeAreaView,
            StatusBar,
            StyleSheet
          } from "react-native";
          import { WebView } from "react-native-webview";

          const html = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport"
                  content="width=device-width, initial-scale=1.0">

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f4f7fb;
                color: #172033;
              }

              .top {
                background: #1261d8;
                color: white;
                padding: 25px 18px 28px;
                border-radius: 0 0 25px 25px;
              }

              .title {
                font-size: 25px;
                font-weight: bold;
              }

              .sub {
                font-size: 14px;
                margin-top: 6px;
              }

              .cards {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                padding: 16px;
              }

              .card {
                background: white;
                border-radius: 17px;
                padding: 17px;
              }

              .label {
                font-size: 13px;
                color: #697386;
              }

              .amount {
                font-size: 21px;
                font-weight: bold;
                margin-top: 7px;
              }

              .receive {
                color: #078447;
              }

              .pay {
                color: #d34a4a;
              }

              .section {
                padding: 8px 16px;
                font-size: 19px;
                font-weight: bold;
              }

              .actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
                padding: 12px 16px 18px;
              }

              button {
                border: 0;
                padding: 16px 8px;
                border-radius: 15px;
                font-size: 15px;
                font-weight: bold;
              }

              .add {
                background: #1261d8;
                color: white;
              }

              .view {
                background: white;
                color: #1261d8;
              }

              .customer {
                background: white;
                margin: 8px 16px;
                padding: 16px;
                border-radius: 16px;
                display: flex;
                justify-content: space-between;
              }

              .name {
                font-weight: bold;
                font-size: 16px;
              }

              .phone {
                font-size: 12px;
                color: #7b8494;
                margin-top: 5px;
              }

              .bal {
                font-weight: bold;
                color: #078447;
              }

              .bottom {
                height: 65px;
                background: white;
                display: flex;
                justify-content: space-around;
                align-items: center;
                margin-top: 18px;
              }

              .nav {
                text-align: center;
                font-size: 12px;
                color: #647084;
              }

              .active {
                color: #1261d8;
                font-weight: bold;
              }
            </style>
          </head>

          <body>

            <div class="top">
              <div class="title">Vyapar Khata Book</div>
              <div class="sub">
                Manage your business accounts easily
              </div>
            </div>

            <div class="cards">

              <div class="card">
                <div class="label">You will receive</div>
                <div class="amount receive">₹25,450</div>
              </div>

              <div class="card">
                <div class="label">You will pay</div>
                <div class="amount pay">₹8,750</div>
              </div>

            </div>

            <div class="section">
              Quick Actions
            </div>

            <div class="actions">

              <button class="add"
                onclick="alert('Add Customer')">
                + Add Customer
              </button>

              <button class="view"
                onclick="alert('New Entry')">
                + New Entry
              </button>

              <button class="view"
                onclick="alert('Customers')">
                Customers
              </button>

              <button class="view"
                onclick="alert('Reports')">
                Reports
              </button>

            </div>

            <div class="section">
              Recent Customers
            </div>

            <div class="customer">
              <div>
                <div class="name">Rahul Traders</div>
                <div class="phone">98765 43210</div>
              </div>
              <div class="bal">₹12,500</div>
            </div>

            <div class="customer">
              <div>
                <div class="name">Amit Enterprises</div>
                <div class="phone">98765 12345</div>
              </div>
              <div class="bal">₹7,950</div>
            </div>

            <div class="customer">
              <div>
                <div class="name">Sharma Store</div>
                <div class="phone">99887 66554</div>
              </div>
              <div class="bal">₹5,000</div>
            </div>

            <div class="bottom">
              <div class="nav active">Home</div>
              <div class="nav">Customers</div>
              <div class="nav">Khata</div>
              <div class="nav">Reports</div>
            </div>

          </body>
          </html>
          `;

          export default function App() {
            return (
              <SafeAreaView style={styles.container}>

                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#1261d8"
                />

                <WebView
                  source={{ html }}
                  style={styles.webview}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                />

              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: {
              flex: 1,
              backgroundColor: "#f4f7fb"
            },
            webview: {
              flex: 1
            }
          });
          EOF

          CI=1 npx expo prebuild --platform android --no-install

      - name: Restore Permanent Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Permanent Gradle Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          cd vyapar-khata/android

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          release_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          if "storeFile file('upload-keystore.jks')" not in text:
              text = text.replace(
                  "signingConfigs {",
                  "signingConfigs {" + release_block,
                  1
              )

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          path.write_text(text)
          PY

      - name: Build Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-v15
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
```
