
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free
      NODE_ENV: production

    steps:

      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================
      # VERSION CODE
      # ============================================
      - name: Set Version Code
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Version Code: $VERSION_CODE"


      # ============================================
      # NODE
      # ============================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ============================================
      # JAVA
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================
      # PACKAGE.JSON
      # ============================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF


      # ============================================
      # INSTALL
      # ============================================
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps


      # ============================================
      # BABEL
      # ============================================
      - name: Create Babel Config
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF


      # ============================================
      # INDEX
      # ============================================
      - name: Create index.js
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";

          registerRootComponent(App);
          EOF


      # ============================================
      # APP.JSON
      # ============================================
      - name: Create app.json
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE}
              }
            }
          }
          EOF


      # ============================================
      # EXPO PREBUILD
      # ============================================
      - name: Expo Prebuild
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean


      # ============================================
      # SPLASH RESOURCE FIX
      # ============================================
      - name: Fix Splash Resource
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF


      # ============================================
      # ANDROID SDK 36
      # ============================================
      - name: Configure Android SDK
        run: |
          cat >> android/gradle.properties <<'EOF'

          android.compileSdkVersion=36
          android.targetSdkVersion=36
          android.buildToolsVersion=36.0.0
          android.suppressUnsupportedCompileSdk=36
          EOF


      # ============================================
      # RESTORE EXISTING KEYSTORE
      # ============================================
      - name: Restore Existing Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Existing signing keystore restored."


      # ============================================
      # SIGNING CONFIG
      # ============================================
      - name: Configure Signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Remove all previous custom signing blocks
          text = re.sub(
              r'(?s)// VYAPAR_SIGNING_START.*?// VYAPAR_SIGNING_END',
              '',
              text
          )

          # Remove previous vyaparRelease declarations
          text = re.sub(
              r'(?s)signingConfigs\s*\{[^{}]*vyaparRelease\s*\{.*?\}\s*\}',
              '',
              text
          )

          # Remove old references
          text = re.sub(
              r'\s*signingConfig\s+signingConfigs\.vyaparRelease',
              '',
              text
          )

          text = re.sub(
              r'\s*signingConfig\s+signingConfigs\.getByName\(["\']vyaparRelease["\']\)',
              '',
              text
          )

          android_pos = text.find("android {")

          if android_pos == -1:
              raise SystemExit("android block not found")

          build_types_pos = text.find(
              "buildTypes {",
              android_pos
          )

          if build_types_pos == -1:
              raise SystemExit("buildTypes block not found")

          # Create exactly ONE signing config
          signing_block = '''
              signingConfigs {
                  vyaparRelease {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

          '''

          text = (
              text[:build_types_pos]
              + signing_block
              + text[build_types_pos:]
          )

          # Find release block
          build_types_pos = text.find(
              "buildTypes {",
              android_pos
          )

          release_pos = text.find(
              "release {",
              build_types_pos
          )

          if release_pos == -1:
              raise SystemExit("release block not found")

          # Find end of release block
          depth = 0
          opened = False
          release_end = None

          for i in range(release_pos, len(text)):
              if text[i] == "{":
                  depth += 1
                  opened = True
              elif text[i] == "}":
                  depth -= 1
                  if opened and depth == 0:
                      release_end = i
                      break

          if release_end is None:
              raise SystemExit("release block end not found")

          release_content = text[
              release_pos:release_end
          ]

          # Add signing only once
          if "signingConfig" not in release_content:
              insert_at = release_pos + len("release {")

              text = (
                  text[:insert_at]
                  + '''
                      signingConfig signingConfigs.vyaparRelease
                  '''
                  + text[insert_at:]
              )

          path.write_text(text)

          print("Signing configuration prepared successfully.")
          PY


      # ============================================
      # FIX EXPO MODULES CORE KOTLIN
      # ============================================
      - name: Fix Expo Modules Core Kotlin
        run: |
          FILE="node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt"

          test -f "$FILE"

          echo "Checking PermissionsService.kt..."

          sed -n '155,175p' "$FILE"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt"
          )

          text = path.read_text()

          # Fix nullable package permission array issue.
          replacements = [
              (
                  "manifest.permissions.any { it == permission }",
                  "manifest.permissions?.any { it == permission } == true"
              ),
              (
                  "manifest.permissions.contains(permission)",
                  "manifest.permissions?.contains(permission) == true"
              ),
              (
                  "manifest.permissions.isNotEmpty()",
                  "manifest.permissions?.isNotEmpty() == true"
              ),
              (
                  "manifest.permissions.size",
                  "manifest.permissions?.size ?: 0"
              )
          ]

          changed = False

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  changed = True

          path.write_text(text)

          if changed:
              print("Expo Modules Core Kotlin patch applied.")
          else:
              print(
                  "Generic Kotlin expressions were not found; "
                  "checking exact failing line."
              )

          PY

          echo ""
          echo "PermissionsService.kt after patch:"
          sed -n '155,175p' "$FILE"


      # ============================================
      # VERIFY SIGNING
      # ============================================
      - name: Verify Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking keystore..."

          test -f android/app/upload-keystore.jks

          echo "Keystore OK."

          echo ""
          echo "Signing configuration:"
          grep -n "vyaparRelease" \
            android/app/build.gradle || true

          echo ""
          echo "Signing references:"
          grep -n "signingConfig" \
            android/app/build.gradle || true


      # ============================================
      # BUILD AAB
      # ============================================
      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          cd android

          chmod +x gradlew

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace


      # ============================================
      # CHECK AAB
      # ============================================
      - name: Check AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          echo ""
          echo "======================================"
          echo "AAB BUILD SUCCESS"
          echo "======================================"

          ls -lh "$AAB"

          echo ""
          echo "Package: ${PACKAGE_NAME}"
          echo "Version Code: ${VERSION_CODE}"

          echo "======================================"


      # ============================================
      # UPLOAD AAB
      # ============================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # ============================================
      # FINAL SUCCESS
      # ============================================
      - name: Build Successful
        run: |
          echo ""
          echo "======================================"
          echo "VYAPAR KHATA AAB SUCCESSFUL"
          echo "======================================"
          echo "Package: ${PACKAGE_NAME}"
          echo "Version Code: ${VERSION_CODE}"
          echo "AAB: app-release.aab"
          echo "======================================"
