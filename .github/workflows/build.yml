name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "1.0.0",
            "private": true,
            "main": "index.js",
            "scripts": {
              "start": "expo start"
            },
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "expo-contacts": "~13.0.5",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "^11.0.0"
            }
          }
          EOF

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps

      - name: Create Babel config
        shell: bash
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ['babel-preset-expo']
            };
          };
          EOF

      - name: Create index.js
        shell: bash
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from 'expo';
          import App from './App';

          registerRootComponent(App);
          EOF

      - name: Create assets
        shell: bash
        run: |
          mkdir -p assets

          python3 - <<'PY'
          import base64

          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )

          for name in [
              "icon.png",
              "adaptive-icon.png",
              "splash.png",
              "favicon.png"
          ]:
              with open("assets/" + name, "wb") as f:
                  f.write(png)
          PY

      - name: Create Expo app.json
        shell: bash
        run: |
          VERSION_CODE=$((3000 + GITHUB_RUN_NUMBER))

          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "icon": "./assets/icon.png",
              "userInterfaceStyle": "light",

              "splash": {
                "image": "./assets/splash.png",
                "resizeMode": "contain",
                "backgroundColor": "#ffffff"
              },

              "android": {
                "package": "com.vyapar.khatabook.free",
                "versionCode": ${VERSION_CODE},
                "compileSdkVersion": 36,
                "targetSdkVersion": 36,

                "permissions": [
                  "android.permission.READ_CONTACTS"
                ],

                "adaptiveIcon": {
                  "foregroundImage": "./assets/adaptive-icon.png",
                  "backgroundColor": "#ffffff"
                }
              },

              "plugins": [
                "expo-contacts"
              ]
            }
          }
          EOF

          echo "Version Code: ${VERSION_CODE}"

      - name: Prebuild Android
        shell: bash
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Verify Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Android project was not created."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Gradle wrapper was not created."
            exit 1
          fi

          echo "Android project created successfully."
          ls -la android

      - name: Force Android SDK 36
        shell: bash
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle")

          if p.exists():
              s = p.read_text()

              s = s.replace(
                  "compileSdkVersion = Integer.valueOf(findProperty('android.compileSdkVersion') ?: 34)",
                  "compileSdkVersion = 36"
              )

              s = s.replace(
                  "targetSdkVersion = Integer.valueOf(findProperty('android.targetSdkVersion') ?: 34)",
                  "targetSdkVersion = 36"
              )

              p.write_text(s)
          PY

      - name: Check signing secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 missing"
            exit 1
          fi

          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD missing"
            exit 1
          fi

          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "ERROR: KEY_ALIAS missing"
            exit 1
          fi

          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "ERROR: KEY_PASSWORD missing"
            exit 1
          fi

          echo "Signing secrets found."

      - name: Restore signing keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/vyapar-upload.jks

          if [ ! -f android/app/vyapar-upload.jks ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          ls -lh android/app/vyapar-upload.jks

      - name: Configure release signing
        shell: bash
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file("vyapar-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in s:
              s = s.replace(
                  "android {",
                  "android {" + "\n" + signing_block,
                  1
              )

          s = s.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "buildTypes {",
                  """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              """,
                  1
              )

          p.write_text(s)
          PY

          echo "Release signing configured."

      - name: Build Release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease --stacktrace

      - name: Verify AAB
        shell: bash
        run: |
          echo "Checking generated AAB..."

          ls -lh android/app/build/outputs/bundle/release/

          if [ ! -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "ERROR: AAB NOT FOUND"
            exit 1
          fi

          echo "================================"
          echo "AAB BUILD SUCCESSFUL"
          echo "================================"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
