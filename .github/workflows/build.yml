name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create and Configure App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank
          cd vyapar-khata
          npx expo install expo-document-picker @react-native-async-storage/async-storage expo-contacts expo-image-picker expo-print expo-sharing

          node - <<'NODE'
          const fs = require("fs");
          const p = "app.json";
          const app = JSON.parse(fs.readFileSync(p, "utf8"));
          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.36";
          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 36,
            permissions: [
              "android.permission.READ_CONTACTS",
              "android.permission.CAMERA",
              "android.permission.READ_EXTERNAL_STORAGE"
            ]
          };
          fs.writeFileSync(p, JSON.stringify(app, null, 2));
          NODE

          cat > App.js <<'APPJS'
          import React, { useEffect, useMemo, useState } from "react";
          import {
            Alert,
            Linking,
            SafeAreaView,
            ScrollView,
            StatusBar,
            StyleSheet,
            Text,
            TextInput,
            TouchableOpacity,
            View
          } from "react-native";
          import AsyncStorage from "@react-native-async-storage/async-storage";
          import * as DocumentPicker from "expo-document-picker";
          import * as ImagePicker from "expo-image-picker";
          import * as Contacts from "expo-contacts";
          import * as Print from "expo-print";
          import * as Sharing from "expo-sharing";

          const STORE = "@vyapar_khata_data_v2";
          const PIN_STORE = "@vyapar_khata_pin_v1";

          const today = () => {
            const d = new Date();
            return (
              String(d.getDate()).padStart(2, "0") +
              "/" +
              String(d.getMonth() + 1).padStart(2, "0") +
              "/" +
              d.getFullYear()
            );
          };

          const Header = ({ title }) => (
            <View style={styles.header}>
              <Text style={styles.logoTitle}>{title}</Text>
            </View>
          );

          const Info = ({ title, value }) => (
            <View style={styles.infoRow}>
              <Text style={styles.infoLabel}>{title}</Text>
              <Text style={styles.infoValue}>{value || "—"}</Text>
            </View>
          );

          const Button = ({ text, onPress, secondary, danger }) => (
            <TouchableOpacity
              style={[
                styles.btn,
                secondary && styles.btnSecondary,
                danger && styles.btnDanger
              ]}
              onPress={onPress}
            >
              <Text
                style={[
                  styles.btnText,
                  secondary && styles.btnTextSecondary,
                  danger && styles.btnTextDanger
                ]}
              >
                {text}
              </Text>
            </TouchableOpacity>
          );

          export default function App() {
            const [savedPin, setSavedPin] = useState(null);
            const [isLocked, setIsLocked] = useState(true);
            const [inputPin, setInputPin] = useState("");
            const [newPin, setNewPin] = useState("");
            const [confirmPin, setConfirmPin] = useState("");
            const [isSettingPin, setIsSettingPin] = useState(false);

            const [screen, setScreen] = useState("home");
            const [tab, setTab] = useState("Customers");
            const [customers, setCustomers] = useState([]);
            const [suppliers, setSuppliers] = useState([]);
            const [selected, setSelected] = useState(null);

            const [name, setName] = useState("");
            const [phone, setPhone] = useState("");
            const [gst, setGst] = useState("");
            const [address, setAddress] = useState("");
            const [email, setEmail] = useState("");

            const [editingEntryId, setEditingEntryId] = useState(null);
            const [docFormat, setDocFormat] = useState("Invoice"); // 'Invoice' ya 'Estimate'
            const [invoiceNo, setInvoiceNo] = useState("");
            const [invoiceDate, setInvoiceDate] = useState(today());
            const [amount, setAmount] = useState("");
            const [paymentMode, setPaymentMode] = useState("Cash");
            const [paymentRef, setPaymentRef] = useState("");
            const [entryType, setEntryType] = useState("Credit");
            const [attachment, setAttachment] = useState(null);

            useEffect(() => {
              loadAuthAndData();
            }, []);

            const loadAuthAndData = async () => {
              try {
                const storedPin = await AsyncStorage.getItem(PIN_STORE);
                if (storedPin) {
                  setSavedPin(storedPin);
                  setIsLocked(true);
                } else {
                  setIsSettingPin(true);
                  setIsLocked(false);
                }

                const raw = await AsyncStorage.getItem(STORE);
                if (raw) {
                  const data = JSON.parse(raw);
                  setCustomers(data.customers || []);
                  setSuppliers(data.suppliers || []);
                }
              } catch (e) {
                console.log(e);
              }
            };

            const handleUnlock = () => {
              if (inputPin === savedPin) {
                setIsLocked(false);
                setInputPin("");
              } else {
                Alert.alert("Wrong PIN", "Galat Security PIN enter kiya hai.");
                setInputPin("");
              }
            };

            const handleSaveNewPin = async () => {
              if (newPin.length !== 4 || isNaN(Number(newPin))) {
                Alert.alert("Invalid PIN", "4-digit ka numerical PIN banayein.");
                return;
              }
              if (newPin !== confirmPin) {
                Alert.alert("Mismatch", "PIN aur Confirm PIN match nahi ho rahe.");
                return;
              }
              await AsyncStorage.setItem(PIN_STORE, newPin);
              setSavedPin(newPin);
              setIsSettingPin(false);
              setNewPin("");
              setConfirmPin("");
              Alert.alert("Success", "Security PIN set ho gaya hai.");
            };

            const saveData = async (c, s) => {
              await AsyncStorage.setItem(
                STORE,
                JSON.stringify({ customers: c, suppliers: s })
              );
            };

            const resetProfile = () => {
              setName("");
              setPhone("");
              setGst("");
              setAddress("");
              setEmail("");
              resetEntryForm();
            };

            const resetEntryForm = () => {
              setEditingEntryId(null);
              setDocFormat("Invoice");
              setInvoiceNo("");
              setInvoiceDate(today());
              setAmount("");
              setPaymentMode("Cash");
              setPaymentRef("");
              setEntryType("Credit");
              setAttachment(null);
            };

            const pickContact = async () => {
              try {
                const { status } = await Contacts.requestPermissionsAsync();
                if (status !== "granted") {
                  Alert.alert("Permission Required", "Contact chunne ke liye phone contacts permission allow karein.");
                  return;
                }
                const contact = await Contacts.presentContactPickerAsync();
                if (contact) {
                  if (contact.name) setName(contact.name);
                  if (contact.phoneNumbers && contact.phoneNumbers.length > 0) {
                    const clean = contact.phoneNumbers[0].number.replace(/[^0-9+]/g, "");
                    setPhone(clean);
                  }
                }
              } catch (err) {
                Alert.alert("Error", "Contact select nahi ho saka.");
              }
            };

            const addPerson = async () => {
              if (!name.trim()) {
                Alert.alert("Required", "Kripya naam enter karein.");
                return;
              }
              const person = {
                id: Date.now().toString(),
                name: name.trim(),
                phone: phone.trim(),
                gst: gst.trim(),
                address: address.trim(),
                email: email.trim(),
                entries: []
              };
              if (tab === "Customers") {
                const updated = [person, ...customers];
                setCustomers(updated);
                await saveData(updated, suppliers);
              } else {
                const updated = [person, ...suppliers];
                setSuppliers(updated);
                await saveData(customers, updated);
              }
              resetProfile();
              setScreen("home");
              Alert.alert("Saved", `${tab === "Customers" ? "Customer" : "Supplier"} save ho gaya.`);
            };

            const startEditEntry = (entry) => {
              setEditingEntryId(entry.id);
              setDocFormat(entry.docFormat || "Invoice");
              setInvoiceNo(entry.invoiceNo);
              setInvoiceDate(entry.invoiceDate);
              setAmount(String(entry.amount));
              setPaymentMode(entry.paymentMode || "Cash");
              setPaymentRef(entry.paymentRef || "");
              setEntryType(entry.type || "Credit");
              setAttachment(
                entry.attachment
                  ? { name: entry.attachment, uri: entry.attachmentUri }
                  : null
              );
            };

            const deleteEntry = (entryId) => {
              Alert.alert(
                "Delete Entry",
                "Kya aap is passbook entry ko delete karna chahte hain?",
                [
                  { text: "Cancel", style: "cancel" },
                  {
                    text: "Delete",
                    style: "destructive",
                    onPress: async () => {
                      const updatedEntries = (selected.entries || []).filter((e) => e.id !== entryId);
                      const list = tab === "Customers" ? customers : suppliers;
                      const updated = list.map((p) =>
                        p.id === selected.id ? { ...p, entries: updatedEntries } : p
                      );
                      if (tab === "Customers") {
                        setCustomers(updated);
                        await saveData(updated, suppliers);
                      } else {
                        setSuppliers(updated);
                        await saveData(customers, updated);
                      }
                      const fresh = updated.find((x) => x.id === selected.id);
                      setSelected(fresh);
                      if (editingEntryId === entryId) resetEntryForm();
                      Alert.alert("Deleted", "Entry delete ho gayi.");
                    }
                  }
                ]
              );
            };

            const addTransaction = async () => {
              if (!selected) return;
              const value = Number(amount);
              const cleanInvoice = invoiceNo.trim();

              const invoiceRegex = /^(?=.*\d)[a-zA-Z0-9/-]+$/;

              if (!cleanInvoice) {
                Alert.alert("Required", `${docFormat === "Estimate" ? "Estimate" : "Invoice"} number enter karein.`);
                return;
              }

              if (!invoiceRegex.test(cleanInvoice)) {
                Alert.alert(
                  "Invalid Number",
                  "Number mein kam se kam 1 digit hona chahiye aur sirf alphanumeric characters allow hain."
                );
                return;
              }

              if (!amount.trim() || !Number.isFinite(value) || value <= 0) {
                Alert.alert("Invalid Amount", "Valid amount enter karein.");
                return;
              }

              let updatedEntries;
              if (editingEntryId) {
                updatedEntries = (selected.entries || []).map((e) =>
                  e.id === editingEntryId
                    ? {
                        ...e,
                        docFormat,
                        invoiceNo: cleanInvoice,
                        invoiceDate: invoiceDate.trim() || today(),
                        amount: value,
                        paymentMode,
                        paymentRef: paymentRef.trim(),
                        type: entryType,
                        attachment: attachment ? attachment.name : null,
                        attachmentUri: attachment ? attachment.uri : null
                      }
                    : e
                );
              } else {
                const newEntry = {
                  id: Date.now().toString(),
                  docFormat,
                  invoiceNo: cleanInvoice,
                  invoiceDate: invoiceDate.trim() || today(),
                  amount: value,
                  paymentMode,
                  paymentRef: paymentRef.trim(),
                  type: entryType,
                  attachment: attachment ? attachment.name : null,
                  attachmentUri: attachment ? attachment.uri : null
                };
                updatedEntries = [newEntry, ...(selected.entries || [])];
              }

              const list = tab === "Customers" ? customers : suppliers;
              const updated = list.map((p) =>
                p.id === selected.id ? { ...p, entries: updatedEntries } : p
              );

              if (tab === "Customers") {
                setCustomers(updated);
                await saveData(updated, suppliers);
              } else {
                setSuppliers(updated);
                await saveData(customers, updated);
              }

              const fresh = updated.find((x) => x.id === selected.id);
              setSelected(fresh);
              resetEntryForm();
              Alert.alert("Success", editingEntryId ? "Entry update ho gayi." : "Entry save ho gayi.");
            };

            const openCamera = async () => {
              const { status } = await ImagePicker.requestCameraPermissionsAsync();
              if (status !== "granted") {
                Alert.alert("Permission", "Camera permission allow karein.");
                return;
              }
              const result = await ImagePicker.launchCameraAsync({
                allowsEditing: true,
                quality: 0.8
              });
              if (!result.canceled && result.assets?.length) {
                const uri = result.assets[0].uri;
                const name = uri.split("/").pop() || "Camera_Invoice.jpg";
                setAttachment({ name, uri });
              }
            };

            const openGallery = async () => {
              const { status } = await ImagePicker.requestMediaLibraryPermissionsAsync();
              if (status !== "granted") {
                Alert.alert("Permission", "Gallery permission allow karein.");
                return;
              }
              const result = await ImagePicker.launchImageLibraryAsync({
                mediaTypes: ImagePicker.MediaTypeOptions.Images,
                allowsEditing: true,
                quality: 0.8
              });
              if (!result.canceled && result.assets?.length) {
                const uri = result.assets[0].uri;
                const name = uri.split("/").pop() || "Gallery_Invoice.jpg";
                setAttachment({ name, uri });
              }
            };

            const openDocument = async () => {
              const result = await DocumentPicker.getDocumentAsync({
                type: ["application/pdf", "image/*"],
                copyToCacheDirectory: true
              });
              if (!result.canceled && result.assets?.length) {
                setAttachment({
                  name: result.assets[0].name,
                  uri: result.assets[0].uri
                });
              }
            };

            const chooseAttachment = () => {
              Alert.alert(
                "Upload Document",
                "Attach karne ka tarika chunein:",
                [
                  { text: "📷 Camera (Photo & Crop)", onPress: openCamera },
                  { text: "🖼️ Gallery (Phone & Crop)", onPress: openGallery },
                  { text: "📄 Document / PDF", onPress: openDocument },
                  { text: "Cancel", style: "cancel" }
                ]
              );
            };

            const sendWhatsAppText = async (entry) => {
              if (!selected.phone) {
                Alert.alert("Missing Phone", "Customer ka phone number maujood nahi hai.");
                return;
              }
              let clean = selected.phone.replace(/[^0-9]/g, "");
              if (clean.length === 10) clean = "91" + clean;
              const formatLabel = entry.docFormat === "Estimate" ? "ESTIMATE / QUOTATION" : "TAX INVOICE";
              const msg = `*Vyapar Khata - ${formatLabel}*\n\nNamaste *${selected.name}*,\n\n📄 Ref No: ${entry.invoiceNo}\n📅 Date: ${entry.invoiceDate}\n💰 Amount: ₹${entry.amount.toLocaleString("en-IN")}\nType: ${entry.type}\nPayment: ${entry.paymentMode}${entry.paymentRef ? " (" + entry.paymentRef + ")" : ""}\n\nDhanyawad!`;
              const url = `whatsapp://send?phone=${clean}&text=${encodeURIComponent(msg)}`;
              try {
                const can = await Linking.canOpenURL(url);
                if (can) {
                  await Linking.openURL(url);
                } else {
                  Alert.alert("WhatsApp Error", "WhatsApp install nahi hai.");
                }
              } catch (e) {
                Alert.alert("Error", "WhatsApp open nahi ho paya.");
              }
            };

            const shareEntryAsPdf = async (entry) => {
              try {
                const isEstimate = entry.docFormat === "Estimate";
                const docTitle = isEstimate ? "ESTIMATE / QUOTATION" : "TAX INVOICE";
                const refLabel = isEstimate ? "Estimate No:" : "Invoice No:";
                const noteText = isEstimate
                  ? "<p style='text-align: center; color: #b71c1c; font-size: 11px;'>* This is an Estimate / Quotation copy, not an official GST Tax Invoice.</p>"
                  : "<p style='text-align: center; color: #666; font-size: 11px;'>* Original Tax Invoice copy generated via Vyapar Khata.</p>";

                const imgTag = entry.attachmentUri
                  ? `<div style="margin-top:20px; text-align:center;">
                      <p style="font-weight:bold; color:#555;">Attached Document Copy:</p>
                      <img src="${entry.attachmentUri}" style="max-width:92%; max-height:550px; border:1px solid #ccc; border-radius:8px;" />
                     </div>`
                  : "";

                const html = `
                  <html>
                    <body style="font-family: Arial, sans-serif; padding: 25px; color: #222;">
                      <div style="text-align: center; border-bottom: 2px solid ${isEstimate ? "#e65100" : "#0759a8"}; padding-bottom: 10px;">
                        <h1 style="color: ${isEstimate ? "#e65100" : "#0759a8"}; margin: 0;">${docTitle}<ted.entries || [])];
              }

              const list = tab === "Customers" ? customers : suppliers;
              const updated = list.map((p) =>
                p.id === selected.id ? { ...p, entries: updatedEntries } : p
              );

              if (tab === "Customers") {
                setCustomers(updated);
                await saveData(updated, suppliers);
              } else {
                setSuppliers(updated);
                await saveData(customers, updated);
              }

              const fresh = updated.find((x) => x.id === selected.id);
              setSelected(fresh);
              resetEntryForm();
              Alert.alert("Success", editingEntryId ? "Entry update ho gayi." : "Entry save ho gayi.");
            };

            const openCamera = async () => {
              const { status } = await ImagePicker.requestCameraPermissionsAsync();
              if (status !== "granted") {
                Alert.alert("Permission", "Camera permission allow karein.");
                return;
              }
              const result = await ImagePicker.launchCameraAsync({ quality: 0.8 });
              if (!result.canceled && result.assets?.length) {
                const uri = result.assets[0].uri;
                const name = uri.split("/").pop() || "Camera_Invoice.jpg";
                setAttachment({ name, uri });
              }
            };

            const openGallery = async () => {
              const { status } = await ImagePicker.requestMediaLibraryPermissionsAsync();
              if (status !== "granted") {
                Alert.alert("Permission", "Gallery permission allow karein.");
                return;
              }
              const result = await ImagePicker.launchImageLibraryAsync({
                mediaTypes: ImagePicker.MediaTypeOptions.Images,
                quality: 0.8
              });
              if (!result.canceled && result.assets?.length) {
                const uri = result.assets[0].uri;
                const name = uri.split("/").pop() || "Gallery_Invoice.jpg";
                setAttachment({ name, uri });
              }
            };

            const openDocument = async () => {
              const result = await DocumentPicker.getDocumentAsync({
                type: ["application/pdf", "image/*"],
                copyToCacheDirectory: true
              });
              if (!result.canceled && result.assets?.length) {
                setAttachment(result.assets[0]);
              }
            };

            const chooseAttachment = () => {
              Alert.alert(
                "Upload Invoice",
                "Invoice attach karne ka tarika chunein:",
                [
                  { text: "📷 Camera (Photo Le)", onPress: openCamera },
                  { text: "🖼️ Gallery (Phone Se)", onPress: openGallery },
                  { text: "📄 Document / PDF", onPress: openDocument },
                  { text: "Cancel", style: "cancel" }
                ]
              );
            };

            const total = useMemo(() => {
              if (!selected) return 0;
              return (selected.entries || []).reduce(
                (sum, e) => (e.type === "Credit" ? sum + e.amount : sum - e.amount),
                0
              );
            }, [selected]);

            const customerBalanceTotal = useMemo(() => {
              return customers.reduce(
                (sum, c) =>
                  sum +
                  (c.entries || []).reduce(
                    (s, e) => (e.type === "Credit" ? s + e.amount : s - e.amount),
                    0
                  ),
                0
              );
            }, [customers]);

            const supplierBalanceTotal = useMemo(() => {
              return suppliers.reduce(
                (sum, s) =>
                  sum +
                  (s.entries || []).reduce(
                    (tot, e) => (e.type === "Credit" ? tot + e.amount : tot - e.amount),
                    0
                  ),
                0
              );
            }, [suppliers]);

            const openPassbook = (person) => {
              setSelected(person);
              resetEntryForm();
              setScreen("passbook");
            };

            const openProfile = (person) => {
              setSelected(person);
              setScreen("profile");
            };

            const goBack = () => {
              setScreen("home");
              setSelected(null);
            };

            if (screen === "new") {
              return (
                <SafeAreaView style={styles.container}>
                  <StatusBar barStyle="light-content" backgroundColor="#0759a8" />
                  <ScrollView>
                    <Header title={`New ${tab === "Customers" ? "Customer" : "Supplier"}`} />
                    <View style={styles.form}>
                      <Text style={styles.label}>Name *</Text>
                      <TextInput
                        style={styles.input}
                        placeholder="Customer / Supplier Name"
                        value={name}
                        onChangeText={setName}
                      />

                      <View style={{ flexDirection: "row", justifyContent: "space-between", alignItems: "center" }}>
                        <Text style={styles.label}>Phone Number</Text>
                        <TouchableOpacity onPress={pickContact} style={styles.pickContactBtn}>
                          <Text style={styles.pickContactText}>📞 Contacts se chunein</Text>
                        </TouchableOpacity>
                      </View>

                      <TextInput
                        style={styles.input}
                        placeholder="Phone Number"
                        keyboardType="phone-pad"
                        value={phone}
                        onChangeText={setPhone}
                      />

                      <Text style={styles.label}>GST Number</Text>
                      <TextInput
                        style={styles.input}
                        placeholder="GST Number"
                        value={gst}
                        onChangeText={setGst}
                        autoCapitalize="characters"
                      />
                      <Text style={styles.label}>Email ID</Text>
                      <TextInput
                        style={styles.input}
                        placeholder="Email ID"
                        keyboardType="email-address"
                        value={email}
                        onChangeText={setEmail}
                      />
                      <Text style={styles.label}>Address</Text>
                      <TextInput
                        style={[styles.input, { height: 70 }]}
                        placeholder="Full Address"
                        multiline
                        value={address}
                        onChangeText={setAddress}
                      />
                      <Button text="SAVE PROFILE" onPress={addPerson} />
                      <Button text="CANCEL" secondary onPress={goBack} />
                    </View>
                  </ScrollView>
                </SafeAreaView>
              );
            }

            if (screen === "profile" && selected) {
              return (
                <SafeAreaView style={styles.container}>
                  <StatusBar barStyle="light-content" backgroundColor="#0759a8" />
                  <ScrollView>
                    <Header title="Profile" />
                    <View style={styles.card}>
                      <Text style={styles.title}>{selected.name}</Text>
                      <Info title="Phone Number" value={selected.phone} />
                      <Info title="GST Number" value={selected.gst} />
                      <Info title="Email ID" value={selected.email} />
                      <Info title="Address" value={selected.address} />
                    </View>
                    <View style={styles.form}>
                      <Button text="OPEN PASSBOOK" onPress={() => openPassbook(selected)} />
                      <Button text="BACK" secondary onPress={goBack} />
                    </View>
                  </ScrollView>
                </SafeAreaView>
              );
            }

            if (screen === "passbook" && selected) {
              return (
                <SafeAreaView style={styles.container}>
                  <StatusBar barStyle="light-content" backgroundColor="#0759a8" />
                  <ScrollView>
                    <Header title="Passbook" />
                    <View style={styles.card}>
                      <Text style={styles.title}>{selected.name}</Text>
                      <Text style={styles.small}>{selected.phone || "No phone"}</Text>
                      <Text style={styles.balance}>
                        Balance: ₹{Math.abs(total).toLocaleString("en-IN")}
                      </Text>
                      <Text style={styles.balanceType}>
                        {total >= 0 ? "Credit Balance" : "Debit Balance"}
                      </Text>
                    </View>

                    <View style={styles.form}>
                      <Text style={styles.formTitle}>
                        {editingEntryId ? "Edit Passbook Entry" : "New Passbook Entry"}
                      </Text>
                      <TextInput
                        style={styles.input}
                        placeholder="Invoice Number (Numbers / Alphanumeric)"
                        value={invoiceNo}
                        onChangeText={setInvoiceNo}
                        autoCapitalize="characters"
                      />
                      <TextInput
                        style={styles.input}
                        placeholder="Invoice Date"
                        value={invoiceDate}
                        onChangeText={setInvoiceDate}
                      />
                      <TextInput
                        style={styles.input}
                        placeholder="Amount"
                        keyboardType="numeric"
                        value={amount}
                        onChangeText={setAmount}
                      />

                      <View style={styles.row}>
                        <TouchableOpacity
                          style={[styles.choice, entryType === "Credit" && styles.choiceActive]}
                          onPress={() => setEntryType("Credit")}
                        >
                          <Text style={[styles.choiceText, entryType === "Credit" && styles.activeChoiceText]}>
                            + Jama / Credit
                          </Text>
                        </TouchableOpacity>
                        <TouchableOpacity
                          style={[styles.choice, entryType === "Debit" && styles.choiceActive]}
                          onPress={() => setEntryType("Debit")}
                        >
                          <Text style={[styles.choiceText, entryType === "Debit" && styles.activeChoiceText]}>
                            - Udhar / Debit
                          </Text>
                        </TouchableOpacity>
                      </View>

                      <Text style={styles.label}>Mode of Payment</Text>
                      <View style={styles.rowWrap}>
                        {["Cash", "UPI", "Bank", "Cheque", "Credit"].map((mode) => (
                          <TouchableOpacity
                            key={mode}
                            style={[styles.payment, paymentMode === mode && styles.paymentActive]}
                            onPress={() => setPaymentMode(mode)}
                          >
                            <Text style={[styles.paymentText, paymentMode === mode && styles.paymentTextActive]}>
                              {mode}
                            </Text>
                          </TouchableOpacity>
                        ))}
                      </View>

                      {paymentMode !== "Cash" && paymentMode !== "Credit" && (
                        <TextInput
                          style={styles.input}
                          placeholder={
                            paymentMode === "UPI"
                              ? "Enter UPI Ref / UTR / Transaction ID"
                              : paymentMode === "Cheque"
                              ? "Enter Cheque No. & Bank Name"
                              : "Enter Bank Name / Account / UTR No."
                          }
                          placeholderTextColor="#888"
                          value={paymentRef}
                          onChangeText={setPaymentRef}
                        />
                      )}

                      <TouchableOpacity style={styles.attach} onPress={chooseAttachment}>
                        <Text style={styles.attachText}>📷 / 📎 Attach Invoice (Camera / Phone)</Text>
                      </TouchableOpacity>
                      {attachment && (
                        <View style={{ flexDirection: "row", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                          <Text style={styles.file}>Selected: {attachment.name}</Text>
                          <TouchableOpacity onPress={() => setAttachment(null)}>
                            <Text style={{ color: "#c62828", fontSize: 12, fontWeight: "700" }}>Remove ✖</Text>
                          </TouchableOpacity>
                        </View>
                      )}

                      <Button
                        text={editingEntryId ? "UPDATE ENTRY" : "SAVE ENTRY"}
                        onPress={addTransaction}
                      />
                      {editingEntryId && (
                        <Button text="CANCEL EDIT" secondary onPress={resetEntryForm} />
                      )}
                    </View>

                    <Text style={styles.sectionTitle}>Transaction History</Text>
                    {(selected.entries || []).length === 0 ? (
                      <View style={styles.empty}>
                        <Text style={styles.emptyText}>No transactions yet.</Text>
                      </View>
                    ) : (
                      selected.entries.map((entry) => (
                        <View key={entry.id} style={styles.entryCard}>
                          <View style={{ flex: 1 }}>
                            <Text style={styles.entryInvoice}>Invoice: {entry.invoiceNo}</Text>
                            <Text style={styles.small}>Date: {entry.invoiceDate}</Text>
                            <Text style={styles.small}>
                              Payment: {entry.paymentMode}
                              {entry.paymentRef ? ` (${entry.paymentRef})` : ""}
                            </Text>
                            {entry.attachment && (
                              <Text style={styles.file}>📎 {entry.attachment}</Text>
                            )}
                          </View>
                          <View style={{ alignItems: "flex-end" }}>
                            <Text
                              style={[
                                styles.entryAmount,
                                { color: entry.type === "Credit" ? "#16835c" : "#c62828" }
                              ]}
                            >
                              {entry.type === "Credit" ? "+" : "-"} ₹{entry.amount.toLocaleString("en-IN")}
                            </Text>
                            <TouchableOpacity
                              onPress={() => startEditEntry(entry)}
                              style={{ marginTop: 6 }}
                            >
                              <Text style={{ color: "#0759a8", fontWeight: "700", fontSize: 13 }}>
                                ✏️ Edit
                              </Text>
                            </TouchableOpacity>
                          </View>
                        </View>
                      ))
                    )}
                    <View style={styles.form}>
                      <Button text="BACK TO PROFILE" secondary onPress={() => setScreen("profile")} />
                    </View>
                  </ScrollView>
                </SafeAreaView>
              );
            }

            const currentList = tab === "Customers" ? customers : suppliers;

            return (
              <SafeAreaView style={styles.container}>
                <StatusBar barStyle="light-content" backgroundColor="#0759a8" />
                <ScrollView keyboardShouldPersistTaps="handled">
                  <View style={styles.header}>
                    <Text style={styles.logoTitle}>Vyapar Khata</Text>
                    <Text style={styles.subtitle}>Digital Business Ledger</Text>
                  </View>
                  <View style={styles.summary}>
                    <View style={styles.summaryBox}>
                      <Text style={styles.summaryLabel}>Customers</Text>
                      <Text style={styles.summaryValue}>₹{customerBalanceTotal.toLocaleString("en-IN")}</Text>
                    </View>
                    <View style={styles.summaryBox}>
                      <Text style={styles.summaryLabel}>Suppliers</Text>
                      <Text style={styles.summaryValue}>₹{supplierBalanceTotal.toLocaleString("en-IN")}</Text>
                    </View>
                  </View>
                  <View style={styles.tabs}>
                    {["Customers", "Suppliers"].map((t) => (
                      <TouchableOpacity
                        key={t}
                        style={[styles.tab, tab === t && styles.activeTab]}
                        onPress={() => setTab(t)}
                      >
                        <Text style={[styles.tabText, tab === t && styles.activeTabText]}>
                          {t.toUpperCase()}
                        </Text>
                      </TouchableOpacity>
                    ))}
                  </View>
                  <View style={styles.actionRow}>
                    <Button
                      text={`+ ADD ${tab === "Customers" ? "CUSTOMER" : "SUPPLIER"}`}
                      onPress={() => {
                        resetProfile();
                        setScreen("new");
                      }}
                    />
                  </View>
                  <View style={styles.sectionHeader}>
                    <Text style={styles.sectionTitle}>{tab}</Text>
                    <Text style={styles.count}>{currentList.length} Contacts</Text>
                  </View>
                  {currentList.length === 0 ? (
                    <View style={styles.empty}>
                      <Text style={styles.emptyText}>No {tab.toLowerCase()} added yet.</Text>
                    </View>
                  ) : (
                    currentList.map((item) => (
                      <TouchableOpacity
                        key={item.id}
                        style={styles.entryCard}
                        onPress={() => openProfile(item)}
                      >
                        <View>
                          <Text style={styles.title}>{item.name}</Text>
                          <Text style={styles.small}>{item.phone || "No phone"}</Text>
                        </View>
                        <Text style={styles.viewText}>View Profile →</Text>
                      </TouchableOpacity>
                    ))
                  )}
                </ScrollView>
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1, backgroundColor: "#f3f6fa" },
            header: { backgroundColor: "#0759a8", padding: 20, paddingTop: 25 },
            logoTitle: { color: "#fff", fontSize: 24, fontWeight: "800" },
            subtitle: { color: "#dbeaff", fontSize: 14, marginTop: 4 },
            summary: { flexDirection: "row", backgroundColor: "#fff", margin: 14, borderRadius: 12, padding: 16, elevation: 3 },
            summaryBox: { flex: 1, alignItems: "center" },
            summaryLabel: { color: "#666", fontSize: 13, marginBottom: 4 },
            summaryValue: { color: "#16835c", fontSize: 20, fontWeight: "800" },
            tabs: { flexDirection: "row", backgroundColor: "#0759a8" },
            tab: { flex: 1, alignItems: "center", paddingVertical: 12 },
            activeTab: { borderBottomWidth: 4, borderBottomColor: "#ffc928" },
            tabText: { color: "#dcecff", fontWeight: "700" },
            activeTabText: { color: "#fff" },
            actionRow: { margin: 14 },
            form: { padding: 14 },
            card: { backgroundColor: "#fff", margin: 14, padding: 16, borderRadius: 12, elevation: 2 },
            title: { fontSize: 18, fontWeight: "800", color: "#222" },
            small: { color: "#666", fontSize: 13, marginTop: 2 },
            balance: { fontSize: 20, fontWeight: "800", color: "#16835c", marginTop: 8 },
            balanceType: { fontSize: 12, color: "#777" },
            label: { fontSize: 13, fontWeight: "700", color: "#444", marginTop: 10, marginBottom: 4 },
            formTitle: { fontSize: 18, fontWeight: "800", marginBottom: 12, color: "#222" },
            sectionHeader: { flexDirection: "row", justifyContent: "space-between", marginHorizontal: 14, marginBottom: 8, alignItems: "center" },
            sectionTitle: { fontSize: 18, fontWeight: "800", color: "#222" },
            count: { color: "#666", fontSize: 13 },
            input: { borderWidth: 1, borderColor: "#ccc", borderRadius: 8, padding: 10, fontSize: 15, backgroundColor: "#fff", marginBottom: 10 },
            row: { flexDirection: "row", gap: 10, marginVertical: 8 },
            choice: { flex: 1, padding: 12, borderWidth: 1, borderColor: "#0759a8", borderRadius: 8, alignItems: "center" },
            choiceActive: { backgroundColor: "#0759a8" },
            choiceText: { fontWeight: "700", color: "#333" },
            activeChoiceText: { color: "#fff" },
            rowWrap: { flexDirection: "row", flexWrap: "wrap", gap: 8, marginVertical: 8 },
            payment: { paddingVertical: 6, paddingHorizontal: 12, borderWidth: 1, borderColor: "#ccc", borderRadius: 6 },
            paymentActive: { backgroundColor: "#0759a8", borderColor: "#0759a8" },
            paymentText: { fontSize: 13, color: "#333" },
            paymentTextActive: { color: "#fff", fontWeight: "700" },
            attach: { padding: 12, borderWidth: 1, borderColor: "#0759a8", borderRadius: 8, alignItems: "center", marginVertical: 8, borderStyle: "dashed", backgroundColor: "#f0f7ff" },
            attachText: { color: "#0759a8", fontWeight: "700" },
            file: { color: "#16835c", fontSize: 12, marginBottom: 6 },
            btn: { backgroundColor: "#0759a8", padding: 14, borderRadius: 8, alignItems: "center", marginVertical: 6 },
            btnSecondary: { backgroundColor: "#fff", borderWidth: 1, borderColor: "#999" },
            btnText: { color: "#fff", fontWeight: "800" },
            btnTextSecondary: { color: "#333" },
            entryCard: { backgroundColor: "#fff", marginHorizontal: 14, marginBottom: 8, padding: 14, borderRadius: 10, elevation: 1, flexDirection: "row", justifyContent: "space-between", alignItems: "center" },
            entryInvoice: { fontWeight: "700", color: "#222" },
            entryAmount: { fontSize: 16, fontWeight: "800" },
            viewText: { color: "#0759a8", fontWeight: "700", fontSize: 13 },
            empty: { padding: 30, alignItems: "center" },
            emptyText: { color: "#888" },
            infoRow: { flexDirection: "row", justifyContent: "space-between", paddingVertical: 8, borderBottomWidth: 1, borderColor: "#eee" },
            infoLabel: { color: "#777" },
            infoValue: { fontWeight: "600", color: "#222" },
            pickContactBtn: { backgroundColor: "#e3f2fd", paddingHorizontal: 10, paddingVertical: 4, borderRadius: 6 },
            pickContactText: { color: "#0759a8", fontSize: 12, fontWeight: "700" }
          });
          APPJS

          npx expo prebuild --platform android --no-install

      - name: Restore Existing Permanent Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks
          test -s vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Permanent Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          data = p.read_text()
          release_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """
          if "signingConfigs {" not in data:
              raise SystemExit("signingConfigs block not found")
          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + release_block,
              1
          )
          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )
          p.write_text(data)
          PY

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release-v32
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
