name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free
      NODE_ENV: production

    steps:

      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================
      # VERSION CODE
      # ============================================
      - name: Set Version Code
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using Version Code: $VERSION_CODE"


      # ============================================
      # NODE
      # ============================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ============================================
      # JAVA
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================
      # CREATE PACKAGE.JSON
      # ============================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF


      # ============================================
      # INSTALL DEPENDENCIES
      # ============================================
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps


      # ============================================
      # BABEL CONFIG
      # ============================================
      - name: Create Babel Config
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF


      # ============================================
      # INDEX.JS
      # ============================================
      - name: Create index.js
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";

          registerRootComponent(App);
          EOF


      # ============================================
      # APP.JSON
      # ============================================
      - name: Create app.json
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE}
              }
            }
          }
          EOF


      # ============================================
      # EXPO PREBUILD
      # ============================================
      - name: Expo Prebuild
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean


      # ============================================
      # SPLASH RESOURCE
      # ============================================
      - name: Fix Splash Resource
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF


           - name: Update Android Minimum SDK to 24
             run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle


      # ============================================
      # RESTORE EXISTING KEYSTORE
      # ============================================
      - name: Restore Existing Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not restored."
            exit 1
          fi

          echo "Existing signing keystore restored successfully."


      # ============================================
      # CONFIGURE SIGNING
      # ============================================
      - name: Configure Signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Remove our previous custom signing section only.
          text = re.sub(
              r'(?s)// VYAPAR_SIGNING_START.*?// VYAPAR_SIGNING_END',
              '',
              text
          )

          # Remove previously inserted custom signing config.
          text = re.sub(
              r'(?s)\n\s*vyaparRelease\s*\{\s*storeFile\s+file\("upload-keystore\.jks"\).*?\n\s*\}',
              '',
              text
          )

          # Remove previous release signing references.
          text = re.sub(
              r'\n\s*signingConfig\s+signingConfigs\.vyaparRelease',
              '',
              text
          )

          text = re.sub(
              r'\n\s*signingConfig\s+signingConfigs\.getByName\(["\']vyaparRelease["\']\)',
              '',
              text
          )

          android_pos = text.find("android {")

          if android_pos == -1:
              raise SystemExit("ERROR: android block not found")

          build_types_pos = text.find("buildTypes {", android_pos)

          if build_types_pos == -1:
              raise SystemExit("ERROR: buildTypes block not found")

          signing_block = '''
              // VYAPAR_SIGNING_START
              signingConfigs {
                  vyaparRelease {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              // VYAPAR_SIGNING_END

          '''

          text = (
              text[:build_types_pos]
              + signing_block
              + text[build_types_pos:]
          )

          # Find release block.
          build_types_pos = text.find("buildTypes {", android_pos)
          release_pos = text.find("release {", build_types_pos)

          if release_pos == -1:
              raise SystemExit("ERROR: release block not found")

          depth = 0
          opened = False
          release_end = None

          for i in range(release_pos, len(text)):
              if text[i] == "{":
                  depth += 1
                  opened = True
              elif text[i] == "}":
                  depth -= 1

                  if opened and depth == 0:
                      release_end = i
                      break

          if release_end is None:
              raise SystemExit("ERROR: release block end not found")

          release_content = text[release_pos:release_end]

          if "signingConfig" not in release_content:
              insert_at = release_pos + len("release {")

              text = (
                  text[:insert_at]
                  + '''
                      signingConfig signingConfigs.vyaparRelease
                  '''
                  + text[insert_at:]
              )

          path.write_text(text)

          print("Signing configuration configured successfully.")
          PY


      # ============================================
      # VERIFY SIGNING CONFIG
      # ============================================
      - name: Verify Signing Configuration
        run: |
          echo "===== SIGNING CONFIG ====="

          grep -n -A12 -B3 "VYAPAR_SIGNING_START" \
            android/app/build.gradle || true

          echo ""
          echo "===== SIGNING REFERENCES ====="

          grep -n "signingConfig" \
            android/app/build.gradle || true


      # ============================================
      # FIX EXPO MODULES CORE KOTLIN
      # ============================================
      - name: Fix Expo Modules Core Kotlin
        run: |
          FILE="node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: PermissionsService.kt not found"
            exit 1
          fi

          echo "===== ORIGINAL FILE AREA ====="
          nl -ba "$FILE" | sed -n '158,172p'

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()

          if len(lines) < 166:
              raise SystemExit(
                  "ERROR: PermissionsService.kt is shorter than 166 lines"
              )

          index = 165
          line = lines[index]

          print("")
          print("Original line 166:")
          print(line)

          # The actual compiler error is:
          #
          # Array<(out) String!>?
          #
          # Therefore the receiver on this line needs a Kotlin
          # null-safety assertion.
          #
          # Patch only the first matching nullable-array operation
          # on line 166.

          patterns = [
              (
                  r'(\b[A-Za-z_][A-Za-z0-9_]*)\.contains\(',
                  r'\1!!.contains('
              ),
              (
                  r'(\b[A-Za-z_][A-Za-z0-9_]*)\.any\s*\{',
                  r'\1!!.any {'
              ),
              (
                  r'(\b[A-Za-z_][A-Za-z0-9_]*)\.indexOf\(',
                  r'\1!!.indexOf('
              ),
              (
                  r'(\b[A-Za-z_][A-Za-z0-9_]*)\.isEmpty\(\)',
                  r'\1!!.isEmpty()'
              ),
              (
                  r'(\b[A-Za-z_][A-Za-z0-9_]*)\.isNotEmpty\(\)',
                  r'\1!!.isNotEmpty()'
              )
          ]

          patched = line

          for pattern, replacement in patterns:
              candidate = re.sub(
                  pattern,
                  replacement,
                  patched,
                  count=1
              )

              if candidate != patched:
                  patched = candidate
                  break

          if patched == line:
              print("")
              print("ERROR: Could not identify the nullable-array call")
              print("on line 166.")
              print("")
              print("The workflow will stop instead of modifying")
              print("the wrong source code.")
              raise SystemExit(1)

          lines[index] = patched
          path.write_text("\n".join(lines) + "\n")

          print("")
          print("Patched line 166:")
          print(lines[index])
          PY

          echo ""
          echo "===== PATCHED FILE AREA ====="
          nl -ba "$FILE" | sed -n '158,172p'
      - name: Set Android Minimum SDK to 24
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("app/build.gradle")

          if not path.exists():
              sys.exit("ERROR: android/app/build.gradle not found")

          text = path.read_text()
          original = text

          text = re.sub(
              r'(\bminSdkVersion\s*=\s*)\d+',
              r'\g<1>24',
              text
          )

          text = re.sub(
              r'(\bminSdkVersion\s+)\\?\d+',
              r'\g<1>24',
              text
          )

          text = re.sub(
              r'(\bminSdk\s*=\s*)\d+',
              r'\g<1>24',
              text
          )

          if text == original:
              print("No direct minSdk value changed; checking Expo config.")
          else:
              path.write_text(text)
              print("Updated minSdk setting in app/build.gradle")

          check = path.read_text()

          if not re.search(
              r'minSdkVersion\s*=?\s*24|\bminSdk\s*=\s*24',
              check
          ):
              sys.exit(
                  "ERROR: Could not verify minSdkVersion 24 in app/build.gradle"
              )

          print("Minimum SDK verification passed.")
          PY

      # ============================================
      # BUILD RELEASE AAB
      # ============================================
      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          cd android

          chmod +x gradlew

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace


      # ============================================
      # CHECK AAB
      # ============================================
      - name: Check AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not created."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       VYAPAR KHATA AAB SUCCESS"
          echo "=========================================="
          echo "Package Name : ${PACKAGE_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "AAB File     : ${AAB}"
          echo "=========================================="

          ls -lh "$AAB"


      # ============================================
      # UPLOAD AAB
      # ============================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # ============================================
      # FINAL
      # ============================================
      - name: Build Successful
        run: |
          echo ""
          echo "=========================================="
          echo "VYAPAR KHATA BUILD COMPLETED"
          echo "=========================================="
          echo "Package     : ${PACKAGE_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo "AAB         : app-release.aab"
          echo "=========================================="
