
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. VERSION CODE
      # --------------------------------------------------
      - name: Set Version Code
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using Version Code: $VERSION_CODE"


      # --------------------------------------------------
      # 3. NODE
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # --------------------------------------------------
      # 4. JAVA
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 5. PACKAGE.JSON
      # --------------------------------------------------
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF


      # --------------------------------------------------
      # 6. INSTALL
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps


      # --------------------------------------------------
      # 7. BABEL
      # --------------------------------------------------
      - name: Create Babel Config
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF


      # --------------------------------------------------
      # 8. INDEX
      # --------------------------------------------------
      - name: Create index.js
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";

          registerRootComponent(App);
          EOF


      # --------------------------------------------------
      # 9. APP.JSON
      # --------------------------------------------------
      - name: Create app.json
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE}
              }
            }
          }
          EOF


      # --------------------------------------------------
      # 10. EXPO PREBUILD
      # --------------------------------------------------
      - name: Expo Prebuild
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean


      # --------------------------------------------------
      # 11. SPLASH FIX
      # --------------------------------------------------
      - name: Fix Splash Resource
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF


      # --------------------------------------------------
      # 12. ANDROID SDK 36
      # --------------------------------------------------
      - name: Configure Android SDK
        run: |
          cat >> android/gradle.properties <<'EOF'

          android.compileSdkVersion=36
          android.targetSdkVersion=36
          android.buildToolsVersion=36.0.0
          EOF


      # --------------------------------------------------
      # 13. RESTORE EXISTING KEYSTORE
      # --------------------------------------------------
      - name: Restore Existing Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Existing keystore restored successfully."


      # --------------------------------------------------
      # 14. CONFIGURE SIGNING
      # --------------------------------------------------
      # IMPORTANT:
      # We remove ALL previous custom signing blocks first.
      # Then we create exactly ONE vyaparRelease config.
      # --------------------------------------------------
      - name: Configure Signing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # ---------------------------------------------
          # Remove previous custom signing blocks
          # ---------------------------------------------

          # Remove blocks marked by our previous scripts.
          text = re.sub(
              r'(?s)// VYAPAR_SIGNING_START.*?// VYAPAR_SIGNING_END',
              '',
              text
          )

          # Remove any existing vyaparRelease signing block.
          pattern = r'''
              signingConfigs
              \s*\{
              (?:
                  (?!\n\s*\})
                  .
              )*?
              vyaparRelease
              (?:
                  .
              )*?
              \}
          '''

          text = re.sub(
              pattern,
              '',
              text,
              flags=re.VERBOSE | re.DOTALL
          )

          # Remove direct references to old config.
          text = re.sub(
              r'\s*signingConfig\s+signingConfigs\.vyaparRelease',
              '',
              text
          )

          text = re.sub(
              r'\s*signingConfig\s+signingConfigs\.getByName\(["\']vyaparRelease["\']\)',
              '',
              text
          )

          # ---------------------------------------------
          # Find android block
          # ---------------------------------------------

          android_pos = text.find("android {")

          if android_pos == -1:
              raise SystemExit("ERROR: android block not found")

          build_types_pos = text.find(
              "buildTypes {",
              android_pos
          )

          if build_types_pos == -1:
              raise SystemExit("ERROR: buildTypes block not found")

          # ---------------------------------------------
          # Add ONE signing config
          # ---------------------------------------------

          signing_block = '''
              signingConfigs {
                  vyaparRelease {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

          '''

          text = (
              text[:build_types_pos]
              + signing_block
              + text[build_types_pos:]
          )

          # ---------------------------------------------
          # Find release block
          # ---------------------------------------------

          build_types_pos = text.find(
              "buildTypes {",
              android_pos
          )

          release_pos = text.find(
              "release {",
              build_types_pos
          )

          if release_pos == -1:
              raise SystemExit("ERROR: release block not found")

          # ---------------------------------------------
          # Find release block ending
          # ---------------------------------------------

          depth = 0
          opened = False
          release_end = None

          for i in range(release_pos, len(text)):

              if text[i] == "{":
                  depth += 1
                  opened = True

              elif text[i] == "}":
                  depth -= 1

                  if opened and depth == 0:
                      release_end = i
                      break

          if release_end is None:
              raise SystemExit(
                  "ERROR: Could not find release block end"
              )

          # ---------------------------------------------
          # Add signing config to release
          # ---------------------------------------------

          release_content = text[
              release_pos:release_end
          ]

          if "signingConfig" not in release_content:

              insert_position = (
                  release_pos + len("release {")
              )

              text = (
                  text[:insert_position]
                  + '''
                      signingConfig signingConfigs.vyaparRelease
                  '''
                  + text[insert_position:]
              )

          path.write_text(text)

          print("")
          print("======================================")
          print("SIGNING CONFIG CREATED")
          print("======================================")
          print("Config: vyaparRelease")
          print("Keystore: upload-keystore.jks")
          print("======================================")
          PY


      # --------------------------------------------------
      # 15. VERIFY SIGNING
      # --------------------------------------------------
      - name: Verify Signing Configuration
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking keystore..."

          test -f android/app/upload-keystore.jks

          echo "Keystore exists."

          echo ""
          echo "Signing configuration:"
          grep -n "vyaparRelease" \
            android/app/build.gradle || true

          echo ""
          echo "Signing references:"
          grep -n "signingConfig" \
            android/app/build.gradle || true


      # --------------------------------------------------
      # 16. BUILD AAB
      # --------------------------------------------------
      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android

          chmod +x gradlew

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 17. CHECK AAB
      # --------------------------------------------------
      - name: Check AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          echo ""
          echo "======================================"
          echo "AAB BUILD SUCCESS"
          echo "======================================"

          ls -lh "$AAB"

          echo ""
          echo "Package:"
          echo "${PACKAGE_NAME}"

          echo ""
          echo "Version Code:"
          echo "${VERSION_CODE}"

          echo "======================================"


      # --------------------------------------------------
      # 18. UPLOAD AAB ARTIFACT
      # --------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      # --------------------------------------------------
      # 19. SUCCESS
      # --------------------------------------------------
      - name: Build Successful
        run: |
          echo ""
          echo "======================================"
          echo "VYAPAR KHATA AAB SUCCESSFUL"
          echo "======================================"
          echo "Package: ${PACKAGE_NAME}"
          echo "Version Code: ${VERSION_CODE}"
          echo "AAB: app-release.aab"
          echo "======================================"
```- SDK 36
- AAB output `app-release.aab`

सबसे महत्वपूर्ण: **पुराने build.yml का कोई हिस्सा साथ में न रखें**, खासकर पुराना `Configure Signing Directly` step।
