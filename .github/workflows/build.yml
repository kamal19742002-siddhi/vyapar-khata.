
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version Code
        shell: bash
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Version Code: $VERSION_CODE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify App Source
        run: |
          test -f App.js || {
            echo "ERROR: App.js is missing"
            exit 1
          }

      - name: Create package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "expo-contacts": "~13.0.5",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Babel Config
        shell: bash
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF

      - name: Create index.js
        shell: bash
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";
          registerRootComponent(App);
          EOF

      - name: Create app.json
        shell: bash
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE}
              }
            }
          }
          EOF

      - name: Expo Prebuild
        shell: bash
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

      - name: Fix Splash Resource
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Set Minimum SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/gradle.properties")
          s = p.read_text() if p.exists() else ""

          s = re.sub(
              r'(?m)^[ \t]*android\.minSdkVersion[ \t]*=.*\n?',
              '',
              s
          ).rstrip()

          s += "\nandroid.minSdkVersion=24\n"
          p.write_text(s)
          print("Minimum SDK set to 24")
          PY

      - name: Restore Existing Signing Key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks
          echo "Keystore restored"

      - name: Configure Signing
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD is missing"
            exit 1
          }

          test -s android/app/upload-keystore.jks

          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          keytool -certreq \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/vyapar-test.csr

          rm -f /tmp/vyapar-test.csr

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Find buildTypes block
          m = re.search(r'\bbuildTypes\s*\{', s)
          if not m:
              sys.exit("ERROR: buildTypes block not found")

          # Find release block within buildTypes
          r = re.search(r'\brelease\s*\{', s[m.end():])
          if not r:
              sys.exit("ERROR: release block not found inside buildTypes")

          release_start = m.end() + r.start()

          def find_block_end(text, opening):
              depth = 0
              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          opening = s.find("{", release_start)
          end = find_block_end(s, opening)

          if end < 0:
              sys.exit("ERROR: release block is malformed")

          # Add signing config inside android block, before buildTypes
          if not re.search(r'\bvyaparRelease\s*\{', s):
              config = '''
              signingConfigs {
                  vyaparRelease {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              '''
              s = s[:m.start()] + config + s[m.start():]

          # Find the blocks again after possible insertion
          m = re.search(r'\bbuildTypes\s*\{', s)
          r = re.search(r'\brelease\s*\{', s[m.end():])
          if not m or not r:
              sys.exit("ERROR: release build type not found after insertion")

          release_start = m.end() + r.start()
          opening = s.find("{", release_start)
          end = find_block_end(s, opening)

          if end < 0:
              sys.exit("ERROR: release block is malformed")

          block = s[release_start:end + 1]

          # Remove existing signingConfig lines only in release block
          block = re.sub(
              r'(?m)^[ \t]*signingConfig\s+signingConfigs\.\w+[ \t]*\n?',
              '',
              block
          )

          # Add the intended signing config
          block = block[:-1].rstrip() + '''
                  signingConfig signingConfigs.vyaparRelease
              }
          '''

          s = s[:release_start] + block + s[end + 1:]
          p.write_text(s)

          print("Release signing configuration updated")
          PY

          echo "Certificate fingerprints:"
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E "SHA1:|SHA256:"

      - name: Verify Release Signing Configuration
        shell: bash
        run: |
          set -e
          grep -n -A 15 -B 3 "signingConfigs" android/app/build.gradle
          grep -n -A 15 "buildTypes" android/app/build.gradle
          ls -l android/app/upload-keystore.jks

      - name: Build Production Android App Bundle (AAB)
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB File
        if: success()
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$AAB" ]; then
            echo "ERROR: AAB file was not generated"
            exit 1
          fi

          ls -lh "$AAB"
          echo "AAB verified"

      - name: Upload AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vyapar-Khata-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
