
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check project files
        shell: bash
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== APP FILE ====="
          test -f App.js && echo "App.js found" || echo "ERROR: App.js missing"
          echo "===== PACKAGE ====="
          test -f package.json && cat package.json || exit 1
          echo "===== APP CONFIG ====="
          if [ -f app.json ]; then
            cat app.json
          elif [ -f app.config.js ]; then
            cat app.config.js
          else
            echo "ERROR: app.json/app.config.js missing"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Expo and EAS CLI
        shell: bash
        run: |
          npx expo --version
          npm install --global eas-cli
          eas --version

      - name: Create EAS configuration
        shell: bash
        run: |
          cat > eas.json <<'EOF'
          {
            "build": {
              "production": {
                "distribution": "store",
                "android": {
                  "buildType": "app-bundle"
                },
                "autoIncrement": true
              }
            }
          }
          EOF

          echo "===== eas.json ====="
          cat eas.json

      - name: Check Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN GitHub Secret is missing."
            exit 1
          fi

          npx expo config --type public

      - name: Check JavaScript syntax
        shell: bash
        run: |
          echo "Checking App.js syntax..."

          node --check App.js

          echo "JavaScript syntax check passed."

      - name: Build Android App Bundle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "Starting EAS Android production AAB build..."

          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > eas-build-result.json

          echo "===== EAS BUILD RESULT ====="
          cat eas-build-result.json

      - name: Download AAB
        shell: bash
        run: |
          set -e

          BUILD_URL=$(node -e "
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('eas-build-result.json','utf8'));
          const url=x.artifacts && x.artifacts.buildUrl;
          if(!url) process.exit(2);
          console.log(url);
          ")

          echo "AAB URL:"
          echo "$BUILD_URL"

          curl -L "$BUILD_URL" -o vyapar-khata-release.aab

          echo "===== AAB FILE ====="
          ls -lh vyapar-khata-release.aab

          FILE_SIZE=$(stat -c%s vyapar-khata-release.aab)

          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: Downloaded AAB looks invalid."
            exit 1
          fi

          echo "AAB downloaded successfully."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: vyapar-khata-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          echo "======================================"
          echo "       VYAPAR KHATA AAB READY"
          echo "======================================"
          ls -lh vyapar-khata-release.aab
          echo ""
          echo "GitHub Actions -> Artifacts"
          echo "Download: vyapar-khata-aab"
          echo "======================================"
