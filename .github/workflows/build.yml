name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata

          npm install
          npx expo install expo-document-picker
          npx expo install @react-native-async-storage/async-storage

          node - <<'NODE'
          const fs = require("fs");

          const p = "app.json";
          const app = JSON.parse(fs.readFileSync(p, "utf8"));

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.29";

          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 29
          };

          fs.writeFileSync(p, JSON.stringify(app, null, 2));
          NODE

          cat > App.js <<'APPJS'
          import React, {useEffect, useMemo, useState} from "react";
          import {
            Alert,
            SafeAreaView,
            ScrollView,
            StatusBar,
            StyleSheet,
            Text,
            TextInput,
            TouchableOpacity,
            View
          } from "react-native";

          import AsyncStorage from "@react-native-async-storage/async-storage";
          import * as DocumentPicker from "expo-document-picker";

          const STORE = "@vyapar_khata_data_v2";

          const today = () => {
            const d = new Date();
            return (
              String(d.getDate()).padStart(2, "0") +
              "/" +
              String(d.getMonth() + 1).padStart(2, "0") +
              "/" +
              d.getFullYear()
            );
          };

          export default function App() {

            const [screen, setScreen] = useState("home");
            const [tab, setTab] = useState("Customers");

            const [customers, setCustomers] = useState([]);
            const [suppliers, setSuppliers] = useState([]);

            const [selected, setSelected] = useState(null);

            const [name, setName] = useState("");
            const [phone, setPhone] = useState("");
            const [gst, setGst] = useState("");
            const [address, setAddress] = useState("");
            const [email, setEmail] = useState("");

            const [invoiceNo, setInvoiceNo] = useState("");
            const [invoiceDate, setInvoiceDate] = useState(today());
            const [amount, setAmount] = useState("");
            const [paymentMode, setPaymentMode] = useState("Cash");
            const [entryType, setEntryType] = useState("Credit");
            const [attachment, setAttachment] = useState(null);

            useEffect(() => {
              loadData();
            }, []);

            const loadData = async () => {
              try {
                const raw = await AsyncStorage.getItem(STORE);

                if (raw) {
                  const data = JSON.parse(raw);
                  setCustomers(data.customers || []);
                  setSuppliers(data.suppliers || []);
                }
              } catch (e) {
                console.log(e);
              }
            };

            const saveData = async (c, s) => {
              await AsyncStorage.setItem(
                STORE,
                JSON.stringify({
                  customers: c,
                  suppliers: s
                })
              );
            };

            const currentList =
              tab === "Customers" ? customers : suppliers;

            const resetProfile = () => {
              setName("");
              setPhone("");
              setGst("");
              setAddress("");
              setEmail("");
              setInvoiceNo("");
              setInvoiceDate(today());
              setAmount("");
              setPaymentMode("Cash");
              setEntryType("Credit");
              setAttachment(null);
            };

            const addPerson = async () => {

              if (!name.trim()) {
                Alert.alert("Required", "Please enter name.");
                return;
              }

              const person = {
                id: Date.now().toString(),
                name: name.trim(),
                phone: phone.trim(),
                gst: gst.trim(),
                address: address.trim(),
                email: email.trim(),
                entries: []
              };

              if (tab === "Customers") {
                const updated = [person, ...customers];
                setCustomers(updated);
                await saveData(updated, suppliers);
              } else {
                const updated = [person, ...suppliers];
                setSuppliers(updated);
                await saveData(customers, updated);
              }

              resetProfile();
              setScreen("home");

              Alert.alert(
                "Saved",
                `${tab === "Customers" ? "Customer" : "Supplier"} profile saved.`
              );
            };

            const addTransaction = async () => {

              if (!selected) return;

              const value = Number(amount);

              if (!invoiceNo.trim()) {
                Alert.alert("Required", "Enter invoice number.");
                return;
              }

              if (!amount.trim() || !Number.isFinite(value) || value <= 0) {
                Alert.alert("Invalid Amount", "Enter a valid amount.");
                return;
              }

              const entry = {
                id: Date.now().toString(),
                invoiceNo: invoiceNo.trim(),
                invoiceDate: invoiceDate.trim() || today(),
                amount: value,
                paymentMode,
                type: entryType,
                attachment: attachment
                  ? attachment.name
                  : null
              };

              const list =
                tab === "Customers" ? customers : suppliers;

              const updated = list.map(person =>
                person.id === selected.id
                  ? {
                      ...person,
                      entries: [entry, ...(person.entries || [])]
                    }
                  : person
              );

              if (tab === "Customers") {
                setCustomers(updated);
                await saveData(updated, suppliers);
              } else {
                setSuppliers(updated);
                await saveData(customers, updated);
              }

              const fresh = updated.find(x => x.id === selected.id);
              setSelected(fresh);

              setInvoiceNo("");
              setInvoiceDate(today());
              setAmount("");
              setPaymentMode("Cash");
              setEntryType("Credit");
              setAttachment(null);

              Alert.alert("Saved", "Passbook entry saved.");
            };

            const chooseInvoice = async () => {

              const result =
                await DocumentPicker.getDocumentAsync({
                  type: ["image/*", "application/pdf"],
                  copyToCacheDirectory: true
                });

              if (!result.canceled && result.assets?.length) {
                setAttachment(result.assets[0]);
              }
            };

            const total = useMemo(() => {

              if (!selected) return 0;

              return (selected.entries || []).reduce(
                (sum, e) =>
                  e.type === "Credit"
                    ? sum + e.amount
                    : sum - e.amount,
                0
              );

            }, [selected]);

            const openProfile = person => {
              setSelected(person);
              setScreen("profile");
            };

            const openPassbook = person => {
              setSelected(person);
              setScreen("passbook");
            };

            const openNewPerson = () => {
              resetProfile();
              setScreen("new");
            };

            const goBack = () => {
              setScreen("home");
              setSelected(null);
            };

            if (screen === "new") {
              return (
                <SafeAreaView style={styles.container}>
                  <StatusBar
                    barStyle="light-content"
                    backgroundColor="#0759a8"
                  />

                  <ScrollView>
                    <Header title={`New ${tab === "Customers" ? "Customer" : "Supplier"} Profile`} />

                    <View style={styles.form}>

                      <Text style={styles.label}>Name *</Text>
                      <TextInput
                        style={styles.input}
                        placeholder="Customer / Supplier Name"
                        value={name}
                        onChangeText={setName}
                      />

                      <Text style={styles.label}>Phone Number</Text>
                      <TextInput
                        style={styles.input}
                        placeholder="Phone Number"
                        keyboardType="phone-pad"
                        value={phone}
                        onChangeText={setPhone}
                      />

                      <Text style={styles.label}>GST Number</Text>
                      <TextInput
                        style={styles.input}
                        placeholder="GST Number"
                        value={gst}
                        onChangeText={setGst}
                        autoCapitalize="characters"
                      />

                      <Text style={styles.label}>Email ID</Text>
                      <TextInput
                        style={styles.input}
                        placeholder="Email ID"
                        keyboardType="email-address"
                        value={email}
                        onChangeText={setEmail}
                      />

                      <Text style={styles.label}>Address</Text>
                      <TextInput
                        style={[styles.input, styles.address]}
                        placeholder="Full Address"
                        multiline
                        value={address}
                        onChangeText={setAddress}
                      />

                      <Button
                        text="SAVE PROFILE"
                        onPress={addPerson}
                      />

                      <Button
                        text="CANCEL"
                        secondary
                        onPress={goBack}
                      />

                    </View>
                  </ScrollView>
                </SafeAreaView>
              );
            }

            if (screen === "profile" && selected) {
              return (
                <SafeAreaView style={styles.container}>
                  <StatusBar
                    barStyle="light-content"
                    backgroundColor="#0759a8"
                  />

                  <ScrollView>

                    <Header title="Profile" />

                    <View style={styles.profileCard}>

                      <Text style={styles.profileName}>
                        {selected.name}
                      </Text>

                      <Info title="Phone Number" value={selected.phone} />
                      <Info title="GST Number" value={selected.gst} />
                      <Info title="Email ID" value={selected.email} />
                      <Info title="Address" value={selected.address} />

                    </View>

                    <View style={styles.profileActions}>

                      <Button
                        text="OPEN PASSBOOK"
                        onPress={() => openPassbook(selected)}
                      />

                      <Button
                        text="BACK"
                        secondary
                        onPress={goBack}
                      />

                    </View>

                  </ScrollView>
                </SafeAreaView>
              );
            }

            if (screen === "passbook" && selected) {
              return (
                <SafeAreaView style={styles.container}>
                  <StatusBar
                    barStyle="light-content"
                    backgroundColor="#0759a8"
                  />

                  <ScrollView>

                    <Header title="Passbook" />

                    <View style={styles.passbookHead}>

                      <Text style={styles.profileName}>
                        {selected.name}
                      </Text>

                      <Text style={styles.small}>
                        {selected.phone || "No phone number"}
                      </Text>

                      <Text style={styles.balance}>
                        Balance: ₹{Math.abs(total).toLocaleString("en-IN")}
                      </Text>

                      <Text style={styles.balanceType}>
                        {total >= 0 ? "Credit Balance" : "Debit Balance"}
                      </Text>

                    </View>

                    <View style={styles.form}>

                      <Text style={styles.formTitle}>
                        New Passbook Entry
                      </Text>

                      <TextInput
                        style={styles.input}
                        placeholder="Invoice Number"
                        value={invoiceNo}
                        onChangeText={setInvoiceNo}
                      />

                      <TextInput
                        style={styles.input}
                        placeholder="Invoice Date"
                        value={invoiceDate}
                        onChangeText={setInvoiceDate}
                      />

                      <TextInput
                        style={styles.input}
                        placeholder="Amount"
                        keyboardType="numeric"
                        value={amount}
                        onChangeText={setAmount}
                      />

                      <Text style={styles.label}>
                        Transaction Type
                      </Text>

                      <View style={styles.row}>

                        <TouchableOpacity
                          style={[
                            styles.choice,
                            entryType === "Credit" &&
                            styles.choiceActive
                          ]}
                          onPress={() => setEntryType("Credit")}
                        >
                          <Text style={styles.choiceText}>
                            + Jama / Credit
                          </Text>
                        </TouchableOpacity>

                        <TouchableOpacity
                          style={[
                            styles.choice,
                            entryType === "Debit" &&
                            styles.choiceActive
                          ]}
                          onPress={() => setEntryType("Debit")}
                        >
                          <Text style={styles.choiceText}>
                            - Udhar / Debit
                          </Text>
                        </TouchableOpacity>

                      </View>

                      <Text style={styles.label}>
                        Mode of Payment
                      </Text>

                      <View style={styles.rowWrap}>

                        {["Cash","UPI","Bank","Cheque","Credit","Other"].map(mode => (
                          <TouchableOpacity
                            key={mode}
                            style={[
                              styles.payment,
                              paymentMode === mode &&
                              styles.paymentActive
                            ]}
                            onPress={() => setPaymentMode(mode)}
                          >
                            <Text style={styles.paymentText}>
                              {mode}
                            </Text>
                          </TouchableOpacity>
                        ))}

                      </View>

                      <TouchableOpacity
                        style={styles.attach}
                        onPress={chooseInvoice}
                      >
                        <Text style={styles.attachText}>
                          📎 Attach Invoice Copy
                        </Text>
                      </TouchableOpacity>

                      {attachment && (
                        <Text style={styles.file}>
                          Selected: {attachment.name}
                        </Text>
                      )}

                      <Button
                        text="SAVE PASSBOOK ENTRY"
                        onPress={addTransaction}
                      />

                    </View>

                    <Text style={styles.sectionTitle}>
                      Transaction History
                    </Text>

                    {(selected.entries || []).length === 0 ? (
                      <View style={styles.empty}>
                        <Text>No transactions yet.</Text>
                      </View>
                    ) : (
                      selected.entries.map(entry => (
                        <View
                          key={entry.id}
                          style={styles.transaction}
                        >

                          <View style={{flex:1}}>

                            <Text style={styles.invoice}>
                              Invoice: {entry.invoiceNo}
                            </Text>

                            <Text style={styles.small}>
                              Date: {entry.invoiceDate}
                            </Text>

                            <Text style={styles.small}>
                              Payment: {entry.paymentMode}
                            </Text>

                            {entry.attachment && (
                              <Text style={styles.file}>
                                📎 {entry.attachment}
                              </Text>
                            )}

                          </View>

                          <View style={{alignItems:"flex-end"}}>

                            <Text
                              style={[
                                styles.transactionAmount,
                                {
                                  color:
                                    entry.type === "Credit"
                                      ? "#16835c"
                                      : "#c62828"
                                }
                              ]}
                            >
                              {entry.type === "Credit" ? "+" : "-"}
                              ₹{entry.amount.toLocaleString("en-IN")}
                            </Text>

                            <Text style={styles.small}>
                              {entry.type}
                            </Text>

                          </View>

                        </View>
                      ))
                    )}

                    <View style={styles.form}>
                      <Button
                        text="BACK TO PROFILE"
                        secondary
                        onPress={() => setScreen("profile")}
                      />
                    </View>

                  </ScrollView>
                </SafeAreaView>
              );
            }

            return (
              <SafeAreaView styardShouldPersistTaps="handled"
                >

                  <View style={styles.header}>

                    <Text style={styles.logoTitle}>
                      Vyapar Khata
                    </Text>

                    <Text style={styles.subtitle}>
                      Digital Business Ledger
                    </Text>

                    <Text style={styles.businessName}>
                      Siddhi Enterprises
                    </Text>

                  </View>

                  <View style={styles.summary}>

                    <View style={styles.summaryBox}>
                      <Text style={styles.summaryLabel}>
                        Customers
                      </Text>

                      <Text style={styles.summaryValue}>
                        ₹{customerTotal.toLocaleString("en-IN")}
                      </Text>
                    </View>

                    <View style={styles.summaryBox}>
                      <Text style={styles.summaryLabel}>
                        Suppliers
                      </Text>

                      <Text style={styles.summaryValue}>
                        ₹{supplierTotal.toLocaleString("en-IN")}
                      </Text>
                    </View>

                  </View>

                  <View style={styles.tabs}>

                    <TouchableOpacity
                      style={[
                        styles.tab,
                        activeTab === "Customers" &&
                        styles.activeTab
                      ]}
                      onPress={() => setActiveTab("Customers")}
                    >
                      <Text
                        style={[
                          styles.tabText,
                          activeTab === "Customers" &&
                          styles.activeTabText
                        ]}
                      >
                        CUSTOMERS
                      </Text>
                    </TouchableOpacity>

                    <TouchableOpacity
                      style={[
                        styles.tab,
                        activeTab === "Suppliers" &&
                        styles.activeTab
                      ]}
                      onPress={() => setActiveTab("Suppliers")}
                    >
                      <Text
                        style={[
                          styles.tabText,
                          activeTab === "Suppliers" &&
                          styles.activeTabText
                        ]}
                      >
                        SUPPLIERS
                      </Text>
                    </TouchableOpacity>

                  </View>

                  <View style={styles.formCard}>

                    <Text style={styles.formTitle}>
                      {activeTab === "Customers"
                        ? "New Customer Entry"
                        : "New Supplier Entry"}
                    </Text>

                    <TextInput
                      style={styles.input}
                      placeholder={
                        activeTab === "Customers"
                          ? "Customer Name"
                          : "Supplier Name"
                      }
                      placeholderTextColor="#777"
                      value={name}
                      onChangeText={setName}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Invoice Number"
                      placeholderTextColor="#777"
                      value={invoiceNo}
                      onChangeText={setInvoiceNo}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Invoice Date (DD/MM/YYYY)"
                      placeholderTextColor="#777"
                      value={invoiceDate}
                      onChangeText={setInvoiceDate}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Amount (₹)"
                      placeholderTextColor="#777"
                      keyboardType="numeric"
                      value={amount}
                      onChangeText={setAmount}
                    />

                    <View style={styles.pickerBox}>

                      <Text style={styles.pickerLabel}>
                        Mode of Payment
                      </Text>

                      <Picker
                        selectedValue={paymentMode}
                        onValueChange={value =>
                          setPaymentMode(value)
                        }
                        style={styles.picker}
                      >
                        <Picker.Item
                          label="Cash"
                          value="Cash"
                        />

                        <Picker.Item
                          label="UPI"
                          value="UPI"
                        />

                        <Picker.Item
                          label="Bank Transfer"
                          value="Bank"
                        />

                        <Picker.Item
                          label="Cheque"
                          value="Cheque"
                        />

                        <Picker.Item
                          label="Credit"
                          value="Credit"
                        />

                        <Picker.Item
                          label="Other"
                          value="Other"
                        />

                      </Picker>

                    </View>

                    <TouchableOpacity
                      style={styles.attachButton}
                      onPress={chooseAttachment}
                    >
                      <Text style={styles.attachText}>
                        📎 Attach Invoice Copy
                      </Text>
                    </TouchableOpacity>

                    {attachment ? (
                      <Text style={styles.selectedFile}>
                        Selected: {attachment.name}
                      </Text>
                    ) : null}

                    <TouchableOpacity
                      style={styles.saveButton}
                      onPress={addEntry}
                    >
                      <Text style={styles.saveText}>
                        + SAVE ENTRY
                      </Text>
                    </TouchableOpacity>

                  </View>

                  <View style={styles.passbookCard}>

                    <View>
                      <Text style={styles.passbookTitle}>
                        Passbook
                      </Text>

                      <Text style={styles.passbookSub}>
                        View all account entries
                      </Text>
                    </View>

                    <TouchableOpacity
                      style={styles.passbookButton}
                      onPress={() =>
                        Alert.alert(
                          "Passbook",
                          `Customers: ${entries.filter(e => e.type === "Customers").length}\n` +
                          `Suppliers: ${entries.filter(e => e.type === "Suppliers").length}`
                        )
                      }
                    >
                      <Text style={styles.passbookButtonText}>
                        OPEN
                      </Text>
                    </TouchableOpacity>

                  </View>

                  <View style={styles.sectionHeader}>

                    <Text style={styles.sectionTitle}>
                      {activeTab}
                    </Text>

                    <Text style={styles.count}>
                      {filteredEntries.length} Entries
                    </Text>

                  </View>

                  <FlatList
                    data={filteredEntries}
                    keyExtractor={item => item.id}
                    renderItem={renderEntry}
                    scrollEnabled={false}
                    ListEmptyComponent={
                      <View style={styles.empty}>
                        <Text style={styles.emptyText}>
                          No {activeTab.toLowerCase()} entries yet.
                        </Text>
                      </View>
                    }
                  />

                  <View style={styles.footerSpace} />

                </ScrollView>

              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({

            container: {
              flex: 1,
              backgroundColor: "#f3f6fa"
            },

            scroll: {
              paddingBottom: 30
            },

            header: {
              backgroundColor: "#0759a8",
              paddingTop: 25,
              paddingBottom: 22,
              paddingHorizontal: 20
            },

            logoTitle: {
              color: "#fff",
              fontSize: 29,
              fontWeight: "800"
            },

            subtitle: {
              color: "#dbeaff",
              fontSize: 15,
              marginTop: 4
            },

            businessName: {
              color: "#fff",
              fontSize: 14,
              marginTop: 14,
              fontWeight: "600"
            },

            summary: {
              flexDirection: "row",
              backgroundColor: "#fff",
              marginHorizontal: 14,
              marginTop: -2,
              borderRadius: 16,
              paddingVertical: 18,
              elevation: 4,
              shadowOpacity: 0.1
            },

            summaryBox: {
              flex: 1,
              alignItems: "center"
            },

            summaryLabel: {
              color: "#555",
              fontSize: 14,
              marginBottom: 6
            },

            summaryValue: {
              color: "#16835c",
              fontSize: 22,
              fontWeight: "800"
            },

            tabs: {
              flexDirection: "row",
              backgroundColor: "#0759a8",
              marginTop: 15
            },

            tab: {
              flex: 1,
              alignItems: "center",
              paddingVertical: 14
            },

            activeTab: {
              borderBottomWidth: 4,
              borderBottomColor: "#ffc928"
            },

            tabText: {
              color: "#dcecff",
              fontSize: 15,
              fontWeight: "700"
            },

            activeTabText: {
              color: "#fff"
            },

            formCard: {
              backgroundColor: "#fff",
              margin: 14,
              padding: 18,
              borderRadius: 18,
              elevation: 3
            },

            formTitle: {
              fontSize: 21,
              fontWeight: "800",
              color: "#252525",
              marginBottom: 14
            },

            input: {
              borderWidth: 1,
              borderColor: "#d4d8de",
              borderRadius: 12,
              paddingHorizontal: 14,
              paddingVertical: 13,
              fontSize: 16,
              color: "#222",
              marginBottom: 11,
              backgroundColor: "#fafbfc"
            },

            pickerBox: {
              borderWidth: 1,
              borderColor: "#d4d8de",
              borderRadius: 12,
              marginBottom: 12,
              overflow: "hidden"
            },

            pickerLabel: {
              fontSize: 12,
              color: "#666",
              paddingLeft: 14,
              paddingTop: 8
            },

            picker: {
              height: 50
            },

            attachButton: {
              backgroundColor: "#e9f2ff",
              borderWidth: 1,
              borderColor: "#b9d5f7",
              paddingVertical: 14,
              borderRadius: 12,
              alignItems: "center",
              marginBottom: 8
            },

            attachText: {
              color: "#0759a8",
              fontSize: 15,
              fontWeight: "700"
            },

            selectedFile: {
              color: "#16835c",
              fontSize: 13,
              marginBottom: 10
            },

            saveButton: {
              backgroundColor: "#0759a8",
              paddingVertical: 16,
              borderRadius: 12,
              alignItems: "center",
              marginTop: 4
            },

            saveText: {
              color: "#fff",
              fontSize: 16,
              fontWeight: "800"
            },

            passbookCard: {
              backgroundColor: "#fff",
              marginHorizontal: 14,
              marginBottom: 15,
              padding: 16,
              borderRadius: 16,
              flexDirection: "row",
              justifyContent: "space-between",
              alignItems: "center",
              elevation: 2
            },

            passbookTitle: {
              fontSize: 19,
              fontWeight: "800",
              color: "#222"
            },

            passbookSub: {
              color: "#777",
              marginTop: 4
            },

            passbookButton: {
              backgroundColor: "#16835c",
              paddingHorizontal: 20,
              paddingVertical: 11,
              borderRadius: 10
            },

            passbookButtonText: {
              color: "#fff",
              fontWeight: "800"
            },

            sectionHeader: {
              flexDirection: "row",
              justifyContent: "space-between",
              alignItems: "center",
              paddingHorizontal: 18,
              marginBottom: 8
            },

            sectionTitle: {
              fontSize: 22,
              fontWeight: "800",
              color: "#222"
            },

            count: {
              color: "#777",
              fontSize: 14
            },

            entryCard: {
              backgroundColor: "#fff",
              marginHorizontal: 14,
              marginBottom: 9,
              padding: 15,
              borderRadius: 14,
              flexDirection: "row",
              justifyContent: "space-between",
              elevation: 2
            },

            entryLeft: {
              flex: 1,
              paddingRight: 10
            },

            entryRight: {
              alignItems: "flex-end",
              justifyContent: "center"
            },

            entryName: {
              fontSize: 17,
              fontWeight: "800",
              color: "#222"
            },

            entryInvoice: {
              color: "#0759a8",
              fontSize: 13,
              marginTop: 5
            },

            entryDate: {
              color: "#777",
              fontSize: 12,
              marginTop: 3
            },

            entryPayment: {
              color: "#555",
              fontSize: 12,
              marginTop: 3
            },

            attachmentText: {
              color: "#16835c",
              fontSize: 12,
              marginTop: 5
            },

            amount: {
              color: "#b3263e",
              fontSize: 19,
              fontWeight: "800"
            },

            viewText: {
              color: "#0759a8",
              marginTop: 5,
              fontWeight: "700"
            },

            empty: {
              backgroundColor: "#fff",
              marginHorizontal: 14,
              padding: 25,
              borderRadius: 14,
              alignItems: "center"
            },

            emptyText: {
              color: "#777",
              fontSize: 15
            },

            footerSpace: {
              height: 30
            }

          });
          APPJS

          npx expo prebuild --platform android --no-install

      - name: Restore Existing Permanent Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks
          test -s vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Permanent Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          data = p.read_text()

          release_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          if "signingConfigs {" not in data:
              raise SystemExit("signingConfigs block not found")

          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + release_block,
              1
          )

          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(data)
          PY

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release-v28
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
