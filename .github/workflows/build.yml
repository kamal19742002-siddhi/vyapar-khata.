      - name: Prebuild Android
        working-directory: vyapar-khata
        run: |
          npx expo prebuild --platform android --no-install

      - name: Check Android Gradle
        run: |
          test -f vyapar-khata/android/app/build.gradle
          echo "Android app/build.gradle found."

      - name: Patch Expo Modules Core and Config for SDK Compatibility
        working-directory: vyapar-khata
        run: |
          FILE=$(find node_modules/ -path "*/expo/modules/adapters/react/ModuleRegistryAdapter.kt" 2>/dev/null | head -n 1)
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
            echo "Patching $FILE for nullability compatibility..."
            sed -i 's/\.filterIsInstance/?.filterIsInstance/g' "$FILE"
            sed -i 's/\.map {/?.map {/g' "$FILE"
          fi
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Restore SAME Upload Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
