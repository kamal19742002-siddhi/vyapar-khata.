
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # NODE
      # =========================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================================================
      # JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # CREATE EXPO APP
      # =========================================================
      - name: Create Expo App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank@sdk-51 --no-install
          cd vyapar-khata
          npm install
          npx expo install @react-native-async-storage/async-storage

      # =========================================================
      # CONFIGURE APP
      # =========================================================
      - name: Configure App
        working-directory: vyapar-khata
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(
            fs.readFileSync("app.json", "utf8")
          );

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";

          const runNumber = parseInt(
            process.env.RUN_NUMBER || "1",
            10
          );

          app.expo.version = `2.0.${runNumber}`;

          app.expo.android = {
            ...(app.expo.android || {}),
            package: "com.vyapar.khatabook.free",
            versionCode: 2000 + runNumber
          };

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2)
          );

          console.log(
            "Version code:",
            2000 + runNumber
          );
          NODE

      # =========================================================
      # CREATE APP.JS
      # =========================================================
      - name: Create App.js
        working-directory: vyapar-khata
        run: |
          cat > App.js <<'APPJS'
          import React, { useEffect, useState } from "react";

          import {
            SafeAreaView,
            ScrollView,
            View,
            Text,
            TextInput,
            TouchableOpacity,
            StyleSheet,
            Alert,
            StatusBar
          } from "react-native";

          import AsyncStorage from "@react-native-async-storage/async-storage";

          const DATA_KEY = "VYAPAR_KHATA_DATA";
          const MASTER_PIN = "9999";

          export default function App() {

            const [records, setRecords] = useState([]);

            const [name, setName] = useState("");
            const [invoice, setInvoice] = useState("");
            const [original, setOriginal] = useState("");
            const [second, setSecond] = useState("");

            const [master, setMaster] = useState(false);
            const [pin, setPin] = useState("");

            useEffect(() => {
              loadData();
            }, []);

            async function loadData() {
              try {
                const saved =
                  await AsyncStorage.getItem(DATA_KEY);

                if (saved) {
                  setRecords(JSON.parse(saved));
                }
              } catch (error) {
                console.log("Load error:", error);
              }
            }

            async function saveData(list) {
              try {
                setRecords(list);

                await AsyncStorage.setItem(
                  DATA_KEY,
                  JSON.stringify(list)
                );
              } catch (error) {
                Alert.alert(
                  "Storage Error",
                  "Data save nahi ho paya."
                );
              }
            }

            function unlockMaster() {

              if (pin === MASTER_PIN) {

                setMaster(true);
                setPin("");

                Alert.alert(
                  "Master Open",
                  "Master ledger open ho gaya."
                );

              } else {

                Alert.alert(
                  "Access Denied",
                  "Wrong Master PIN"
                );

                setPin("");
              }
            }

            function addInvoice() {

              if (
                !name.trim() ||
                !invoice.trim() ||
                !original.trim()
              ) {

                Alert.alert(
                  "Required",
                  "Customer, Invoice aur Original Amount bharein."
                );

                return;
              }

              const originalAmount =
                Number(original);

              if (
                !Number.isFinite(originalAmount) ||
                originalAmount < 0
              ) {

                Alert.alert(
                  "Invalid Amount",
                  "Please valid amount enter karein."
                );

                return;
              }

              const secondAmount =
                master && second.trim()
                  ? Number(second)
                  : 0;

              if (
                !Number.isFinite(secondAmount) ||
                secondAmount < 0
              ) {

                Alert.alert(
                  "Invalid Amount",
                  "Second Amount valid hona chahiye."
                );

                return;
              }

              const item = {
                id: Date.now(),
                name: name.trim(),
                invoice: invoice.trim(),
                original: originalAmount,
                second: master ? secondAmount : 0,
                createdAt: new Date().toISOString()
              };

              saveData([
                item,
                ...records
              ]);

              setName("");
              setInvoice("");
              setOriginal("");
              setSecond("");

              Alert.alert(
                "Saved",
                "Invoice successfully save ho gaya."
              );
            }

            function deleteInvoice(id) {

              Alert.alert(
                "Delete",
                "Kya ye invoice delete karna hai?",
                [
                  {
                    text: "Cancel",
                    style: "cancel"
                  },
                  {
                    text: "Delete",
                    style: "destructive",
                    onPress: () => {

                      const list =
                        records.filter(
                          item => item.id !== id
                        );

                      saveData(list);
                    }
                  }
                ]
              );
            }

            function formatAmount(amount) {

              return Number(amount || 0)
                .toLocaleString("en-IN");
            }

            const totalOriginal =
              records.reduce(
                (sum, item) =>
                  sum + Number(item.original || 0),
                0
              );

            const totalSecond =
              records.reduce(
                (sum, item) =>
                  sum + Number(item.second || 0),
                0
              );

            const totalDue =
              totalOriginal + totalSecond;

            return (
              <SafeAreaView style={styles.page}>

                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#0759A8"
                />

                <ScrollView
                  keyboardShouldPersistTaps="handled"
                >

                  <View style={styles.header}>

                    <Text style={styles.logo}>
                      Vyapar Khata
                    </Text>

                    <Text style={styles.subtitle}>
                      {master
                        ? "MASTER CONSOLIDATED VIEW"
                        : "OFFICIAL REGULAR VIEW"}
                    </Text>

                  </View>

                  {!master ? (

                    <View style={styles.box}>

                      <Text style={styles.title}>
                        Master Access
                      </Text>

                      <Text style={styles.description}>
                        Private consolidated ledger ke liye
                        Master PIN enter karein.
                      </Text>

                      <TextInput
                        style={styles.input}
                        placeholder="Master PIN"
                        keyboardType="numeric"
                        secureTextEntry
                        value={pin}
                        onChangeText={setPin}
                        maxLength={8}
                      />

                      <TouchableOpacity
                        style={styles.masterButton}
                        onPress={unlockMaster}
                      >

                        <Text style={styles.buttonText}>
                          OPEN MASTER
                        </Text>

                      </TouchableOpacity>

                    </View>

                  ) : (

                    <View style={styles.box}>

                      <TouchableOpacity
                        style={styles.closeButton}
                        onPress={() => setMaster(false)}
                      >

                        <Text style={styles.closeText}>
                          CLOSE MASTER MODE
                        </Text>

                      </TouchableOpacity>

                    </View>
                  )}

                  <View style={styles.dashboard}>

                    <View style={styles.statCard}>

                      <Text style={styles.statLabel}>
                        INVOICES
                      </Text>

                      <Text style={styles.statValue}>
                        {records.length}
                      </Text>

                    </View>

                    <View style={styles.statCard}>

                      <Text style={styles.statLabel}>
                        ORIGINAL
                      </Text>

                      <Text style={styles.statValue}>
                        ₹ {formatAmount(totalOriginal)}
                      </Text>

                    </View>

                    {master && (

                      <View style={styles.statCard}>

                        <Text style={styles.statLabel}>
                          TOTAL DUE
                        </Text>

                        <Text style={styles.statValue}>
                          ₹ {formatAmount(totalDue)}
                        </Text>

                      </View>

                    )}

                  </View>

                  <View style={styles.box}>

                    <Text style={styles.title}>
                      New Invoice
                    </Text>

                    <TextInput
                      style={styles.input}
                      placeholder="Customer Name"
                      value={name}
                      onChangeText={setName}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Invoice Number"
                      value={invoice}
                      onChangeText={setInvoice}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Original Invoice Amount"
                      keyboardType="numeric"
                      value={original}
                      onChangeText={setOriginal}
                    />

                    {master && (

                      <TextInput
                        style={styles.secretInput}
                        placeholder="
