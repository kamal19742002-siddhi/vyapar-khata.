name: Build Vyapar Khata AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EAS CLI Globally
        run: npm install -g eas-cli

      - name: Setup package.json and dependencies
        run: |
          node -e '
          const fs = require("fs");
          let pkg = {};
          if (fs.existsSync("package.json")) {
            pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          }
          pkg.dependencies = pkg.dependencies || {};
          pkg.dependencies["expo"] = pkg.dependencies["expo"] || "~51.0.0";
          pkg.dependencies["react"] = pkg.dependencies["react"] || "18.2.0";
          pkg.dependencies["react-native"] = pkg.dependencies["react-native"] || "0.74.5";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          console.log("package.json verified!");
          '

      - name: Ensure Android SplashScreen Color Resource Exists
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          
          // Configure app.json with explicit background color for splash
          if (fs.existsSync("app.json")) {
            const data = JSON.parse(fs.readFileSync("app.json", "utf8"));
            if (!data.expo) data.expo = {};
            data.expo.splash = {
              backgroundColor: "#ffffff",
              resizeMode: "contain"
            };
            delete data.expo.icon;
            if (data.expo.android) {
              delete data.expo.android.adaptiveIcon;
            }
            fs.writeFileSync("app.json", JSON.stringify(data, null, 2));
            console.log("Configured splash backgroundColor in app.json");
          }
          '

      - name: Ensure Entry File Exists
        run: |
          node -e '
          const fs = require("fs");
          if (!fs.existsSync("App.js") && !fs.existsSync("index.js") && !fs.existsSync("App.tsx")) {
            fs.writeFileSync("App.js", "import React from \"react\"; import { Text, View } from \"react-native\"; export default function App() { return (<View><Text>Vyapar Khata</Text></View>); }");
            console.log("Created fallback App.js");
          }
          '

      - name: Create / Update eas.json with Java 17 Support
        run: |
          node -e '
          const fs = require("fs");
          const easConfig = {
            cli: { version: ">= 12.0.0" },
            build: {
              production: {
                android: {
                  buildType: "app-bundle",
                  image: "latest"
                },
                node: "20.18.0"
              }
            }
          };
          fs.writeFileSync("eas.json", JSON.stringify(easConfig, null, 2));
          console.log("eas.json created with image: latest!");
          '

      - name: Set versionCode
        shell: bash
        run: |
          if [ -z "$GITHUB_RUN_NUMBER" ]; then
            echo "ERROR: GITHUB_RUN_NUMBER is not set."
            exit 1
          fi

          VERSION_CODE=$((1100 + GITHUB_RUN_NUMBER))

          node -e "const fs=require('fs'); const file='app.json'; const versionCode=$VERSION_CODE; if(!fs.existsSync(file)){console.error('ERROR: app.json not found in ' + process.cwd());process.exit(1);} const data=JSON.parse(fs.readFileSync(file,'utf8')); if(!data.expo)data.expo={}; if(!data.expo.android)data.expo.android={}; data.expo.android.versionCode=versionCode; fs.writeFileSync(file,JSON.stringify(data,null,2)); console.log('SUCCESS: versionCode updated to '+versionCode);"

      - name: Build Android App Bundle (AAB)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_SKIP_LOCKFILE_CHECK: "1"
        run: |
          eas init --id 0d5c6770-6292-474a-b0c0-6a34adc0cf9d --non-interactive
          eas build --platform android --profile production --non-interactive --no-wait
