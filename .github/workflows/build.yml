
name: Build Vyapar Khata AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Prepare package.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          let pkg = {};

          if (fs.existsSync("package.json")) {
            pkg = JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );
          }

          pkg.name = "vyapar-khata";
          pkg.version = "1.0.0";

          pkg.dependencies = pkg.dependencies || {};

          pkg.dependencies.expo = "~51.0.0";
          pkg.dependencies.react = "18.2.0";
          pkg.dependencies["react-native"] = "0.74.5";

          fs.writeFileSync(
            "package.json",
            JSON.stringify(pkg, null, 2) + "\n"
          );

          console.log("package.json prepared.");
          NODE

      - name: Install dependencies
        run: npm install

      - name: Create valid PNG assets
        shell: bash
        run: |
          python3 -m pip install --quiet pillow

          python3 <<'PY'
          from PIL import Image
          from pathlib import Path

          assets = Path("assets")
          assets.mkdir(parents=True, exist_ok=True)

          def create_png(name, size):
              img = Image.new(
                  "RGBA",
                  size,
                  (255, 255, 255, 255)
              )

              img.save(
                  assets / name,
                  format="PNG"
              )

              print(f"Created: {name} {size}")

          create_png("icon.png", (1024, 1024))
          create_png("adaptive-icon.png", (1024, 1024))
          create_png("splash.png", (1284, 2778))
          create_png("favicon.png", (48, 48))
          PY

      - name: Configure app.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "app.json";

          let data = {};

          if (fs.existsSync(file)) {
            data = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          }

          data.expo = data.expo || {};

          data.expo.name = "Vyapar Khata";
          data.expo.slug = "vyapar-khata";
          data.expo.version = "1.0.0";

          data.expo.orientation = "portrait";
          data.expo.userInterfaceStyle = "light";

          data.expo.icon = "./assets/icon.png";

          data.expo.splash = {
            image: "./assets/splash.png",
            resizeMode: "contain",
            backgroundColor: "#ffffff"
          };

          data.expo.android =
            data.expo.android || {};

          data.expo.android.package =
            "com.vyapar.khatabook.free";

          data.expo.android.adaptiveIcon = {
            foregroundImage:
              "./assets/adaptive-icon.png",
            backgroundColor: "#ffffff"
          };

          data.expo.web = {
            favicon: "./assets/favicon.png"
          };

          fs.writeFileSync(
            file,
            JSON.stringify(data, null, 2) + "\n"
          );

          console.log(
            "Package:",
            data.expo.android.package
          );
          NODE

      - name: Verify Android package
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("app.json", "utf8")
          );

          const pkg =
            data.expo.android.package;

          if (
            pkg !==
            "com.vyapar.khatabook.free"
          ) {
            console.error(
              "Wrong Android package:",
              pkg
            );

            process.exit(1);
          }

          console.log(
            "Correct package:",
            pkg
          );
          NODE

      - name: Set unique versionCode
        shell: bash
        run: |
          VERSION_CODE=$((1100 + GITHUB_RUN_NUMBER))

          echo "VERSION_CODE=$VERSION_CODE"

          node <<NODE
          const fs = require("fs");

          const file = "app.json";
          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          data.expo.android.versionCode =
            $VERSION_CODE;

          fs.writeFileSync(
            file,
            JSON.stringify(data, null, 2) + "\n"
          );

          console.log(
            "versionCode:",
            $VERSION_CODE
          );
          NODE

      - name: Create eas.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const eas = {
            cli: {
              version: ">= 12.0.0"
            },
            build: {
              production: {
                credentialsSource: "remote",
                android: {
                  buildType: "app-bundle"
                },
                node: "20.18.0"
              }
            }
          };

          fs.writeFileSync(
            "eas.json",
            JSON.stringify(eas, null, 2) + "\n"
          );

          console.log("eas.json created.");
          NODE

      - name: Check final configuration
        shell: bash
        run: |
          echo "========== FINAL CONFIGURATION =========="

          node <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(
            fs.readFileSync("app.json", "utf8")
          );

          console.log("App name:");
          console.log(app.expo.name);

          console.log("Package:");
          console.log(app.expo.android.package);

          console.log("Version:");
          console.log(app.expo.version);

          console.log("Version code:");
          console.log(app.expo.android.versionCode);
          NODE

          echo ""
          echo "========== EAS CONFIGURATION =========="

          cat eas.json

      - name: Build Android App Bundle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_SKIP_LOCKFILE_CHECK: "1"

        run: |
          eas init \
            --id 0d5c6770-6292-474a-b0c0-6a34adc0cf9d \
            --non-interactive

          eas build \
            --platform android \
            --profile production \
            --non-interactive

      - name: Save build information
        if: always()
        run: |
          echo "======================================"
          echo "EAS ANDROID AAB BUILD FINISHED"
          echo "======================================"
          echo "Open the EAS build URL shown above."
          echo "The completed Android App Bundle (.aab)"
          echo "will be available from the EAS build."
