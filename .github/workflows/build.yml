name: Build Vyapar Khata AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EAS CLI Globally
        run: npm install -g eas-cli

      - name: Setup Basic Config and Clean Assets
        run: |
          node -e '
          const fs = require("fs");
          
          // Clean app.json to let Expo handle prebuild cleanly
          if (fs.existsSync("app.json")) {
            const data = JSON.parse(fs.readFileSync("app.json", "utf8"));
            if (data.expo) {
              delete data.expo.icon;
              delete data.expo.splash;
              if (data.expo.android) {
                delete data.expo.android.adaptiveIcon;
              }
            }
            fs.writeFileSync("app.json", JSON.stringify(data, null, 2));
            console.log("Cleaned asset paths from app.json");
          }

          // Setup eas.json with Java 17 / latest runner
          const easConfig = {
            cli: { version: ">= 12.0.0" },
            build: {
              production: {
                android: {
                  buildType: "app-bundle",
                  image: "latest"
                }
              }
            }
          };
          fs.writeFileSync("eas.json", JSON.stringify(easConfig, null, 2));
          console.log("eas.json ready");
          '

      - name: Set versionCode
        shell: bash
        run: |
          VERSION_CODE=$((1100 + GITHUB_RUN_NUMBER))
          node -e "const fs=require('fs'); const file='app.json'; const data=JSON.parse(fs.readFileSync(file,'utf8')); if(!data.expo)data.expo={}; if(!data.expo.android)data.expo.android={}; data.expo.android.versionCode=$VERSION_CODE; fs.writeFileSync(file,JSON.stringify(data,null,2));"

      - name: Build Android App Bundle (AAB)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_SKIP_LOCKFILE_CHECK: "1"
        run: |
          eas init --id 0d5c6770-6292-474a-b0c0-6a34adc0cf9d --non-interactive
          eas build --platform android --profile production --non-interactive --no-wait
