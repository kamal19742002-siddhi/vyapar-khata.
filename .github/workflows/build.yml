
name: Build Vyapar Khata AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup package.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          let pkg = {};

          if (fs.existsSync("package.json")) {
            pkg = JSON.parse(
              fs.readFileSync("package.json", "utf8")
            );
          }

          pkg.name = pkg.name || "vyapar-khata";
          pkg.version = pkg.version || "1.0.0";

          pkg.dependencies = pkg.dependencies || {};

          pkg.dependencies.expo = "~51.0.0";
          pkg.dependencies.react = "18.2.0";
          pkg.dependencies["react-native"] = "0.74.5";

          fs.writeFileSync(
            "package.json",
            JSON.stringify(pkg, null, 2) + "\n"
          );

          console.log("package.json prepared successfully.");
          NODE

      - name: Create proper PNG assets
        shell: bash
        run: |
          python3 -m pip install --quiet pillow

          python3 <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          assets = Path("assets")
          assets.mkdir(parents=True, exist_ok=True)

          def create_png(filename, size):
              img = Image.new(
                  "RGBA",
                  size,
                  (255, 255, 255, 255)
              )

              draw = ImageDraw.Draw(img)

              w, h = size
              margin = max(1, min(w, h) // 8)

              draw.rectangle(
                  [margin, margin, w - margin, h - margin],
                  fill=(255, 255, 255, 255)
              )

              img.save(
                  assets / filename,
                  format="PNG",
                  optimize=False
              )

              print(
                  f"Created: {assets / filename} -> {size}"
              )

          create_png("icon.png", (1024, 1024))
          create_png("adaptive-icon.png", (1024, 1024))
          create_png("splash.png", (1284, 2778))
          create_png("favicon.png", (48, 48))
          PY

      - name: Verify PNG files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          files = [
              "assets/icon.png",
              "assets/adaptive-icon.png",
              "assets/splash.png",
              "assets/favicon.png"
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  raise SystemExit(
                      f"ERROR: Missing {filename}"
                  )

              with Image.open(path) as img:
                  img.verify()

              with Image.open(path) as img:
                  print(
                      f"VALID PNG: {filename} "
                      f"{img.size} {img.mode}"
                  )
          PY

      - name: Configure app.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "app.json";
          let data = {};

          if (fs.existsSync(file)) {
            data = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          }

          data.expo = data.expo || {};

          data.expo.name =
            data.expo.name || "Vyapar Khata";

          data.expo.slug =
            data.expo.slug || "vyapar-khata";

          data.expo.icon = "./assets/icon.png";

          data.expo.splash = {
            image: "./assets/splash.png",
            resizeMode: "contain",
            backgroundColor: "#ffffff"
          };

          data.expo.android =
            data.expo.android || {};

          data.expo.android.adaptiveIcon = {
            foregroundImage:
              "./assets/adaptive-icon.png",
            backgroundColor: "#ffffff"
          };

          fs.writeFileSync(
            file,
            JSON.stringify(data, null, 2) + "\n"
          );

          console.log(
            "app.json configured successfully."
          );
          NODE

      - name: Check project files
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "PNG files:"
          find . -type f \
            \( -iname "*.png" -o -iname "*.PNG" \) \
            -print

      - name: Ensure App.js exists
        shell: bash
        run: |
          if [ ! -f "App.js" ] && \
             [ ! -f "App.tsx" ] && \
             [ ! -f "index.js" ]; then

            cat > App.js <<'EOF'
          import React from "react";
          import {
            View,
            Text
          } from "react-native";

          export default function App() {
            return (
              <View
                style={{
                  flex: 1,
                  alignItems: "center",
                  justifyContent: "center"
                }}
              >
                <Text>
                  Vyapar Khata
                </Text>
              </View>
            );
          }
          EOF

            echo "Fallback App.js created."

          else
            echo "Existing entry file found."
          fi

      - name: Create eas.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const config = {
            cli: {
              version: ">= 12.0.0"
            },
            build: {
              production: {
                android: {
                  buildType: "app-bundle"
                },
                node: "20.18.0"
              }
            }
          };

          fs.writeFileSync(
            "eas.json",
            JSON.stringify(config, null, 2) + "\n"
          );

          console.log("eas.json created.");
          NODE

      - name: Set versionCode
        shell: bash
        run: |
          if [ -z "$GITHUB_RUN_NUMBER" ]; then
            echo "ERROR: GITHUB_RUN_NUMBER is not set."
            exit 1
          fi

          VERSION_CODE=$((1100 + GITHUB_RUN_NUMBER))

          echo "Using versionCode: $VERSION_CODE"

          node <<NODE
          const fs = require("fs");

          const file = "app.json";
          const versionCode = $VERSION_CODE;

          if (!fs.existsSync(file)) {
            console.error(
              "ERROR: app.json not found."
            );
            process.exit(1);
          }

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          data.expo = data.expo || {};
          data.expo.android =
            data.expo.android || {};

          data.expo.android.versionCode =
            versionCode;

          fs.writeFileSync(
            file,
            JSON.stringify(data, null, 2) + "\n"
          );

          console.log(
            "SUCCESS: versionCode = " +
            versionCode
          );
          NODE

      - name: Final configuration check
        shell: bash
        run: |
          echo "========== app.json =========="
          cat app.json

          echo ""
          echo "========== eas.json =========="
          cat eas.json

          echo ""
          echo "========== PNG validation =========="

          python3 <<'PY'
          from PIL import Image
          from pathlib import Path

          for path in Path("assets").glob("*.png"):

              with Image.open(path) as img:
                  img.verify()

              with Image.open(path) as img:
                  print(
                      f"OK: {path} -> {img.size}"
                  )
          PY

      - name: Build Android App Bundle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_SKIP_LOCKFILE_CHECK: "1"

        run: |
          eas init \
            --id 0d5c6770-6292-474a-b0c0-6a34adc0cf9d \
            --non-interactive

          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait
