name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Locate project
        id: locate
        shell: bash
        run: |
          PKG_PATH=$(find . -type f -name "package.json" \
            -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PKG_PATH")

          echo "Found package.json: $PKG_PATH"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found"
            npm ci
          else
            echo "No package-lock.json found"
            echo "Using npm install"
            npm install
          fi

      - name: Expo prebuild
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          npx expo prebuild --platform android --no-install

      - name: Configure Android API 36
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")

          if not path.exists():
              raise SystemExit("ERROR: android/app/build.gradle not found")

          text = path.read_text()

          # compileSdk
          text = re.sub(
              r'compileSdk(?:Version)?\s*=?\s*\d+',
              'compileSdk 36',
              text
          )

          # targetSdk
          text = re.sub(
              r'targetSdk(?:Version)?\s*=?\s*\d+',
              'targetSdk 36',
              text
          )

          # versionCode
          if re.search(r'versionCode\s*=?\s*\d+', text):
              text = re.sub(
                  r'versionCode\s*=?\s*\d+',
                  'versionCode 2001',
                  text
              )
          else:
              text = text.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        versionCode 2001',
                  1
              )

          path.write_text(text)

          print("compileSdk = 36")
          print("targetSdk = 36")
          print("versionCode = 2001")
          PY

          echo "=== Android configuration ==="
          grep -nE "compileSdk|targetSdk|versionCode" app/build.gradle || true

      - name: Restore upload keystore
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created"
            exit 1
          fi

          echo "Keystore restored successfully"

      - name: Configure release signing
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")

          if not path.exists():
              raise SystemExit("ERROR: app/build.gradle not found")

          text = path.read_text()

          if "upload-keystore.jks" not in text:
              signing_block = """
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              """

              text = text.replace(
                  "android {",
                  "android {\n" + signing_block,
                  1
              )

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "buildTypes {",
                  """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }""",
                  1
              )

          path.write_text(text)

          print("Release signing configured")
          PY

      - name: Verify configuration
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          echo "=== Final Android configuration ==="
          grep -nE "compileSdk|targetSdk|versionCode|signingConfig" \
            app/build.gradle || true

      - name: Build release AAB
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew clean

          ./gradlew bundleRelease --no-daemon

      - name: Find AAB
        shell: bash
        run: |
          AAB=$(find . -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated"
            exit 1
          fi

          echo "AAB FOUND: $AAB"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 7
