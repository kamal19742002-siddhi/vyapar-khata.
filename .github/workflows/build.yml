```yaml
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Set version code
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")

          if not path.exists():
              raise SystemExit("app/build.gradle not found")

          text = path.read_text()

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode 2001",
              text
          )

          text = re.sub(
              r"targetSdkVersion\s+\d+",
              "targetSdkVersion 36",
              text
          )

          text = re.sub(
              r"compileSdkVersion\s+\d+",
              "compileSdkVersion 36",
              text
          )

          path.write_text(text)

          print("versionCode = 2001")
          print("targetSdkVersion = 36")
          print("compileSdkVersion = 36")
          PY

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "Keystore file was not created."
            exit 1
          fi

          echo "Upload keystore restored."

      - name: Configure signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          if "upload-keystore.jks" not in text:
              text = text.replace(
                  "signingConfigs {",
                  """signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }""",
                  1
              )

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          path.write_text(text)
          print("Release signing configured.")
          PY

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Find AAB
        run: |
          echo "Searching for AAB..."

          find android -type f -name "*.aab" -print

          AAB=$(find android -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "AAB NOT FOUND"
            exit 1
          fi

          echo "AAB FOUND:"
          echo "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
```
