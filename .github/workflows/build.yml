
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check project
        shell: bash
        run: |
          test -f package.json || {
            echo "ERROR: package.json missing"
            exit 1
          }

          test -f App.js || {
            echo "ERROR: App.js missing"
            exit 1
          }

          echo "Project files OK"

      - name: Install dependencies
        shell: bash
        run: |
          npm install --legacy-peer-deps

          npm install \
            expo@51.0.39 \
            react@18.2.0 \
            react-native@0.74.5 \
            @react-native-async-storage/async-storage \
            --legacy-peer-deps

          npm install \
            --save-dev babel-preset-expo@11.0.10 \
            --legacy-peer-deps

      - name: Configure Babel
        shell: bash
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF

      - name: Configure entry
        shell: bash
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";

          registerRootComponent(App);
          EOF

      - name: Create Expo assets
        shell: bash
        run: |
          mkdir -p assets

          python3 <<'PY'
          import struct
          import zlib
          from pathlib import Path

          def make_png(path, width, height):
              raw = b""
              row = b"\xff\xff\xff" * width

              for _ in range(height):
                  raw += b"\x00" + row

              def chunk(name, data):
                  return (
                      struct.pack(">I", len(data))
                      + name
                      + data
                      + struct.pack(
                          ">I",
                          zlib.crc32(name + data) & 0xffffffff
                      )
                  )

              png = b"\x89PNG\r\n\x1a\n"

              png += chunk(
                  b"IHDR",
                  struct.pack(
                      ">IIBBBBB",
                      width,
                      height,
                      8,
                      2,
                      0,
                      0,
                      0
                  )
              )

              png += chunk(
                  b"IDAT",
                  zlib.compress(raw, 9)
              )

              png += chunk(b"IEND", b"")

              Path(path).write_bytes(png)

          make_png("assets/icon.png", 1024, 1024)
          make_png("assets/adaptive-icon.png", 1024, 1024)
          make_png("assets/splash.png", 1284, 2778)
          make_png("assets/favicon.png", 48, 48)

          print("All Expo PNG assets created.")
          PY

          echo "===== ASSETS ====="
          ls -lh assets/

      - name: Configure Expo
        env:
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const run = Number(
            process.env.RUN_NUMBER || "1"
          );

          let app = {};

          if (fs.existsSync("app.json")) {
            app = JSON.parse(
              fs.readFileSync("app.json", "utf8")
            );
          }

          app.expo = app.expo || {};

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = `2.0.${run}`;
          app.expo.orientation = "portrait";

          app.expo.icon = "./assets/icon.png";

          app.expo.splash = {
            image: "./assets/splash.png",
            resizeMode: "contain",
            backgroundColor: "#ffffff"
          };

          app.expo.android =
            app.expo.android || {};

          app.expo.android.package =
            "com.vyapar.khatabook.free";

          app.expo.android.versionCode =
            2000 + run;

          app.expo.android.minSdkVersion = 24;

          app.expo.android.adaptiveIcon = {
            foregroundImage:
              "./assets/adaptive-icon.png",
            backgroundColor: "#ffffff"
          };

          app.expo.web = {
            ...(app.expo.web || {}),
            favicon: "./assets/favicon.png"
          };

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2) + "\n"
          );

          console.log(
            "Package:",
            app.expo.android.package
          );

          console.log(
            "Version:",
            app.expo.version
          );

          console.log(
            "VersionCode:",
            app.expo.android.versionCode
          );

          console.log(
            "MinSdkVersion:",
            app.expo.android.minSdkVersion
          );
          NODE

      - name: Verify Expo configuration
        shell: bash
        run: |
          npx expo config --type public

          echo "Checking assets..."

          test -f assets/icon.png
          test -f assets/adaptive-icon.png
          test -f assets/splash.png
          test -f assets/favicon.png

          echo "All assets exist."

      - name: Check App.js syntax
        shell: bash
        run: |
          node --check App.js

          echo "App.js syntax OK."

      - name: Generate Android project
        shell: bash
        run: |
          rm -rf android

          npx expo prebuild \
            --platform android \
            --clean \
            --no-install

      - name: Force Android SDK versions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          text = p.read_text()

          # Force min SDK 24
          text = re.sub(
              r'minSdkVersion\s*=?\s*\d+',
              'minSdkVersion 24',
              text
          )

          text = re.sub(
              r'minSdk\s*=?\s*\d+',
              'minSdk 24',
              text
          )

          # Force compile SDK 36
          text = re.sub(
              r'compileSdkVersion\s*=?\s*\d+',
              'compileSdkVersion 36',
              text
          )

          text = re.sub(
              r'compileSdk\s*=?\s*\d+',
              'compileSdk 36',
              text
          )

          # Force target SDK 36
          text = re.sub(
              r'targetSdkVersion\s*=?\s*\d+',
              'targetSdkVersion 36',
              text
          )

          text = re.sub(
              r'targetSdk\s*=?\s*\d+',
              'targetSdk 36',
              text
          )

          p.write_text(text)

          # Also configure gradle properties
          gp = Path("android/gradle.properties")

          existing = ""
          if gp.exists():
              existing = gp.read_text()

          lines = [
              line for line in existing.splitlines()
              if not line.startswith("android.minSdkVersion=")
              and not line.startswith(
                  "android.suppressUnsupportedCompileSdk="
              )
          ]

          lines.append("android.minSdkVersion=24")
          lines.append(
              "android.suppressUnsupportedCompileSdk=36"
          )

          if not any(
              line.startswith("org.gradle.jvmargs=")
              for line in lines
          ):
              lines.append(
                  "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"
              )

          gp.write_text("\n".join(lines) + "\n")

          print("Android SDK configuration updated.")
          print("minSdk = 24")
          print("compileSdk = 36")
          print("targetSdk = 36")
          PY

          echo "===== GENERATED GRADLE SDK SETTINGS ====="

          grep -RniE \
            "minSdkVersion|minSdk|compileSdkVersion|compileSdk|targetSdkVersion|targetSdk" \
            android/app \
            android/gradle.properties || true

          echo "===== CHECKING FOR MIN SDK 23 ====="

          if grep -RniE \
            "minSdkVersion[[:space:]]+23|minSdk[[:space:]]+23" \
            android/app \
            android/gradle.properties; then

            echo "ERROR: minSdk 23 is still present."
            exit 1
          fi

          echo "SUCCESS: minSdk 23 not found."

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret missing"
            exit 1
          }

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode >
            android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks || {
            echo "ERROR: Keystore is empty"
            exit 1
          }

          echo "Keystore restored successfully."

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD missing"
            exit 1
          }

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          signing_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          if "storeFile file('upload-keystore.jks')" not in text:
              marker = "signingConfigs {"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: signingConfigs block not found"
                  )

              text = text.replace(
                  marker,
                  marker + signing_block,
                  1
              )

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(text)

          print("Release signing configured.")
          PY

      - name: Verify signing certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Build Android AAB
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          cd android

          chmod +x gradlew

          ./gradlew \
            clean \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Find AAB
        shell: bash
        run: |
          echo "===== GENERATED AAB ====="

          find android \
            -type f \
            -name "*.aab" \
            -print

          AAB=$(find android \
            -type f \
            -name "*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not generated."
            exit 1
          fi

          echo "AAB FOUND:"
          echo "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Build complete
        shell: bash
        run: |
          echo "================================"
          echo "VYAPAR KHATA AAB BUILD COMPLETE"
          echo "================================"
          echo "AAB artifact is ready."
          echo "Go to Actions -> this run -> Artifacts"
