              fontWeight: "bold",
              marginTop: 5
            },

            empty: {
              textAlign: "center",
              color: "#888888"
            }
          });
          APPJS

      - name: Prebuild Android
        working-directory: vyapar-khata
        run: |
          npx expo prebuild --platform android --no-install

      - name: Check Android Gradle
        run: |
          test -f vyapar-khata/android/app/build.gradle
          echo "Android app/build.gradle found."

      - name: Restore SAME Upload Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > vyapar-khata/android/app/upload-keystore.jks

          test -s vyapar-khata/android/app/upload-keystore.jks

          echo "Existing upload keystore restored."

      - name: Configure Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          data = p.read_text()

          if "signingConfigs {" not in data:
              raise SystemExit("signingConfigs block not found")

          block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + block,
              1
          )

          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(data)
          PY

      - name: Build Release AAB
        working-directory: vyapar-khata/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab                          </Text>
                            </TouchableOpacity>

                          </View>

