
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Expo App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank@sdk-51 --no-install
          cd vyapar-khata
          npm install
          npx expo install @react-native-async-storage/async-storage

      - name: Configure App
        working-directory: vyapar-khata
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const runNumber = parseInt(process.env.RUN_NUMBER || "1", 10);

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = `2.0.${runNumber}`;

          app.expo.android = {
            ...(app.expo.android || {}),
            package: "com.vyapar.khatabook.free",
            versionCode: 2000 + runNumber
          };

          fs.writeFileSync(
            "app.json",
            JSON.stringify(app, null, 2)
          );

          console.log("VERSION CODE =", 2000 + runNumber);
          NODE

      - name: Create App.js
        working-directory: vyapar-khata
        run: |
          cat > App.js <<'APPJS'
          import React, { useEffect, useState } from "react";
          import {
            SafeAreaView,
            ScrollView,
            View,
            Text,
            TextInput,
            TouchableOpacity,
            StyleSheet,
            Alert,
            StatusBar
          } from "react-native";
          import AsyncStorage from "@react-native-async-storage/async-storage";

          const DATA_KEY = "VYAPAR_KHATA_DATA";
          const MASTER_PIN = "9999";

          export default function App() {
            const [records, setRecords] = useState([]);
            const [name, setName] = useState("");
            const [invoice, setInvoice] = useState("");
            const [original, setOriginal] = useState("");
            const [second, setSecond] = useState("");
            const [master, setMaster] = useState(false);
            const [pin, setPin] = useState("");

            useEffect(() => {
              loadData();
            }, []);

            async function loadData() {
              try {
                const saved = await AsyncStorage.getItem(DATA_KEY);

                if (saved) {
                  setRecords(JSON.parse(saved));
                }
              } catch (error) {
                console.log("Load error:", error);
              }
            }

            async function saveData(list) {
              try {
                setRecords(list);
                await AsyncStorage.setItem(
                  DATA_KEY,
                  JSON.stringify(list)
                );
              } catch (error) {
                Alert.alert(
                  "Storage Error",
                  "Data save nahi ho paya."
                );
              }
            }

            function unlockMaster() {
              if (pin === MASTER_PIN) {
                setMaster(true);
                setPin("");
              } else {
                Alert.alert(
                  "Access Denied",
                  "Wrong Master PIN"
                );
                setPin("");
              }
            }

            function addInvoice() {
              if (
                !name.trim() ||
                !invoice.trim() ||
                !original.trim()
              ) {
                Alert.alert(
                  "Required",
                  "Customer, Invoice aur Amount bharein."
                );
                return;
              }

              const amount1 = Number(original);
              const amount2 =
                master && second.trim()
                  ? Number(second)
                  : 0;

              if (
                !Number.isFinite(amount1) ||
                amount1 < 0 ||
                !Number.isFinite(amount2) ||
                amount2 < 0
              ) {
                Alert.alert(
                  "Invalid Amount",
                  "Valid amount enter karein."
                );
                return;
              }

              const item = {
                id: Date.now(),
                name: name.trim(),
                invoice: invoice.trim(),
                original: amount1,
                second: master ? amount2 : 0
              };

              saveData([item, ...records]);

              setName("");
              setInvoice("");
              setOriginal("");
              setSecond("");
            }

            function deleteInvoice(id) {
              Alert.alert(
                "Delete",
                "Invoice delete karein?",
                [
                  {
                    text: "Cancel",
                    style: "cancel"
                  },
                  {
                    text: "Delete",
                    style: "destructive",
                    onPress: () => {
                      saveData(
                        records.filter(
                          item => item.id !== id
                        )
                      );
                    }
                  }
                ]
              );
            }

            const money = value =>
              Number(value || 0).toLocaleString("en-IN");

            const totalOriginal =
              records.reduce(
                (sum, item) =>
                  sum + Number(item.original || 0),
                0
              );

            const totalSecond =
              records.reduce(
                (sum, item) =>
                  sum + Number(item.second || 0),
                0
              );

            return (
              <SafeAreaView style={styles.page}>
                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#0759A8"
                />

                <ScrollView
                  keyboardShouldPersistTaps="handled"
                >
                  <View style={styles.header}>
                    <Text style={styles.logo}>
                      Vyapar Khata
                    </Text>

                    <Text style={styles.subtitle}>
                      {master
                        ? "MASTER MODE"
                        : "REGULAR MODE"}
                    </Text>
                  </View>

                  {!master ? (
                    <View style={styles.box}>
                      <Text style={styles.title}>
                        Master Access
                      </Text>

                      <TextInput
                        style={styles.input}
                        placeholder="Master PIN"
                        keyboardType="numeric"
                        secureTextEntry
                        value={pin}
                        onChangeText={setPin}
                      />

                      <TouchableOpacity
                        style={styles.purple}
                        onPress={unlockMaster}
                      >
                        <Text style={styles.buttonText}>
                          OPEN MASTER
                        </Text>
                      </TouchableOpacity>
                    </View>
                  ) : (
                    <View style={styles.box}>
                      <TouchableOpacity
                        style={styles.close}
                        onPress={() =>
                          setMaster(false)
                        }
                      >
                        <Text style={styles.closeText}>
                          CLOSE MASTER MODE
                        </Text>
                      </TouchableOpacity>
                    </View>
                  )}

                  <View style={styles.stats}>
                    <View style={styles.stat}>
                      <Text style={styles.label}>
                        INVOICES
                      </Text>
                      <Text style={styles.value}>
                        {records.length}
                      </Text>
                    </View>

                    <View style={styles.stat}>
                      <Text style={styles.label}>
                        ORIGINAL
                      </Text>
                      <Text style={styles.value}>
                        ₹ {money(totalOriginal)}
                      </Text>
                    </View>

                    {master && (
                      <View style={styles.stat}>
                        <Text style={styles.label}>
                          TOTAL DUE
                        </Text>

                        <Text style={styles.value}>
                          ₹{" "}
                          {money(
                            totalOriginal +
                              totalSecond
                          )}
                        </Text>
                      </View>
                    )}
                  </View>

                  <View style={styles.box}>
                    <Text style={styles.title}>
                      New Invoice
                    </Text>

                    <TextInput
                      style={styles.input}
                      placeholder="Customer Name"
                      value={name}
                      onChangeText={setName}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Invoice Number"
                      value={invoice}
                      onChangeText={setInvoice}
                    />

                    <TextInput
                      style={styles.input}
                      placeholder="Original Invoice Amount"
                      keyboardType="numeric"
                      value={original}
                      onChangeText={setOriginal}
                    />

                    {master && (
                      <TextInput
                        style={styles.secret}
                        placeholder="Second Amount"
                        keyboardType="numeric"
                        value={second}
                        onChangeText={setSecond}
                      />
                    )}

                    <TouchableOpacity
                      style={styles.blue}
                      onPress={addInvoice}
                    >
                      <Text style={styles.buttonText}>
                        SAVE INVOICE
                      </Text>
                    </TouchableOpacity>
                  </View>

                  <Text style={styles.listTitle}>
                    Invoice Records ({records.length})
                  </Text>

                  {records.length === 0 ? (
                    <View style={styles.box}>
                      <Text style={styles.empty}>
                        No invoices yet.
                      </Text>
                    </View>
                  ) : (
                    records.map(item => (
                      <View
                        key={item.id}
                        style={styles.card}
                      >
                        <View style={styles.row}>
                          <Text style={styles.name}>
                            {item.name}
                          </Text>

                          <TouchableOpacity
                            onPress={() =>
                              deleteInvoice(item.id)
                            }
                          >
                            <Text
                              style={styles.delete}
                            >
                              DELETE
                            </Text>
                          </TouchableOpacity>
                        </View>

                        <Text style={styles.gray}>
                          Invoice: {item.invoice}
                        </Text>

                        <Text style={styles.green}>
                          Original: ₹{" "}
                          {money(item.original)}
                        </Text>

                        {!master ? (
                          <Text style={styles.red}>
                            Original Due: ₹{" "}
                            {money(item.original)}
                          </Text>
                        ) : (
                          <View
                            style={styles.masterBox}
                          >
                            <Text
                              style={
                                styles.purpleText
                              }
                            >
                              Second: ₹{" "}
                              {money(item.second)}
                            </Text>

                            <Text
                              style={styles.red}
                            >
                              TOTAL DUE: ₹{" "}
                              {money(
                                Number(
                                  item.original
                                ) +
                                  Number(
                                    item.second
                                  )
                              )}
                            </Text>
                          </View>
                        )}
                      </View>
                    ))
                  )}

                  <View style={{ height: 60 }} />
                </ScrollView>
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            page: {
              flex: 1,
              backgroundColor: "#F3F6FA"
            },

            header: {
              backgroundColor: "#0759A8",
              padding: 20
            },

            logo: {
              color: "#fff",
              fontSize: 25,
              fontWeight: "bold"
            },

            subtitle: {
              color: "#DCEEFF",
              marginTop: 5
            },

            box: {
              backgroundColor: "#fff",
              margin: 12,
              padding: 15,
              borderRadius: 10,
              elevation: 2
            },

            title: {
              fontSize: 18,
              fontWeight: "bold",
              marginBottom: 10
            },

            input: {
              borderWidth: 1,
              borderColor: "#ccc",
              borderRadius: 8,
              padding: 12,
              marginBottom: 10
            },

            secret: {
              borderWidth: 1,
              borderColor: "#7B1FA2",
              borderRadius: 8,
              padding: 12,
              marginBottom: 10
            },

            blue: {
              backgroundColor: "#0759A8",
              padding: 14,
              borderRadius: 8,
              alignItems: "center"
            },

            purple: {
              backgroundColor: "#7B1FA2",
              padding: 14,
              borderRadius: 8,
              alignItems: "center"
            },

            buttonText: {
              color: "#fff",
              fontWeight: "bold"
            },

            close: {
              backgroundColor: "#FCE4EC",
              padding: 13,
              borderRadius: 8,
              alignItems: "center"
            },

            closeText: {
              color: "#C2185B",
              fontWeight: "bold"
            },

            stats: {
              flexDirection: "row",
              flexWrap: "wrap",
              marginHorizontal: 8
            },

            stat: {
              backgroundColor: "#fff",
              margin: 4,
              padding: 12,
              borderRadius: 10,
              minWidth: 105,
              flexGrow: 1
            },

            label: {
              color: "#777",
              fontSize: 11,
              fontWeight: "bold"
            },

            value: {
              color: "#0759A8",
              fontSize: 17,
              fontWeight: "bold",
              marginTop: 5
            },

            listTitle: {
              fontSize: 19,
              fontWeight: "bold",
              margin: 14
            },

            card: {
              backgroundColor: "#fff",
              marginHorizontal: 12,
              marginBottom: 10,
              padding: 15,
              borderRadius: 10,
              elevation: 2
            },

            row: {
              flexDirection: "row",
              justifyContent: "space-between"
            },

            name: {
              fontSize: 17,
              fontWeight: "bold",
              flex: 1
            },

            delete: {
              color: "#C62828",
              fontWeight: "bold"
            },

            gray: {
              color: "#666",
              marginTop: 5
            },

            green: {
              color: "#16835C",
              fontSize: 16,
              fontWeight: "bold",
              marginTop: 7
            },

            red: {
              color: "#C62828",
              fontSize: 16,
              fontWeight: "bold",
              marginTop: 5
            },

            masterBox: {
              marginTop: 10,
              padding: 10,
              backgroundColor: "#F3E5F5",
              borderRadius: 8
            },

            purpleText: {
              color: "#7B1FA2",
              fontWeight: "bold"
            },

            empty: {
              textAlign: "center",
              color: "#888"
            }
          });
          APPJS

      - name: Prebuild Android
        working-directory: vyapar-khata
        run: |
          npx expo prebuild --platform android --no-install

      - name: Set API 36
        working-directory: vyapar-khata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle not found"
              )

          text = path.read_text()

          text = re.sub(
              r'targetSdkVersion\s+\d+',
              'targetSdkVersion 36',
              text
          )

          text = re.sub(
              r'compileSdkVersion\s+\d+',
              'compileSdkVersion 36',
              text
          )

          path.write_text(text)
          print("API 36 configured.")
          PY

          echo "android.suppressUnsupportedCompileSdk=36" \
            >> android/gradle.properties

      - name: Restore Upload Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          mkdir -p vyapar-khata/android/app

          echo "$KEYSTORE_BASE64" |
            base64 --decode >
            vyapar-khata/android/app/upload-keystore.jks

          test -s \
            vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Signing
        working-directory: vyapar-khata
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()

          signing = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          if "upload-keystore.jks" not in text:
              text = text.replace(
                  "signingConfigs {",
                  "signingConfigs {" + signing,
                  1
              )

          text = text.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          path.write_text(text)
          PY

      - name: Build AAB
        working-directory: vyapar-khata/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon

      - name: Find AAB
        run: |
          find vyapar-khata/android \
            -type f \
            -name "*.aab" \
            -print

          AAB=$(find \
            vyapar-khata/android \
            -type f \
            -name "*.aab" |
            head -n 1)

          if [ -z "$AAB" ]; then
            echo "AAB NOT FOUND"
            exit 1
          fi

          echo "AAB FOUND: $AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: vyapar-khata/android/**/*.aab
          if-no-files-found: error
          retention-days: 7

