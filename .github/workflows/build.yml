              data
          )

          data = re.sub(
              r'targetSdk\s*=\s*\d+',
              'targetSdk = 36',
              data
          )

          p.write_text(data)

          print("Android target SDK forced to 36.")
          PY

      - name: Configure Gradle
        working-directory: vyapar-khata
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Restore Release Upload Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p vyapar-khata/android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks
          test -s vyapar-khata/android/app/upload-keystore.jks
          echo "Existing upload keystore restored."

      - name: Configure Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          data = p.read_text()

          if "signingConfigs {" not in data:
              raise SystemExit("signingConfigs block not found")

          block = """
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
          """

          if "storeFile file('upload-keystore.jks')" not in data:
              data = data.replace(
                  "signingConfigs {",
                  "signingConfigs {" + block,
                  1
              )

          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(data)
          print("Release signing configured.")
          PY

      - name: Verify Android Configuration
        working-directory: vyapar-khata
        run: |
          echo "===== APP CONFIG ====="
          cat app.json

          echo "===== ANDROID SDK / VERSION ====="
          grep -n -E "compileSdk|targetSdk|versionCode|versionName" android/app/build.gradle || true

          echo "===== GRADLE PROPERTIES ====="
          cat android/gradle.properties

      - name: Build Release AAB
        working-directory: vyapar-khata/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
