      - name: Set versionCode
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -z "$GITHUB_RUN_NUMBER" ]; then
            echo "ERROR: GITHUB_RUN_NUMBER is not set."
            exit 1
          fi

          VERSION_CODE=$((1100 + GITHUB_RUN_NUMBER))

          echo "GITHUB_RUN_NUMBER = $GITHUB_RUN_NUMBER"
          echo "VERSION_CODE = $VERSION_CODE"

          node -e "
            const fs = require('fs');
            const file = 'app.json';
            const versionCode = Number('$VERSION_CODE');

            if (!fs.existsSync(file)) {
              console.error('ERROR: app.json not found');
              process.exit(1);
            }

            const data = JSON.parse(
              fs.readFileSync(file, 'utf8')
            );

            if (!data.expo) data.expo = {};
            if (!data.expo.android) data.expo.android = {};

            data.expo.android.versionCode = versionCode;

            fs.writeFileSync(
              file,
              JSON.stringify(data, null, 2)
            );

            console.log(
              'SUCCESS: app.json versionCode = ' +
              versionCode
            );
          "
