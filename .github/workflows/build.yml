name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version Code
        shell: bash
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using Version Code: $VERSION_CODE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify App Source
        run: |
          if [ ! -f App.js ]; then
            echo "ERROR: App.js is missing."
            exit 1
          fi

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Babel Config
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF

      - name: Create index.js
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";
          registerRootComponent(App);
          EOF

      - name: Create app.json
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE}
              }
            }
          }
          EOF

      - name: Expo Prebuild
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

      - name: Fix Splash Resource
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Set Android Minimum SDK to 24
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          app_gradle = Path("android/app/build.gradle")

          if not app_gradle.exists():
              sys.exit("ERROR: android/app/build.gradle not found")

          text = app_gradle.read_text()

          patterns = [
              (r'(\bminSdkVersion\s*=\s*)\d+', r'\g<1>24'),
              (r'(\bminSdkVersion\s+)\d+\b', r'\g<1>24'),
              (r'(\bminSdk\s*=\s*)\d+', r'\g<1>24'),
              (r'(\bminSdk\s+)\d+\b', r'\g<1>24'),
          ]

          for pattern, replacement in patterns:
              text = re.sub(pattern, replacement, text)

          app_gradle.write_text(text)

          print("Minimum SDK configuration:")
          for line in text.splitlines():
              if "minSdk" in line:
                  print(line.strip())

          if not re.search(
              r'\bminSdkVersion\s*(?:=|\s)\s*24\b'
              r'|\bminSdk\s*(?:=|\s)\s*24\b',
              text
          ):
              sys.exit(
                  "ERROR: Could not verify minSdk 24 in app/build.gradle. "
                  "The project may use a variable-based SDK configuration."
              )

          print("Minimum SDK 24 verified.")
          PY

      - name: Restore Existing Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore could not be restored."
            exit 1
          fi

          echo "Signing keystore restored."

      - name: Configure Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Signing secrets are missing."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("android/app/build.gradle")

          if not path.exists():
              sys.exit("ERROR: android/app/build.gradle not found")

          text = path.read_text()

          # Remove previous injected signing configuration.
          text = re.sub(
              r'(?s)\s*// VYAPAR_SIGNING_START.*?'
              r'// VYAPAR_SIGNING_END\s*',
              '\n',
              text
          )

          # Remove existing references to our custom signing config.
          text = re.sub(
              r'(?m)^\s*signingConfig\s+'
              r'signingConfigs\.vyaparRelease\s*$\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^\s*signingConfig\s+'
              r'signingConfigs\.getByName\(["\']vyaparRelease["\']\)'
              r'\s*$\n?',
              '',
              text
          )

          android_pos = text.find("android {")
          if android_pos < 0:
              sys.exit("ERROR: android block not found")

          build_types_pos = text.find("buildTypes {", android_pos)
          if build_types_pos < 0:
              sys.exit("ERROR: buildTypes block not found")

          signing_block = '''
              // VYAPAR_SIGNING_START
              signingConfigs {
                  vyaparRelease {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              // VYAPAR_SIGNING_END

          '''

          text = (
              text[:build_types_pos]
              + signing_block
              + text[build_types_pos:]
          )

          build_types_pos = text.find("buildTypes {", android_pos)
          release_pos = text.find("release {", build_types_pos)

          if release_pos < 0:
              sys.exit("ERROR: release block not found")

          depth = 0
          release_end = None

          for i in range(release_pos, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      release_end = i
                      break

          if release_end is None:
              sys.exit("ERROR: release block end not found")

          release_content = text[release_pos:release_end]

          if "signingConfig" not in release_content:
              insert_at = release_pos + len("release {")
              text = (
                  text[:insert_at]
                  + "\n            signingConfig signingConfigs.vyaparRelease"
                  + text[insert_at:]
              )

          path.write_text(text)
          print("Release signing configuration added.")
          PY

      - name: Build Production Android App Bundle (AAB)
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB File
        if: success()
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          echo "Searching for generated AAB files..."
          find android -type f -name "*.aab" -print

          if [ ! -s "$AAB" ]; then
            echo "ERROR: Expected AAB file not found: $AAB"
            exit 1
          fi

          ls -lh "$AAB"
          echo "AAB file verified."

      - name: Upload AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vyapar-Khata-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
