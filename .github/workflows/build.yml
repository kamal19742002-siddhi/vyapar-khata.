name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create and Configure App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank@sdk-51 --no-install
          cd vyapar-khata
          npm install
          npx expo install @react-native-async-storage/async-storage babel-preset-expo @expo/metro-config

          cat > metro.config.js <<'METRO'
          const { getDefaultConfig } = require('expo/metro-config');
          const config = getDefaultConfig(__dirname);
          module.exports = config;
          METRO

          cat > babel.config.js <<'BABEL'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ['babel-preset-expo'],
            };
          };
          BABEL

          node - <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.53";
          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 53
          };
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          NODE

          cat > App.js <<'APPJS'
          import React, { useState, useEffect } from "react";
          import {
            View,
            Text,
            TextInput,
            TouchableOpacity,
            ScrollView,
            StyleSheet,
            Alert,
            SafeAreaView,
            StatusBar
          } from "react-native";
          import AsyncStorage from "@react-native-async-storage/async-storage";

          const KEY = "DUAL_LEDGER_DATA";
          const MASTER = "9999";

          export default function App() {
            const [data, setData] = useState([]);
            const [name, setName] = useState("");
            const [invoice, setInvoice] = useState("");
            const [original, setOriginal] = useState("");
            const [second, setSecond] = useState("");
            const [master, setMaster] = useState(false);
            const [mpin, setMpin] = useState("");

            useEffect(() => {
              load();
            }, []);

            async function load() {
              try {
                const x = await AsyncStorage.getItem(KEY);
                if (x) setData(JSON.parse(x));
              } catch (e) {
                console.log(e);
              }
            }

            async function save(list) {
              setData(list);
              await AsyncStorage.setItem(KEY, JSON.stringify(list));
            }

            function add() {
              if (!name.trim() || !invoice.trim() || !original.trim()) {
                Alert.alert("Required", "Customer Name, Invoice aur Original Amount bharein");
                return;
              }

              const item = {
                id: Date.now(),
                name: name.trim(),
                invoice: invoice.trim(),
                original: Number(original),
                second: Number(second || 0)
              };

              save([item, ...data]);
              setName("");
              setInvoice("");
              setOriginal("");
              setSecond("");
              Alert.alert("Success", "Record add ho gaya");
            }

            function deleteItem(id) {
              Alert.alert("Delete", "Kya aap is entry ko delete karna chahte hain?", [
                { text: "Cancel", style: "cancel" },
                {
                  text: "Delete",
                  style: "destructive",
                  onPress: () => {
                    const filtered = data.filter((x) => x.id !== id);
                    save(filtered);
                  }
                }
              ]);
            }

            function openMaster() {
              if (mpin === MASTER) {
                setMaster(true);
                setMpin("");
                Alert.alert("Unlocked", "Master Ledger active ho gaya.");
              } else {
                Alert.alert("Access Denied", "Wrong Master PIN");
                setMpin("");
              }
            }

            return (
              <SafeAreaView style={s.page}>
                <StatusBar barStyle="light-content" backgroundColor="#0759a8" />
                <ScrollView keyboardShouldPersistTaps="handled">
                  <View style={s.head}>
                    <Text style={s.logo}>Vyapar Khata</Text>
                    <Text style={s.sub}>
                      {master ? "★ MASTER CONSOLIDATED VIEW" : "OFFICIAL REGULAR VIEW"}
                    </Text>
                  </View>

                  {!master ? (
                    <View style={s.box}>
                      <Text style={s.title}>🔐 Master Access</Text>
                      <TextInput
                        style={s.input}
                        placeholder="Master PIN dalein"
                        keyboardType="numeric"
                        secureTextEntry
                        value={mpin}
                        onChangeText={setMpin}
                      />
                      <TouchableOpacity style={s.purple} onPress={openMaster}>
                        <Text style={s.white}>OPEN MASTER</Text>
                      </TouchableOpacity>
                    </View>
                  ) : (
                    <View style={s.box}>
                      <TouchableOpacity
                        style={s.closeBtn}
                        onPress={() => setMaster(false)}
                      >
                        <Text style={s.closeBtnText}>🔒 Close Master Mode</Text>
                      </TouchableOpacity>
                    </View>
                  )}

                  <View style={s.box}>
                    <Text style={s.title}>New Invoice Entry</Text>

                    <TextInput
                      style={s.input}
                      placeholder="Customer Name *"
                      value={name}
                      onChangeText={setName}
                    />

                    <TextInput
                      style={s.input}
                      placeholder="Invoice Number *"
                      value={invoice}
                      onChangeText={setInvoice}
                    />

                    <TextInput
                      style={s.input}
                      placeholder="Original Invoice Amount (₹) *"
                      keyboardType="numeric"
                      value={original}
                      onChangeText={setOriginal}
                    />

                    {master ? (
                      <TextInput
                        style={[s.input, { borderColor: "#7b1fa2", backgroundColor: "#fdf7ff" }]}
                        placeholder="Second Secret Amount (₹)"
                        keyboardType="numeric"
                        value={second}
                        onChangeText={setSecond}
                      />
                    ) : null}

                    <TouchableOpacity style={s.blue} onPress={add}>
                      <Text style={s.white}>SAVE INVOICE</Text>
                    </TouchableOpacity>
                  </View>

                  <Text style={s.list}>
                    Invoice Records ({data.length})
                  </Text>

                  {data.length === 0 ? (
                    <View style={s.box}>
                      <Text style={{ textAlign: "center", color: "#888" }}>
                        Abhi koi invoice nahi hai.
                      </Text>
                    </View>
                  ) : (
                    data.map((x) => {
                      const total = Number(x.original || 0) + Number(x.second || 0);

                      return (
                        <View style={s.card} key={x.id}>
                          <View style={{ flexDirection: "row", justifyContent: "space-between" }}>
                            <Text style={s.name}>{x.name}</Text>
                            <TouchableOpacity onPress={() => deleteItem(x.id)}>
                              <Text style={{ color: "#c62828", fontWeight: "bold" }}>Del ✖</Text>
                            </TouchableOpacity>
                          </View>

                          <Text style={s.invNo}>Invoice: {x.invoice}</Text>

                          <Text style={s.green}>
                            Original: ₹{Number(x.original).toLocaleString("en-IN")}
                          </Text>

                          {!master ? (
                            <Text style={s.red}>
                              Original Due: ₹{Number(x.original).toLocaleString("en-IN")}
                            </Text>
                          ) : (
                            <View style={s.secret}>
                              <Text style={s.purpleText}>
                                Second Amount: ₹{Number(x.second || 0).toLocaleString("en-IN")}
                              </Text>
                              <Text style={s.totalDue}>
                                TOTAL DUE: ₹{total.toLocaleString("en-IN")}
                              </Text>
                            </View>
                          )}
                        </View>
                      );
                    })
                  )}

                  <View style={{ height: 60 }} />
                </ScrollView>
              </SafeAreaView>
            );
          }

          const s = StyleSheet.create({
            page: { flex: 1, backgroundColor: "#f3f6fa" },
            head: { backgroundColor: "#0759a8", padding: 20 },
            logo: { color: "#fff", fontSize: 24, fontWeight: "bold" },
            sub: { color: "#dcecff", marginTop: 4, fontSize: 13, fontWeight: "600" },
            box: { backgroundColor: "#fff", marginHorizontal: 12, marginTop: 12, padding: 15, borderRadius: 10, elevation: 2 },
            title: { fontSize: 17, fontWeight: "bold", marginBottom: 12, color: "#222" },
            input: { borderWidth: 1, borderColor: "#ccc", borderRadius: 8, padding: 11, marginBottom: 10, fontSize: 15, backgroundColor: "#fff" },
            blue: { backgroundColor: "#0759a8", padding: 14, borderRadius: 8, alignItems: "center", marginTop: 4 },
            purple: { backgroundColor: "#7b1fa2", padding: 13, borderRadius: 8, alignItems: "center" },
            white: { color: "#fff", fontWeight: "bold", fontSize: 15 },
            closeBtn: { padding: 12, alignItems: "center", backgroundColor: "#fce4ec", borderRadius: 8 },
            closeBtnText: { color: "#c2185b", fontWeight: "bold", fontSize: 14 },
            list: { fontSize: 18, fontWeight: "bold", marginHorizontal: 14, marginTop: 16, marginBottom: 8, color: "#222" },
            card: { backgroundColor: "#fff", marginHorizontal: 12, marginBottom: 10, padding: 15, borderRadius: 10, elevation: 2 },
            name: { fontSize: 17, fontWeight: "bold", color: "#111" },
            invNo: { color: "#666", fontSize: 13, marginTop: 2 },
            green: { color: "#16835c", fontSize: 16, fontWeight: "bold", marginTop: 6 },
            red: { color: "#c62828", fontSize: 16, fontWeight: "bold", marginTop: 4 },
            secret: { marginTop: 10, padding: 10, backgroundColor: "#f3e5f5", borderRadius: 8, borderWidth: 1, borderColor: "#e1bee7" },
            purpleText: { color: "#7b1fa2", fontSize: 15, fontWeight: "bold" },
            totalDue: { color: "#b71c1c", fontSize: 17, fontWeight: "bold", marginTop: 4 }
          });
          APPJS

          npx expo prebuild --platform android --no-install

      - name: Restore Existing Permanent Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks
          test -s vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Permanent Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          data = p.read_text()
          release_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """
          if "signingConfigs {" not in data:
              raise SystemExit("signingConfigs block not found")
          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + release_block,
              1
          )
          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )
          p.write_text(data)
          PY

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release-v53
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
