
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.vyapar.khatabook.free

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Version Code
        run: |
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Version Code: $VERSION_CODE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "vyapar-khata",
            "version": "2.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "@react-native-async-storage/async-storage": "1.23.1",
              "expo": "51.0.39",
              "react": "18.2.0",
              "react-native": "0.74.5"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~11.0.0"
            }
          }
          EOF

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Create Babel Config
        run: |
          cat > babel.config.js <<'EOF'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ["babel-preset-expo"]
            };
          };
          EOF

      - name: Create index.js
        run: |
          cat > index.js <<'EOF'
          import { registerRootComponent } from "expo";
          import App from "./App";

          registerRootComponent(App);
          EOF

      - name: Create app.json
        run: |
          cat > app.json <<EOF
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "2.0.0",
              "orientation": "portrait",
              "android": {
                "package": "${PACKAGE_NAME}",
                "versionCode": ${VERSION_CODE}
              }
            }
          }
          EOF

      - name: Expo Prebuild
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

      - name: Fix Splash Resource
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/splashscreen_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Configure Android SDK
        run: |
          cat >> android/gradle.properties <<'EOF'

          android.compileSdkVersion=36
          android.targetSdkVersion=36
          android.buildToolsVersion=36.0.0
          EOF

      - name: Restore Existing Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Existing keystore restored."

      - name: Configure Signing Directly
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Remove any previous injected signing configuration.
          start_marker = "// VYAPAR_SIGNING_START"
          end_marker = "// VYAPAR_SIGNING_END"

          while start_marker in text and end_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              text = text[:start] + text[end:]

          # Remove references to broken signingConfigs.release.
          text = text.replace(
              "signingConfig signingConfigs.release",
              ""
          )

          signing_block = r'''
          // VYAPAR_SIGNING_START
          def vyaparKeystoreFile = file("upload-keystore.jks")
          def vyaparStorePassword = System.getenv("KEYSTORE_PASSWORD")
          def vyaparKeyAlias = System.getenv("KEY_ALIAS")
          def vyaparKeyPassword = System.getenv("KEY_PASSWORD")
          // VYAPAR_SIGNING_END
          '''

          text = signing_block + "\n" + text

          # Find android block.
          android_start = text.find("android {")

          if android_start == -1:
              raise SystemExit("android block not found")

          # Find buildTypes.
          build_types = text.find(
              "buildTypes {",
              android_start
          )

          if build_types == -1:
              raise SystemExit("buildTypes block not found")

          # Find release block.
          release_pos = text.find(
              "release {",
              build_types
          )

          if release_pos == -1:
              raise SystemExit("release block not found")

          # Find closing brace for release block.
          depth = 0
          release_end = None
          opened = False

          for i in range(release_pos, len(text)):
              if text[i] == "{":
                  depth += 1
                  opened = True
              elif text[i] == "}":
                  depth -= 1
                  if opened and depth == 0:
                      release_end = i
                      break

          if release_end is None:
              raise SystemExit("Could not locate release block end")

          signing_line = '''
                  signingConfig signingConfigs.create("vyaparRelease")
                  '''

          # We don't rely on signingConfigs.release.
          # Create a named signing config before buildTypes.
          signing_config = '''
              signingConfigs {
                  create("vyaparRelease") {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

          '''

          # Find existing signingConfigs inside android block.
          existing_signing = text.find(
              "signingConfigs {",
              android_start,
              build_types
          )

          if existing_signing != -1:
              # Leave Expo's block untouched and add our own named config
              # only if vyaparRelease does not already exist.
              existing_end = existing_signing
              depth = 0
              opened = False

              for i in range(existing_signing, len(text)):
                  if text[i] == "{":
                      depth += 1
                      opened = True
                  elif text[i] == "}":
                      depth -= 1
                      if opened and depth == 0:
                          existing_end = i + 1
                          break

              existing_block = text[
                  existing_signing:existing_end
              ]

              if "vyaparRelease" not in existing_block:
                  text = (
                      text[:existing_end]
                      + "\n"
                      + signing_config
                      + text[existing_end:]
                  )

          else:
              text = (
                  text[:build_types]
                  + signing_config
                  + text[build_types:]
              )

              build_types = text.find(
                  "buildTypes {",
                  android_start
              )

              release_pos = text.find(
                  "release {",
                  build_types
              )

              depth = 0
              release_end = None
              opened = False

              for i in range(release_pos, len(text)):
                  if text[i] == "{":
                      depth += 1
                      opened = True
                  elif text[i] == "}":
                      depth -= 1
                      if opened and depth == 0:
                          release_end = i
                          break

          # Add signing config to release block.
          release_content = text[
              release_pos:release_end
          ]

          if "vyaparRelease" not in release_content:
              insert_at = release_pos + len("release {")
              text = (
                  text[:insert_at]
                  + "\n"
                  + signing_line
                  + text[insert_at:]
              )

          path.write_text(text)

          print("Signing configuration created successfully.")
          PY

      - name: Verify Signing Configuration
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Checking keystore..."

          test -f android/app/upload-keystore.jks

          echo "Checking build.gradle..."

          grep -n "vyaparRelease" android/app/build.gradle || true

          grep -n "signingConfig" android/app/build.gradle || true

          echo "Signing configuration check completed."

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android

          chmod +x gradlew

          ./gradlew clean bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Check AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          echo "AAB SUCCESS:"
          ls -lh "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build Successful
        run: |
          echo "======================================"
          echo "VYAPAR KHATA AAB SUCCESSFUL"
          echo "======================================"
          echo "Package: ${PACKAGE_NAME}"
          echo "Version Code: ${VERSION_CODE}"
          echo "======================================"
