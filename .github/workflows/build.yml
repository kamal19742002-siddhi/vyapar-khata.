name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Expo App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank@sdk-51 --no-install
          cd vyapar-khata
          npm install
          npx expo install @react-native-async-storage/async-storage

      - name: Configure App
        working-directory: vyapar-khata
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const runNumber = parseInt(process.env.RUN_NUMBER || "1", 10);

          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = `2.0.${runNumber}`;
          app.expo.android = {
            ...(app.expo.android || {}),
            package: "com.vyapar.khatabook.free",
            versionCode: 2000 + runNumber
          };

          fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          console.log("Version code:", 2000 + runNumber);
          NODE

      - name: Create App.js
        working-directory: vyapar-khata
        run: |
          cat > App.js <<'APPJS'
