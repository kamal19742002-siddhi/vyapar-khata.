      APPJS

  - name: Generate Android Project
    run: |
      cd vyapar-khata
      npx expo prebuild --platform android --no-install

  - name: Restore Existing Permanent Signing Key
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    run: |
      test -n "$KEYSTORE_BASE64"

      echo "$KEYSTORE_BASE64" | base64 --decode > \
        vyapar-khata/android/app/upload-keystore.jks

      test -s \
        vyapar-khata/android/app/upload-keystore.jks

  - name: Configure Permanent Release Signing
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: |
      cd vyapar-khata/android

      python3 - <<'PY'
      from pathlib import Path

      p = Path("app/build.gradle")
      data = p.read_text()

      release_block = """
          release {
              storeFile file('upload-keystore.jks')
              storePassword System.getenv('KEYSTORE_PASSWORD')
              keyAlias System.getenv('KEY_ALIAS')
              keyPassword System.getenv('KEY_PASSWORD')
          }
      """

      if "signingConfigs {" not in data:
          raise SystemExit(
              "signingConfigs block not found"
          )

      data = data.replace(
          "signingConfigs {",
          "signingConfigs {" + release_block,
          1
      )

      data = data.replace(
          "signingConfig signingConfigs.debug",
          "signingConfig signingConfigs.release"
      )

      p.write_text(data)
      PY

  - name: Build Release AAB
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: |
      cd vyapar-khata/android

      chmod +x gradlew

      ./gradlew bundleRelease --no-daemon

  - name: Upload AAB
    uses: actions/upload-artifact@v4
    with:
      name: vyapar-khata-release-v30
      path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
      if-no-files-found: error
