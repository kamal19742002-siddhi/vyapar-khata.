      - name: Restore Permanent Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p vyapar-khata/android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          p=Path("app/build.gradle")
          data=p.read_text()

          if "upload-keystore.jks" not in data:

              signing="""
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
              """

              data=data.replace(
                  "signingConfigs {",
                  "signingConfigs {" + signing,
                  1
              )

              data=data.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release"
              )

              p.write_text(data)

          PY

      - name: Build AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-advanced-v16
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
