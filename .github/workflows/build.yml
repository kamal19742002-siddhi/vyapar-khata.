name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create and Configure App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank@sdk-51 --no-install
          cd vyapar-khata
          npm install
          npx expo install @react-native-async-storage/async-storage babel-preset-expo @expo/metro-config

          cat > metro.config.js <<'METRO'
          const { getDefaultConfig } = require('expo/metro-config');
          const config = getDefaultConfig(__dirname);
          module.exports = config;
          METRO

          cat > babel.config.js <<'BABEL'
          module.exports = function(api) {
            api.cache(true);
            return {
              presets: ['babel-preset-expo'],
            };
          };
          BABEL

          node - <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.name = "Vyapar Khata";
          app.expo.slug = "vyapar-khata";
          app.expo.version = "1.0.55";
          app.expo.android = {
            package: "com.vyapar.khatabook.free",
            versionCode: 55
          };
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          NODE

          cat > App.js <<'APPJS'
          import React,{useState,useEffect} from "react";
          import {View,Text,TextInput,TouchableOpacity,ScrollView,StyleSheet,Alert} from "react-native";
          import AsyncStorage from "@react-native-async-storage/async-storage";

          const KEY="DUAL_LEDGER_DATA";
          const MASTER="9999";

          export default function App(){
            const [data,setData]=useState([]);
            const [name,setName]=useState("");
            const [invoice,setInvoice]=useState("");
            const [original,setOriginal]=useState("");
            const [second,setSecond]=useState("");
            const [master,setMaster]=useState(false);
            const [mpin,setMpin]=useState("");

            useEffect(()=>{load()},[]);

            async function load(){
              const x=await AsyncStorage.getItem(KEY);
              if(x)setData(JSON.parse(x));
            }

            async function save(list){
              setData(list);
              await AsyncStorage.setItem(KEY,JSON.stringify(list));
            }

            function add(){
              if(!name||!invoice||!original){
                Alert.alert("Required","Name, Invoice aur Original Amount bharein");
                return;
              }

              const item={
                id:Date.now(),
                name:name,
                invoice:invoice,
                original:Number(original),
                second:Number(second||0)
              };

              save([item,...data]);
              setName("");
              setInvoice("");
              setOriginal("");
              setSecond("");
            }

            function openMaster(){
              if(mpin===MASTER){
                setMaster(true);
                setMpin("");
              }else{
                Alert.alert("Access Denied","Wrong Master PIN");
              }
            }

            return(
              <ScrollView style={s.page}>
                <View style={s.head}>
                  <Text style={s.logo}>Vyapar Khata</Text>
                  <Text style={s.sub}>
                    {master?"MASTER LEDGER":"ORIGINAL LEDGER"}
                  </Text>
                </View>

                {!master&&(
                  <View style={s.box}>
                    <Text style={s.title}>🔐 Master Access</Text>
                    <TextInput
                      style={s.input}
                      placeholder="Master PIN"
                      keyboardType="numeric"
                      secureTextEntry
                      value={mpin}
                      onChangeText={setMpin}
                    />
                    <TouchableOpacity style={s.purple} onPress={openMaster}>
                      <Text style={s.white}>OPEN MASTER</Text>
                    </TouchableOpacity>
                  </View>
                )}

                {master&&(
                  <TouchableOpacity
                    style={s.close}
                    onPress={()=>setMaster(false)}
                  >
                    <Text>🔒 Close Master Mode</Text>
                  </TouchableOpacity>
                )}

                <View style={s.box}>
                  <Text style={s.title}>New Original Invoice</Text>

                  <TextInput
                    style={s.input}
                    placeholder="Customer Name"
                    value={name}
                    onChangeText={setName}
                  />

                  <TextInput
                    style={s.input}
                    placeholder="Invoice Number"
                    value={invoice}
                    onChangeText={setInvoice}
                  />

                  <TextInput
                    style={s.input}
                    placeholder="Original Invoice Amount"
                    keyboardType="numeric"
                    value={original}
                    onChangeText={setOriginal}
                  />

                  <TextInput
                    style={s.input}
                    placeholder="Second Amount (Master Only)"
                    keyboardType="numeric"
                    value={second}
                    onChangeText={setSecond}
                  />

                  <TouchableOpacity style={s.blue} onPress={add}>
                    <Text style={s.white}>SAVE INVOICE</Text>
                  </TouchableOpacity>
                </View>

                <Text style={s.list}>Invoice Records</Text>

                {data.map(x=>{
                  const total=x.original+x.second;

                  return(
                    <View style={s.card} key={x.id}>
                      <Text style={s.name}>{x.name}</Text>
                      <Text>Invoice: {x.invoice}</Text>

                      <Text style={s.green}>
                        Original: ₹{x.original}
                      </Text>

                      {!master&&(
                        <Text style={s.red}>
                          Original Due: ₹{x.original}
                        </Text>
                      )}

                      {master&&(
                        <View style={s.secret}>
                          <Text style={s.purpleText}>
                            Second Amount: ₹{x.second}
                          </Text>

                          <Text style={s.red}>
                            TOTAL DUE: ₹{total}
                          </Text>
                        </View>
                      )}
                    </View>
                  );
                })}

                <View style={{height:50}}/>
              </ScrollView>
            );
          }

          const s=StyleSheet.create({
            page:{flex:1,backgroundColor:"#f3f6fa"},
            head:{backgroundColor:"#0759a8",padding:22},
            logo:{color:"#fff",fontSize:25,fontWeight:"bold"},
            sub:{color:"#dcecff",marginTop:4},
            box:{backgroundColor:"#fff",margin:12,padding:15,borderRadius:10},
            title:{fontSize:18,fontWeight:"bold",marginBottom:10},
            input:{borderWidth:1,borderColor:"#ccc",borderRadius:7,padding:11,marginBottom:8},
            blue:{backgroundColor:"#0759a8",padding:14,borderRadius:7,alignItems:"center"},
            purple:{backgroundColor:"#7b1fa2",padding:14,borderRadius:7,alignItems:"center"},
            white:{color:"#fff",fontWeight:"bold"},
            close:{padding:14,alignItems:"center"},
            list:{fontSize:20,fontWeight:"bold",margin:14},
            card:{backgroundColor:"#fff",marginHorizontal:12,marginBottom:10,padding:15,borderRadius:10},
            name:{fontSize:18,fontWeight:"bold"},
            green:{color:"#16835c",fontSize:17,fontWeight:"bold",marginTop:6},
            red:{color:"#c62828",fontSize:17,fontWeight:"bold",marginTop:6},
            secret:{marginTop:10,padding:10,backgroundColor:"#f3e5f5",borderRadius:7},
            purpleText:{color:"#7b1fa2",fontSize:17,fontWeight:"bold"}
          });
          APPJS

          npx expo prebuild --platform android --no-install

      - name: Update Target and Compile SDK to API 36
        run: |
          cd vyapar-khata/android
          echo "android.compileSdkVersion=36" >> gradle.properties
          echo "android.targetSdkVersion=36" >> gradle.properties
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("app/build.gradle")
          content = p.read_text()
          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)
          content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', content)
          p.write_text(content)
          PY

      - name: Restore Existing Permanent Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks
          test -s vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Permanent Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          data = p.read_text()
          release_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """
          if "signingConfigs {" not in data:
              raise SystemExit("signingConfigs block not found")
          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + release_block,
              1
          )
          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )
          p.write_text(data)
          PY

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release-v55
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
