name: Build Vyapar Khata AAB

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Create Expo App
    run: |
      npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
      cd vyapar-khata

      npm install

      npx expo install expo-document-picker
      npx expo install @react-native-async-storage/async-storage

      node - <<'NODE'
      const fs = require("fs");

      const p = "app.json";
      const app = JSON.parse(fs.readFileSync(p, "utf8"));

      app.expo.name = "Vyapar Khata";
      app.expo.slug = "vyapar-khata";
      app.expo.version = "1.0.30";

      app.expo.android = {
        package: "com.vyapar.khatabook.free",
        versionCode: 30
      };

      fs.writeFileSync(p, JSON.stringify(app, null, 2));
      NODE

  - name: Create App.js
    run: |
      cd vyapar-khata

      cat > App.js <<'APPJS'
      import React, { useEffect, useMemo, useState } from "react";
      import {
        Alert,
        SafeAreaView,
        ScrollView,
        StatusBar,
        StyleSheet,
        Text,
        TextInput,
        TouchableOpacity,
        View
      } from "react-native";

      import AsyncStorage from "@react-native-async-storage/async-storage";
      import * as DocumentPicker from "expo-document-picker";

      const STORE = "@vyapar_khata_data_v3";

      const today = () => {
        const d = new Date();

        return (
          String(d.getDate()).padStart(2, "0") +
          "/" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "/" +
          d.getFullYear()
        );
      };

      function Button({ text, onPress, secondary = false }) {
        return (
          <TouchableOpacity
            style={[
              styles.button,
              secondary && styles.buttonSecondary
            ]}
            onPress={onPress}
            activeOpacity={0.8}
          >
            <Text
              style={[
                styles.buttonText,
                secondary && styles.buttonTextSecondary
              ]}
            >
              {text}
            </Text>
          </TouchableOpacity>
        );
      }

      function Header({ title }) {
        return (
          <View style={styles.innerHeader}>
            <Text style={styles.innerHeaderTitle}>{title}</Text>
          </View>
        );
      }

      function Info({ title, value }) {
        return (
          <View style={styles.infoRow}>
            <Text style={styles.infoTitle}>{title}</Text>
            <Text style={styles.infoValue}>
              {value || "Not provided"}
            </Text>
          </View>
        );
      }

      export default function App() {
        const [screen, setScreen] = useState("home");
        const [tab, setTab] = useState("Customers");

        const [customers, setCustomers] = useState([]);
        const [suppliers, setSuppliers] = useState([]);

        const [selected, setSelected] = useState(null);

        const [name, setName] = useState("");
        const [phone, setPhone] = useState("");
        const [gst, setGst] = useState("");
        const [address, setAddress] = useState("");
        const [email, setEmail] = useState("");

        const [invoiceNo, setInvoiceNo] = useState("");
        const [invoiceDate, setInvoiceDate] = useState(today());
        const [amount, setAmount] = useState("");
        const [paymentMode, setPaymentMode] = useState("Cash");
        const [entryType, setEntryType] = useState("Credit");
        const [attachment, setAttachment] = useState(null);

        useEffect(() => {
          loadData();
        }, []);

        const loadData = async () => {
          try {
            const raw = await AsyncStorage.getItem(STORE);

            if (raw) {
              const data = JSON.parse(raw);

              setCustomers(data.customers || []);
              setSuppliers(data.suppliers || []);
            }
          } catch (e) {
            console.log("Load error:", e);
          }
        };

        const saveData = async (customerData, supplierData) => {
          try {
            await AsyncStorage.setItem(
              STORE,
              JSON.stringify({
                customers: customerData,
                suppliers: supplierData
              })
            );
          } catch (e) {
            console.log("Save error:", e);
          }
        };

        const currentList =
          tab === "Customers" ? customers : suppliers;

        const resetForm = () => {
          setName("");
          setPhone("");
          setGst("");
          setAddress("");
          setEmail("");

          setInvoiceNo("");
          setInvoiceDate(today());
          setAmount("");
          setPaymentMode("Cash");
          setEntryType("Credit");
          setAttachment(null);
        };

        const openNewPerson = () => {
          resetForm();
          setScreen("new");
        };

        const addPerson = async () => {
          if (!name.trim()) {
            Alert.alert(
              "Required",
              "Please enter customer or supplier name."
            );
            return;
          }

          const person = {
            id: Date.now().toString(),
            name: name.trim(),
            phone: phone.trim(),
            gst: gst.trim(),
            address: address.trim(),
            email: email.trim(),
            entries: []
          };

          if (tab === "Customers") {
            const updated = [person, ...customers];

            setCustomers(updated);

            await saveData(
              updated,
              suppliers
            );
          } else {
            const updated = [person, ...suppliers];

            setSuppliers(updated);

            await saveData(
              customers,
              updated
            );
          }

          resetForm();
          setScreen("home");

          Alert.alert(
            "Saved",
            `${tab === "Customers" ? "Customer" : "Supplier"} profile saved.`
          );
        };

        const chooseAttachment = async () => {
          try {
            const result =
              await DocumentPicker.getDocumentAsync({
                type: [
                  "image/*",
                  "application/pdf"
                ],
                copyToCacheDirectory: true
              });

            if (
              !result.canceled &&
              result.assets &&
              result.assets.length > 0
            ) {
              setAttachment(result.assets[0]);
            }
          } catch (e) {
            Alert.alert(
              "File Error",
              "Could not select the invoice."
            );
          }
        };

        const addTransaction = async () => {
          if (!selected) {
            return;
          }

          if (!invoiceNo.trim()) {
            Alert.alert(
              "Required",
              "Enter invoice number."
            );
            return;
          }

          const value = Number(amount);

          if (
            !amount.trim() ||
            !Number.isFinite(value) ||
            value <= 0
          ) {
            Alert.alert(
              "Invalid Amount",
              "Enter a valid amount."
            );
            return;
          }

          const entry = {
            id: Date.now().toString(),
            invoiceNo: invoiceNo.trim(),
            invoiceDate:
              invoiceDate.trim() || today(),
            amount: value,
            paymentMode,
            type: entryType,
            attachment:
              attachment ? attachment.name : null
          };

          const list =
            tab === "Customers"
              ? customers
              : suppliers;

          const updated = list.map(person => {
            if (person.id !== selected.id) {
              return person;
            }

            return {
              ...person,
              entries: [
                entry,
                ...(person.entries || [])
              ]
            };
          });

          if (tab === "Customers") {
            setCustomers(updated);

            await saveData(
              updated,
              suppliers
            );
          } else {
            setSuppliers(updated);

            await saveData(
              customers,
              updated
            );
          }

          const fresh = updated.find(
            person => person.id === selected.id
          );

          setSelected(fresh);

          setInvoiceNo("");
          setInvoiceDate(today());
          setAmount("");
          setPaymentMode("Cash");
          setEntryType("Credit");
          setAttachment(null);

          Alert.alert(
            "Saved",
            "Passbook entry saved."
          );
        };

        const openProfile = person => {
          setSelected(person);
          setScreen("profile");
        };

        const openPassbook = person => {
          setSelected(person);
          setScreen("passbook");
        };

        const goHome = () => {
          setScreen("home");
          setSelected(null);
          resetForm();
        };

        const total = useMemo(() => {
          if (!selected) {
            return 0;
          }

          return (selected.entries || []).reduce(
            (sum, entry) => {
              if (entry.type === "Credit") {
                return sum + entry.amount;
              }

              return sum - entry.amount;
            },
            0
          );
        }, [selected]);

        const totalForList = list => {
          return list.reduce((total, person) => {
            const personTotal =
              (person.entries || []).reduce(
                (sum, entry) => {
                  if (entry.type === "Credit") {
                    return sum + entry.amount;
                  }

                  return sum - entry.amount;
                },
                0
              );

            return total + personTotal;
          }, 0);
        };

        const customerTotal =
          totalForList(customers);

        const supplierTotal =
          totalForList(suppliers);

        if (screen === "new") {
          return (
            <SafeAreaView style={styles.container}>
              <StatusBar
                barStyle="light-content"
                backgroundColor="#0759a8"
              />

              <ScrollView
                contentContainerStyle={styles.scroll}
                keyboardShouldPersistTaps="handled"
              >
                <Header
                  title={
                    tab === "Customers"
                      ? "New Customer"
                      : "New Supplier"
                  }
                />

                <View style={styles.formCard}>
                  <Text style={styles.label}>
                    Name *
                  </Text>

                  <TextInput
                    style={styles.input}
                    placeholder="Customer / Supplier Name"
                    value={name}
                    onChangeText={setName}
                  />

                  <Text style={styles.label}>
                    Phone Number
                  </Text>

                  <TextInput
                    style={styles.input}
                    placeholder="Phone Number"
                    keyboardType="phone-pad"
                    value={phone}
                    onChangeText={setPhone}
                  />

                  <Text style={styles.label}>
                    GST Number
                  </Text>

                  <TextInput
                    style={styles.input}
                    placeholder="GST Number"
                    value={gst}
                    onChangeText={setGst}
                    autoCapitalize="characters"
                  />

                  <Text style={styles.label}>
                    Email ID
                  </Text>

                  <TextInput
                    style={styles.input}
                    placeholder="Email ID"
                    keyboardType="email-address"
                    value={email}
                    onChangeText={setEmail}
                  />

                  <Text style={styles.label}>
                    Address
                  </Text>

                  <TextInput
                    style={[
                      styles.input,
                      styles.addressInput
                    ]}
                    placeholder="Full Address"
                    multiline
                    value={address}
                    onChangeText={setAddress}
                  />

                  <Button
                    text="SAVE PROFILE"
                    onPress={addPerson}
                  />

                  <Button
                    text="CANCEL"
                    secondary
                    onPress={goHome}
                  />
                </View>
              </ScrollView>
            </SafeAreaView>
          );
        }

        if (
          screen === "profile" &&
          selected
        ) {
          return (
            <SafeAreaView style={styles.container}>
              <StatusBar
                barStyle="light-content"
                backgroundColor="#0759a8"
              />

              <ScrollView
                contentContainerStyle={styles.scroll}
              >
                <Header title="Profile" />

                <View style={styles.profileCard}>
                  <Text style={styles.profileName}>
                    {selected.name}
                  </Text>

                  <Info
                    title="Phone Number"
                    value={selected.phone}
                  />

                  <Info
                    title="GST Number"
                    value={selected.gst}
                  />

                  <Info
                    title="Email ID"
                    value={selected.email}
                  />

                  <Info
                    title="Address"
                    value={selected.address}
                  />
                </View>

                <View style={styles.formCard}>
                  <Button
                    text="OPEN PASSBOOK"
                    onPress={() =>
                      openPassbook(selected)
                    }
                  />

                  <Button
                    text="BACK"
                    secondary
                    onPress={goHome}
                  />
                </View>
              </ScrollView>
            </SafeAreaView>
          );
        }

        if (
          screen === "passbook" &&
          selected
        ) {
          return (
            <SafeAreaView style={styles.container}>
              <StatusBar
                barStyle="light-content"
                backgroundColor="#0759a8"
              />

              <ScrollView
                contentContainerStyle={styles.scroll}
              >
                <Header title="Passbook" />

                <View style={styles.passbookHead}>
                  <Text style={styles.profileName}>
                    {selected.name}
                  </Text>

                  <Text style={styles.small}>
                    {selected.phone ||
                      "No phone number"}
                  </Text>

                  <Text style={styles.balance}>
                    Balance: ₹
                    {Math.abs(total).toLocaleString(
                      "en-IN"
                    )}
                  </Text>

                  <Text style={styles.balanceType}>
                    {total >= 0
                      ? "Credit Balance"
                      : "Debit Balance"}
                  </Text>
                </View>

                <View style={styles.formCard}>
                  <Text style={styles.formTitle}>
                    New Passbook Entry
                  </Text>

                  <TextInput
                    style={styles.input}
                    placeholder="Invoice Number"
                    value={invoiceNo}
                    onChangeText={setInvoiceNo}
                  />

                  <TextInput
                    style={styles.input}
                    placeholder="Invoice Date (DD/MM/YYYY)"
                    value={invoiceDate}
                    onChangeText={setInvoiceDate}
                  />

                  <TextInput
                    style={styles.input}
                    placeholder="Amount (₹)"
                    keyboardType="numeric"
                    value={amount}
                    onChangeText={setAmount}
                  />

                  <Text style={styles.label}>
                    Transaction Type
                  </Text>

                  <View style={styles.row}>
                    <TouchableOpacity
                      style={[
                        styles.choice,
                        entryType === "Credit" &&
                          styles.choiceActive
                      ]}
                      onPress={() =>
                        setEntryType("Credit")
                      }
                    >
                      <Text style={styles.choiceText}>
                        + Jama
                      </Text>
                    </TouchableOpacity>

                    <TouchableOpacity
                      style={[
                        styles.choice,
                        entryType === "Debit" &&
                          styles.choiceActive
                      ]}
                      onPress={() =>
                        setEntryType("Debit")
                      }
                    >
                      <Text style={styles.choiceText}>
                        - Udhar
                      </Text>
                    </TouchableOpacity>
                  </View>

                  <Text style={styles.label}>
                    Mode of Payment
                  </Text>

                  <View style={styles.rowWrap}>
                    {[
                      "Cash",
                      "UPI",
                      "Bank",
                      "Cheque",
                      "Credit",
                      "Other"
                    ].map(mode => (
                      <TouchableOpacity
                        key={mode}
                        style={[
                          styles.payment,
                          paymentMode === mode &&
                            styles.paymentActive
                        ]}
                        onPress={() =>
                          setPaymentMode(mode)
                        }
                      >
                        <Text style={styles.paymentText}>
                          {mode}
                        </Text>
                      </TouchableOpacity>
                    ))}
                  </View>

                  <TouchableOpacity
                    style={styles.attachButton}
                    onPress={chooseAttachment}
                  >
                    <Text style={styles.attachText}>
                      📎 Attach Invoice Copy
                    </Text>
                  </TouchableOpacity>

                  {attachment && (
                    <Text style={styles.selectedFile}>
                      Selected: {attachment.name}
                    </Text>
                  )}

                  <Button
                    text="SAVE PASSBOOK ENTRY"
                    onPress={addTransaction}
                  />
                </View>

                <Text style={styles.sectionTitle}>
                  Transaction History
                </Text>

                {(selected.entries || []).length ===
                0 ? (
                  <View style={styles.empty}>
                    <Text style={styles.emptyText}>
                      No transactions yet.
                    </Text>
                  </View>
                ) : (
                  (selected.entries || []).map(
                    entry => (
                      <View
                        key={entry.id}
                        style={styles.transaction}
                      >
                        <View
                          style={styles.transactionLeft}
                        >
                          <Text
                            style={styles.invoice}
                          >
                            Invoice:{" "}
                            {entry.invoiceNo}
                          </Text>

                          <Text
                            style={styles.small}
                          >
                            Date:{" "}
                            {entry.invoiceDate}
                          </Text>

                          <Text
                            style={styles.small}
                          >
                            Payment:{" "}
                            {entry.paymentMode}
                          </Text>

                          {entry.attachment && (
                            <Text
                              style={
                                styles.selectedFile
                              }
                            >
                              📎{" "}
                              {entry.attachment}
                            </Text>
                          )}
                        </View>

                        <View
                          style={
                            styles.transactionRight
                          }
                        >
                          <Text
                            style={[
                              styles.transactionAmount,
                              {
                                color:
                                  entry.type ===
                                  "Credit"
                                    ? "#16835c"
                                    : "#c62828"
                              }
                            ]}
                          >
                            {entry.type ===
                            "Credit"
                              ? "+"
                              : "-"}
                            ₹
                            {entry.amount.toLocaleString(
                              "en-IN"
                            )}
                          </Text>

                          <Text style={styles.small}>
                            {entry.type}
                          </Text>
                        </View>
                      </View>
                    )
                  )
                )}

                <Button
                  text="BACK TO PROFILE"
                  secondary
                  onPress={() =>
                    setScreen("profile")
                  }
                />
              </ScrollView>
            </SafeAreaView>
          );
        }

        return (
          <SafeAreaView style={styles.container}>
            <StatusBar
              barStyle="light-content"
              backgroundColor="#0759a8"
            />

            <ScrollView
              contentContainerStyle={styles.scroll}
              keyboardShouldPersistTaps="handled"
            >
              <View style={styles.header}>
                <Text style={styles.logoTitle}>
                  Vyapar Khata
                </Text>

                <Text style={styles.subtitle}>
                  Digital Business Ledger
                </Text>

                <Text style={styles.businessName}>
                  Siddhi Enterprises
                </Text>
              </View>

              <View style={styles.summary}>
                <View style={styles.summaryBox}>
                  <Text style={styles.summaryLabel}>
                    Customers
                  </Text>

                  <Text style={styles.summaryValue}>
                    ₹
                    {customerTotal.toLocaleString(
                      "en-IN"
                    )}
                  </Text>
                </View>

                <View style={styles.summaryBox}>
                  <Text style={styles.summaryLabel}>
                    Suppliers
                  </Text>

                  <Text style={styles.summaryValue}>
                    ₹
                    {supplierTotal.toLocaleString(
                      "en-IN"
                    )}
                  </Text>
                </View>
              </View>

              <View style={styles.tabs}>
                <TouchableOpacity
                  style={[
                    styles.tab,
                    tab === "Customers" &&
                      styles.activeTab
                  ]}
                  onPress={() =>
                    setTab("Customers")
                  }
                >
                  <Text
                    style={[
                      styles.tabText,
                      tab === "Customers" &&
                        styles.activeTabText
                    ]}
                  >
                    CUSTOMERS
                  </Text>
                </TouchableOpacity>

                <TouchableOpacity
                  style={[
                    styles.tab,
                    tab === "Suppliers" &&
                      styles.activeTab
                  ]}
                  onPress={() =>
                    setTab("Suppliers")
                  }
                >
                  <Text
                    style={[
                      styles.tabText,
                      tab === "Suppliers" &&
                        styles.activeTabText
                    ]}
                  >
                    SUPPLIERS
                  </Text>
                </TouchableOpacity>
              </View>

              <View style={styles.formCard}>
                <Text style={styles.formTitle}>
                  {tab === "Customers"
                    ? "Customers"
                    : "Suppliers"}
                </Text>

                <Button
                  text={
                    tab === "Customers"
                      ? "+ ADD NEW CUSTOMER"
                      : "+ ADD NEW SUPPLIER"
                  }
                  onPress={openNewPerson}
                />
              </View>

              <Text style={styles.sectionTitle}>
                {tab}
              </Text>

              {currentList.length === 0 ? (
                <View style={styles.empty}>
                  <Text style={styles.emptyText}>
                    No {tab.toLowerCase()} yet.
                  </Text>

                  <Text style={styles.emptySub}>
                    Tap the button above to add one.
                  </Text>
                </View>
              ) : (
                currentList.map(person => {
                  const personTotal =
                    (person.entries || []).reduce(
                      (sum, entry) => {
                        return entry.type ===
                          "Credit"
                          ? sum + entry.amount
                          : sum - entry.amount;
                      },
                      0
                    );

                  return (
                    <View
                      key={person.id}
                      style={styles.personCard}
                    >
                      <View
                        style={styles.personLeft}
                      >
                        <Text
                          style={styles.personName}
                        >
                          {person.name}
                        </Text>

                        <Text
                          style={styles.personPhone}
                        >
                          {person.phone ||
                            "No phone number"}
                        </Text>

                        <Text
                          style={styles.personEntries}
                        >
                          {
                            (
                              person.entries || []
                            ).length
                          }{" "}
                          entries
                        </Text>
                      </View>

                      <View
                        style={styles.personRight}
                      >
                        <Text
                          style={[
                            styles.personAmount,
                            {
                              color:
                                personTotal >= 0
                                  ? "#16835c"
                                  : "#c62828"
                            }
                          ]}
                        >
                          ₹
                          {Math.abs(
                            personTotal
                          ).toLocaleString("en-IN")}
                        </Text>

                        <TouchableOpacity
                          onPress={() =>
                            openProfile(person)
                          }
                        >
                          <Text
                            style={styles.viewText}
                          >
                            VIEW
                          </Text>
                        </TouchableOpacity>

                        <TouchableOpacity
                          onPress={() =>
                            openPassbook(person)
                          }
                        >
                          <Text
                            style={styles.passbookText}
                          >
                            PASSBOOK
                          </Text>
                        </TouchableOpacity>
                      </View>
                    </View>
                  );
                })
              )}

              <View style={styles.footerSpace} />
            </ScrollView>
          </SafeAreaView>
        );
      }

      const styles = StyleSheet.create({
        container: {
          flex: 1,
          backgroundColor: "#f3f6fa"
        },

        scroll: {
          paddingBottom: 35
        },

        header: {
          backgroundColor: "#0759a8",
          paddingTop: 28,
          paddingBottom: 24,
          paddingHorizontal: 20
        },

        logoTitle: {
          color: "#fff",
          fontSize: 29,
          fontWeight: "800"
        },

        subtitle: {
          color: "#dbeaff",
          fontSize: 15,
          marginTop: 4
        },

        businessName: {
          color: "#fff",
          fontSize: 14,
          marginTop: 14,
          fontWeight: "600"
        },

        innerHeader: {
          backgroundColor: "#0759a8",
          paddingVertical: 20,
          paddingHorizontal: 18
        },

        innerHeaderTitle: {
          color: "#fff",
          fontSize: 24,
          fontWeight: "800"
        },

        summary: {
          flexDirection: "row",
          backgroundColor: "#fff",
          marginHorizontal: 14,
          marginTop: 12,
          borderRadius: 16,
          paddingVertical: 18,
          elevation: 4
        },

        summaryBox: {
          flex: 1,
          alignItems: "center"
        },

        summaryLabel: {
          color: "#555",
          fontSize: 14,
          marginBottom: 6
        },

        summaryValue: {
          color: "#16835c",
          fontSize: 21,
          fontWeight: "800"
        },

        tabs: {
          flexDirection: "row",
          backgroundColor: "#0759a8",
          marginTop: 15
        },

        tab: {
          flex: 1,
          alignItems: "center",
          paddingVertical: 14
        },

        activeTab: {
          borderBottomWidth: 4,
          borderBottomColor: "#ffc928"
        },

        tabText: {
          color: "#dcecff",
          fontSize: 14,
          fontWeight: "700"
        },

        activeTabText: {
          color: "#fff"
        },

        formCard: {
          backgroundColor: "#fff",
          margin: 14,
          padding: 18,
          borderRadius: 18,
          elevation: 3
        },

        formTitle: {
          fontSize: 21,
          fontWeight: "800",
          color: "#252525",
          marginBottom: 14
        },

        label: {
          color: "#555",
          fontSize: 14,
          fontWeight: "700",
          marginBottom: 6
        },

        input: {
          borderWidth: 1,
          borderColor: "#d4d8de",
          borderRadius: 12,
          paddingHorizontal: 14,
          paddingVertical: 13,
          fontSize: 16,
          color: "#222",
          marginBottom: 12,
          backgroundColor: "#fafbfc"
        },

        addressInput: {
          minHeight: 90,
          textAlignVertical: "top"
