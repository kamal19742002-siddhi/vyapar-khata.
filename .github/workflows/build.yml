name: Generate Permanent Keystore

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore & PEM
        run: |
          # 1. Permanent keystore create karein
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=VyaparKhata, O=Vyapar, C=IN"

          # 2. Google ke liye PEM certificate export karein
          keytool -export -rfc \
            -alias upload \
            -file upload_certificate.pem \
            -keystore upload-keystore.jks \
            -storepass android123

          # 3. Base64 format print karein (GitHub Secrets ke liye)
          echo "=== COPY THIS BASE64 FOR GITHUB SECRETS ==="
          base64 -w 0 upload-keystore.jks > keystore_base64.txt
          cat keystore_base64.txt
          echo ""
          echo "==========================================="

      - name: Upload Files as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-play-key-files
          path: |
            upload_certificate.pem
            upload-keystore.jks
            keystore_base64.txt
