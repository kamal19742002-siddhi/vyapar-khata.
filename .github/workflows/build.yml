name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Project and Setup App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata

          npm install
          npx expo install react-native-webview

          node -e "
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json'));
          app.expo.name = 'Vyapar Khata Book';
          app.expo.slug = 'vyapar-khata';
          app.expo.version = '1.0.9';
          app.expo.android = {
            package: 'com.vyapar.khatabook.free',
            versionCode: 14
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

          cat << 'EOF' > App.js
          import React from 'react';
          import { SafeAreaView, StatusBar, StyleSheet } from 'react-native';
          import { WebView } from 'react-native-webview';

          export default function App() {
            const html = `
              <!DOCTYPE html>
              <html>
              <head>
                <meta name="viewport"
                  content="width=device-width, initial-scale=1.0">
                <style>
                  body {
                    margin: 0;
                    background: #f5f7fa;
                    font-family: Arial, sans-serif;
                  }

                  .header {
                    background: #166534;
                    color: white;
                    padding: 24px 18px;
                    font-size: 25px;
                    font-weight: bold;
                  }

                  .card {
                    background: white;
                    margin: 20px;
                    padding: 24px;
                    border-radius: 16px;
                    box-shadow: 0 2px 8px rgba(0,0,0,.08);
                  }

                  h2 {
                    margin-top: 0;
                    color: #166534;
                  }

                  p {
                    color: #444;
                    font-size: 16px;
                    line-height: 1.5;
                  }

                  .button {
                    background: #166534;
                    color: white;
                    padding: 15px;
                    border-radius: 10px;
                    text-align: center;
                    font-size: 17px;
                    margin-top: 20px;
                  }
                </style>
              </head>

              <body>
                <div class="header">Vyapar Khata Book</div>

                <div class="card">
                  <h2>Welcome</h2>
                  <p>
                    Vyapar Khata Book app is ready for testing.
                  </p>

                  <p>
                    Your business khata and customer records
                    can be managed from this app.
                  </p>

                  <div class="button">
                    Vyapar Khata Book
                  </div>
                </div>
              </body>
              </html>
            `;

            return (
              <SafeAreaView style={styles.container}>
                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#166534"
                />

                <WebView
                  source={{ html }}
                  style={{ flex: 1 }}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                />
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: {
              flex: 1,
              backgroundColor: '#f5f7fa'
            }
          });
          EOF

          CI=1 npx expo prebuild --platform android --no-install

      - name: Restore Permanent Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Permanent Gradle Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          data = p.read_text()

          signing_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + signing_block,
              1
          )

          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(data)
          PY

      - name: Build Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-v14
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
