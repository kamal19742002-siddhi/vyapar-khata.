name: Build Vyapar Khata AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      # Yeh step API 36 ke nullability error ko auto-fix karta hai
      - name: Patch Expo Modules Core for API 36
        run: |
          FILE=$(find node_modules/ -path "*/expo/modules/adapters/react/ModuleRegistryAdapter.kt" 2>/dev/null | head -n 1)
          if [ -f "$FILE" ]; then
            echo "Patching $FILE for API 36 compatibility..."
            sed -i 's/\.filterIsInstance/?.filterIsInstance/g' "$FILE"
            sed -i 's/\.map {/?.map {/g' "$FILE"
          fi
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Decode Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB)
        working-directory: android
        env:
          MYAPP_UPLOAD_STORE_FILE: release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab()
          release_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """
          if "signingConfigs {" not in data:
              raise SystemExit("signingConfigs block not found")
          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + release_block,
              1
          )
          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )
          p.write_text(data)
          PY

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release-v55
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
