
name: Build Vyapar Khata AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Expo App
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank@sdk-54 --no-install
          cd vyapar-khata

          npm install

          npx expo install @react-native-async-storage/async-storage
          npx expo install expo-build-properties

          cat > app.json <<'JSON'
          {
            "expo": {
              "name": "Vyapar Khata",
              "slug": "vyapar-khata",
              "version": "1.0.54",
              "android": {
                "package": "com.vyapar.khatabook.free",
                "versionCode": 54
              },
              "plugins": [
                [
                  "expo-build-properties",
                  {
                    "android": {
                      "compileSdkVersion": 36,
                      "targetSdkVersion": 36,
                      "buildToolsVersion": "36.0.0"
                    }
                  }
                ]
              ]
            }
          }
          JSON

          cat > metro.config.js <<'METRO'
          const { getDefaultConfig } = require("expo/metro-config");

          const config = getDefaultConfig(__dirname);

          module.exports = config;
          METRO

          cat > babel.config.js <<'BABEL'
          module.exports = function(api) {
            api.cache(true);

            return {
              presets: ["babel-preset-expo"]
            };
          };
          BABEL

          cat > App.js <<'APPJS'
          import React, {useEffect, useState} from "react";
          import {
            View,
            Text,
            TextInput,
            TouchableOpacity,
            ScrollView,
            StyleSheet,
            Alert,
            SafeAreaView,
            StatusBar
          } from "react-native";

          import AsyncStorage from "@react-native-async-storage/async-storage";

          const KEY = "DUAL_LEDGER_DATA";
          const MASTER = "9999";

          export default function App() {

            const [data, setData] = useState([]);
            const [name, setName] = useState("");
            const [invoice, setInvoice] = useState("");
            const [original, setOriginal] = useState("");
            const [second, setSecond] = useState("");
            const [master, setMaster] = useState(false);
            const [mpin, setMpin] = useState("");

            useEffect(function() {
              load();
            }, []);

            async function load() {
              try {
                const x = await AsyncStorage.getItem(KEY);

                if (x) {
                  setData(JSON.parse(x));
                }
              } catch (e) {
                console.log(e);
              }
            }

            async function save(list) {
              setData(list);

              await AsyncStorage.setItem(
                KEY,
                JSON.stringify(list)
              );
            }

            function add() {

              if (
                !name.trim() ||
                !invoice.trim() ||
                !original.trim()
              ) {
                Alert.alert(
                  "Required",
                  "Customer Name, Invoice aur Original Amount bharein"
                );

                return;
              }

              const item = {
                id: Date.now(),
                name: name.trim(),
                invoice: invoice.trim(),
                original: Number(original),
                second: Number(second || 0)
              };

              save([item].concat(data));

              setName("");
              setInvoice("");
              setOriginal("");
              setSecond("");

              Alert.alert(
                "Success",
                "Record add ho gaya"
              );
            }

            function openMaster() {

              if (mpin === MASTER) {

                setMaster(true);
                setMpin("");

                Alert.alert(
                  "Unlocked",
                  "Master Ledger active ho gaya"
                );

              } else {

                Alert.alert(
                  "Access Denied",
                  "Wrong Master PIN"
                );

                setMpin("");
              }
            }

            function deleteItem(id) {

              Alert.alert(
                "Delete",
                "Kya aap is entry ko delete karna chahte hain?",
                [
                  {
                    text: "Cancel",
                    style: "cancel"
                  },
                  {
                    text: "Delete",
                    style: "destructive",
                    onPress: function() {

                      const filtered = data.filter(
                        function(x) {
                          return x.id !== id;
                        }
                      );

                      save(filtered);
                    }
                  }
                ]
              );
            }

            return (
              <SafeAreaView style={s.page}>

                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#0759a8"
                />

                <ScrollView>

                  <View style={s.head}>

                    <Text style={s.logo}>
                      Vyapar Khata
                    </Text>

                    <Text style={s.sub}>
                      {master
                        ? "MASTER CONSOLIDATED VIEW"
                        : "OFFICIAL REGULAR VIEW"}
                    </Text>

                  </View>

                  {!master ? (

                    <View style={s.box}>

                      <Text style={s.title}>
                        Master Access
                      </Text>

                      <TextInput
                        style={s.input}
                        placeholder="Master PIN dalein"
                        keyboardType="numeric"
                        secureTextEntry={true}
                        value={mpin}
                        onChangeText={setMpin}
                      />

                      <TouchableOpacity
                        style={s.purple}
                        onPress={openMaster}
                      >
                        <Text style={s.white}>
                          OPEN MASTER
                        </Text>
                      </TouchableOpacity>

                    </View>

                  ) : (

                    <View style={s.box}>

                      <TouchableOpacity
                        style={s.close}
                        onPress={function() {
                          setMaster(false);
                        }}
                      >

                        <Text style={s.closeText}>
                          CLOSE MASTER MODE
                        </Text>

                      </TouchableOpacity>

                    </View>

                  )}

                  <View style={s.box}>

                    <Text style={s.title}>
                      New Invoice
                    </Text>

                    <TextInput
                      style={s.input}
                      placeholder="Customer Name"
                      value={name}
                      onChangeText={setName}
                    />

                    <TextInput
                      style={s.input}
                      placeholder="Invoice Number"
                      value={invoice}
                      onChangeText={setInvoice}
                    />

                    <TextInput
                      style={s.input}
                      placeholder="Original Invoice Amount"
                      keyboardType="numeric"
                      value={original}
                      onChangeText={setOriginal}
                    />

                    {master ? (

                      <TextInput
                        style={s.input}
                        placeholder="Second Secret Amount"
                        keyboardType="numeric"
                        value={second}
                        onChangeText={setSecond}
                      />

                    ) : null}

                    <TouchableOpacity
                      style={s.blue}
                      onPress={add}
                    >

                      <Text style={s.white}>
                        SAVE INVOICE
                      </Text>

                    </TouchableOpacity>

                  </View>

                  <Text style={s.list}>
                    Invoice Records ({data.length})
                  </Text>

                  {data.length === 0 ? (

                    <View style={s.box}>

                      <Text style={s.empty}>
                        Abhi koi invoice nahi hai
                      </Text>

                    </View>

                  ) : (

                    data.map(function(x) {

                      const total =
                        Number(x.original || 0) +
                        Number(x.second || 0);

                      return (

                        <View
                          style={s.card}
                          key={x.id}
                        >

                          <View style={s.row}>

                            <Text style={s.name}>
                              {x.name}
                            </Text>

                            <TouchableOpacity
                              onPress={function() {
                                deleteItem(x.id);
                              }}
                            >

                              <Text style={s.delete}>
                                Delete
                              </Text>

                            </TouchableOpacity>

                          </View>

                          <Text style={s.invoice}>
                            Invoice: {x.invoice}
                          </Text>

                          <Text style={s.green}>
                            Original: Rs. {Number(
                              x.original
                            ).toLocaleString("en-IN")}
                          </Text>

                          {!master ? (

                            <Text style={s.red}>
                              Original Due: Rs. {Number(
                                x.original
                              ).toLocaleString("en-IN")}
                            </Text>

                          ) : (

                            <View style={s.secret}>

                              <Text style={s.purpleText}>
                                Second Amount: Rs. {Number(
                                  x.second || 0
                                ).toLocaleString("en-IN")}
                              </Text>

                              <Text style={s.total}>
                                TOTAL DUE: Rs. {total.toLocaleString(
                                  "en-IN"
                                )}
                              </Text>

                            </View>

                          )}

                        </View>
                      );
                    })
                  )}

                  <View style={{height: 60}} />

                </ScrollView>

              </SafeAreaView>
            );
          }

          const s = StyleSheet.create({

            page: {
              flex: 1,
              backgroundColor: "#f3f6fa"
            },

            head: {
              backgroundColor: "#0759a8",
              padding: 20
            },

            logo: {
              color: "#fff",
              fontSize: 24,
              fontWeight: "bold"
            },

            sub: {
              color: "#dcecff",
              marginTop: 4,
              fontSize: 13
            },

            box: {
              backgroundColor: "#fff",
              margin: 12,
              padding: 15,
              borderRadius: 10,
              elevation: 2
            },

            title: {
              fontSize: 18,
              fontWeight: "bold",
              marginBottom: 12
            },

            input: {
              borderWidth: 1,
              borderColor: "#ccc",
              borderRadius: 8,
              padding: 11,
              marginBottom: 10,
              backgroundColor: "#fff"
            },

            blue: {
              backgroundColor: "#0759a8",
              padding: 14,
              borderRadius: 8,
              alignItems: "center"
            },

            purple: {
              backgroundColor: "#7b1fa2",
              padding: 14,
              borderRadius: 8,
              alignItems: "center"
            },

            white: {
              color: "#fff",
              fontWeight: "bold"
            },

            close: {
              backgroundColor: "#fce4ec",
              padding: 13,
              borderRadius: 8,
              alignItems: "center"
            },

            closeText: {
              color: "#c2185b",
              fontWeight: "bold"
            },

            list: {
              fontSize: 19,
              fontWeight: "bold",
              margin: 14
            },

            card: {
              backgroundColor: "#fff",
              marginHorizontal: 12,
              marginBottom: 10,
              padding: 15,
              borderRadius: 10,
              elevation: 2
            },

            row: {
              flexDirection: "row",
              justifyContent: "space-between"
            },

            name: {
              fontSize: 18,
              fontWeight: "bold"
            },

            invoice: {
              color: "#666",
              marginTop: 4
            },

            green: {
              color: "#16835c",
              fontSize: 16,
              fontWeight: "bold",
              marginTop: 7
            },

            red: {
              color: "#c62828",
              fontSize: 16,
              fontWeight: "bold",
              marginTop: 4
            },

            delete: {
              color: "#c62828",
              fontWeight: "bold"
            },

            secret: {
              marginTop: 10,
              padding: 10,
              backgroundColor: "#f3e5f5",
              borderRadius: 8
            },

            purpleText: {
              color: "#7b1fa2",
              fontSize: 16,
              fontWeight: "bold"
            },

            total: {
              color: "#b71c1c",
              fontSize: 18,
              fontWeight: "bold",
              marginTop: 5
            },

            empty: {
              textAlign: "center",
              color: "#888"
            }

          });
          APPJS

          npx expo prebuild --platform android --no-install

      - name: Verify API 36
        run: |
          cd vyapar-khata

          echo "Checking Android build files..."

          test -f android/app/build.gradle

          grep -R "targetSdk" android/app android/build.gradle || true
          grep -R "compileSdk" android/app android/build.gradle || true

          echo "API 36 configuration check completed."

      - name: Restore Permanent Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > vyapar-khata/android/app/upload-keystore.jks

          test -s vyapar-khata/android/app/upload-keystore.jks

      - name: Configure Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          data = p.read_text()

          release_block = """
              release {
                  storeFile file('upload-keystore.jks')
                  storePassword System.getenv('KEYSTORE_PASSWORD')
                  keyAlias System.getenv('KEY_ALIAS')
                  keyPassword System.getenv('KEY_PASSWORD')
              }
          """

          if "signingConfigs {" not in data:
              raise SystemExit("signingConfigs block not found")

          data = data.replace(
              "signingConfigs {",
              "signingConfigs {" + release_block,
              1
          )

          data = data.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          p.write_text(data)
          PY

      - name: Build Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd vyapar-khata/android

          chmod +x gradlew

          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-khata-release-v54-api36
          path: vyapar-khata/android/app/build/outputs/bundle/release/*.aab
