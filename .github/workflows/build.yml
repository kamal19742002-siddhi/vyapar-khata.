name: Build Vyapar Khata Advanced AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Advanced Vyapar Khata
        run: |
          npx --yes create-expo-app@latest vyapar-khata --template blank --no-install
          cd vyapar-khata

          npm install
          npx expo install @react-native-async-storage/async-storage

          node -e "
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json'));
          app.expo.name='Vyapar Khata Book';
          app.expo.slug='vyapar-khata';
          app.expo.version='1.0.16';
          app.expo.android={
            package:'com.vyapar.khatabook.free',
            versionCode:16
          };
          fs.writeFileSync('app.json',JSON.stringify(app,null,2));
          "

          cat <<'EOF' > App.js
          import React, {useEffect, useMemo, useState} from 'react';
          import {
            SafeAreaView,
            StatusBar,
            StyleSheet,
            Text,
            View,
            TextInput,
            TouchableOpacity,
            FlatList,
            Modal,
            Alert,
            ScrollView
          } from 'react-native';
          import AsyncStorage from '@react-native-async-storage/async-storage';

          const INITIAL_CUSTOMERS = [
            {id:'c1', name:'Ramesh Kumar', phone:'9876543210', balance:-500},
            {id:'c2', name:'Suresh Patel', phone:'9876512345', balance:1200},
            {id:'c3', name:'Mohan Sharma', phone:'9988776655', balance:0}
          ];

          const INITIAL_SUPPLIERS = [
            {id:'s1', name:'Sharma Suppliers', phone:'9876500000', balance:3500},
            {id:'s2', name:'Raj Traders', phone:'9876511111', balance:1800}
          ];

          export default function App() {

            const [tab,setTab] = useState('customers');
            const [section,setSection] = useState('parties');

            const [customers,setCustomers] = useState(INITIAL_CUSTOMERS);
            const [suppliers,setSuppliers] = useState(INITIAL_SUPPLIERS);
            const [transactions,setTransactions] = useState([]);

            const [search,setSearch] = useState('');
            const [modal,setModal] = useState(false);
            const [reportModal,setReportModal] = useState(false);
            const [cashModal,setCashModal] = useState(false);

            const [name,setName] = useState('');
            const [phone,setPhone] = useState('');
            const [amount,setAmount] = useState('');
            const [entryType,setEntryType] = useState('jama');

            useEffect(()=>{
              loadData();
            },[]);

            const loadData = async()=>{
              try{
                const c=await AsyncStorage.getItem('customers');
                const s=await AsyncStorage.getItem('suppliers');
                const t=await AsyncStorage.getItem('transactions');

                if(c) setCustomers(JSON.parse(c));
                if(s) setSuppliers(JSON.parse(s));
                if(t) setTransactions(JSON.parse(t));
              }catch(e){}
            };

            const saveData = async(c,s,t)=>{
              try{
                await AsyncStorage.setItem('customers',JSON.stringify(c));
                await AsyncStorage.setItem('suppliers',JSON.stringify(s));
                await AsyncStorage.setItem('transactions',JSON.stringify(t));
              }catch(e){}
            };

            const currentList = tab==='customers' ? customers : suppliers;

            const filteredList = useMemo(()=>{
              const q=search.toLowerCase().trim();
              if(!q) return currentList;

              return currentList.filter(x =>
                x.name.toLowerCase().includes(q) ||
                (x.phone||'').includes(q)
              );
            },[currentList,search]);

            const customerGet = customers.reduce(
              (sum,x)=>sum+(x.balance>0?x.balance:0),0
            );

            const customerGive = customers.reduce(
              (sum,x)=>sum+(x.balance<0?Math.abs(x.balance):0),0
            );

            const supplierPayable = suppliers.reduce(
              (sum,x)=>sum+(x.balance>0?x.balance:0),0
            );

            const totalTransactions = transactions.length;

            const addParty = ()=>{
              if(!name.trim()){
                Alert.alert('Required','Name enter karein');
                return;
              }

              const newParty={
                id:Date.now().toString(),
                name:name.trim(),
                phone:phone.trim(),
                balance:0
              };

              let nc=customers;
              let ns=suppliers;

              if(tab==='customers'){
                nc=[newParty,...customers];
                setCustomers(nc);
              }else{
                ns=[newParty,...suppliers];
                setSuppliers(ns);
              }

              saveData(nc,ns,transactions);

              setName('');
              setPhone('');
              setModal(false);

              Alert.alert(
                'Success',
                tab==='customers'
                ? 'Customer added successfully'
                : 'Supplier added successfully'
              );
            };

            const addEntry = (party)=>{
              const value=parseFloat(amount);

              if(!value || value<=0){
                Alert.alert('Invalid Amount','Valid amount enter karein');
                return;
              }

              let change=0;

              if(entryType==='jama'){
                change=value;
              }else{
                change=-value;
              }

              const updatedList=currentList.map(x =>
                x.id===party.id
                ? {...x,balance:x.balance+change}
                : x
              );

              let nc=customers;
              let ns=suppliers;

              if(tab==='customers'){
                nc=updatedList;
                setCustomers(updatedList);
              }else{
                ns=updatedList;
                setSuppliers(updatedList);
              }

              const newTransaction={
                id:Date.now().toString(),
                party:party.name,
                type:tab,
                entry:entryType,
                amount:value,
                date:new Date().toLocaleString()
              };

              const nt=[newTransaction,...transactions];

              setTransactions(nt);
              saveData(nc,ns,nt);

              setAmount('');

              Alert.alert(
                'Entry Saved',
                entryType==='jama'
                ? 'Jama entry save ho gayi'
                : 'Udhar entry save ho gayi'
              );
            };

            const partyCard=({item})=>(
              <View style={styles.partyCard}>

                <View style={styles.avatar}>
                  <Text style={styles.avatarText}>
                    {item.name.charAt(0).toUpperCase()}
                  </Text>
                </View>

                <View style={{flex:1}}>
                  <Text style={styles.partyName}>{item.name}</Text>
                  <Text style={styles.phone}>
                    {item.phone || 'Phone not added'}
                  </Text>

                  <Text style={styles.accountText}>
                    Account Balance
                  </Text>
                </View>

                <View style={{alignItems:'flex-end'}}>
                  <Text
                    style={[
                      styles.balance,
                      {color:item.balance>=0?'#16834b':'#c62828'}
                    ]}
                  >
                    ₹ {Math.abs(item.balance).toLocaleString('en-IN')}
                  </Text>

                  <Text style={styles.balanceType}>
                    {item.balance>0
                      ? tab==='customers'?'You will get':'You will give'
                      : item.balance<0
                      ? tab==='customers'?'You will give':'You will get'
                      : 'Settled'}
                  </Text>

                  <View style={styles.entryButtons}>

                    <TouchableOpacity
                      style={styles.smallRed}
                      onPress={()=>{
                        setEntryType('udhar');
                        setAmount('');
                        setName(item.name);
                        setModal({party:item});
                      }}
                    >
                      <Text style={styles.smallButtonText}>- Udhar</Text>
                    </TouchableOpacity>

                    <TouchableOpacity
                      style={styles.smallGreen}
                      onPress={()=>{
                        setEntryType('jama');
                        setAmount('');
                        setName(item.name);
                        setModal({party:item});
                      }}
                    >
                      <Text style={styles.smallButtonText}>+ Jama</Text>
                    </TouchableOpacity>

                  </View>
                </View>

              </View>
            );

            const savePartyEntry=()=>{
              if(!modal?.party) return;

              addEntry(modal.party);
              setModal(false);
            };

            const openAddParty=()=>{
              setName('');
              setPhone('');
              setAmount('');
              setModal({add:true});
            };

            return (
              <SafeAreaView style={styles.container}>

                <StatusBar
                  barStyle="light-content"
                  backgroundColor="#0759a8"
                />

                <View style={styles.header}>

                  <View>
                    <Text style={styles.businessName}>
                      Siddhi Enterprises
                    </Text>

                    <Text style={styles.location}>
                      📍 Business Khata
                    </Text>
                  </View>

                  <Text style={styles.headerIcon}>⋮</Text>

                </View>

                <View style={styles.tabs}>

                  <TouchableOpacity
                    style={[
                      styles.tabButton,
                      tab==='customers' && styles.activeTab
                    ]}
                    onPress={()=>{
                      setTab('customers');
                      setSearch('');
                    }}
                  >
                    <Text
                      style={[
                        styles.tabText,
                        tab==='customers' && styles.activeTabText
                      ]}
                    >
                      CUSTOMERS
                    </Text>
                  </TouchableOpacity>

                  <TouchableOpacity
                    style={[
                      styles.tabButton,
                      tab==='suppliers' && styles.activeTab
                    ]}
                    onPress={()=>{
                      setTab('suppliers');
                      setSearch('');
                    }}
                  >
                    <Text
                      style={[
                        styles.tabText,
                        tab==='suppliers' && styles.activeTabText
                      ]}
                    >
                      SUPPLIERS
                    </Text>
                  </TouchableOpacity>

                </View>

                <ScrollView
                  style={{flex:1}}
                  contentContainerStyle={{paddingBottom:110}}
                >

                  <View style={styles.summary}>

                    <View style={styles.summaryBox}>
                      <Text style={styles.summaryTitle}>
                        You will give
                      </Text>

                      <Text style={styles.giveAmount}>
                        ₹ {tab==='customers'
                          ? customerGive.toLocaleString('en-IN')
                          : supplierPayable.toLocaleString('en-IN')}
                      </Text>
                    </View>

                    <View style={styles.divider}/>

                    <View style={styles.summaryBox}>
                      <Text style={styles.summaryTitle}>
                        You will get
                      </Text>

                      <Text style={styles.getAmount}>
                        ₹ {tab==='customers'
                          ? customerGet.toLocaleString('en-IN')
                          : '0'}
                      </Text>
                    </View>

                  </View>

                  <View style={styles.quickRow}>

                    <TouchableOpacity
                      style={styles.quickButton}
                      onPress={()=>setReportModal(true)}
                    >
                      <Text style={styles.quickIcon}>▣</Text>
                      <Text style={styles.quickText}>View Reports</Text>
                    </TouchableOpacity>

                    <TouchableOpacity
                      style={styles.quickButton}
                      onPress={()=>setSection('passbook')}
                    >
                      <Text style={styles.quickIcon}>▤</Text>
                      <Text style={styles.quickText}>Passbook</Text>
                    </TouchableOpacity>

                  </View>

                  <View style={styles.searchRow}>

                    <TextInput
                      style={styles.searchInput}
                      placeholder={
                        tab==='customers'
                        ? 'Search Customer'
                        : 'Search Supplier'
                      }
                      placeholderTextColor="#777"
                      value={search}
                      onChangeText={setSearch}
                    />

                    <TouchableOpacity
                      style={styles.filterButton}
                      onPress={()=>{
                        Alert.alert(
                          'Filter',
                          'Search box se name ya phone filter kar sakte hain.'
                        );
                      }}
                    >
                      <Text style={styles.filterIcon}>⌕</Text>
                      <Text style={styles.filterText}>Filters</Text>
                    </TouchableOpacity>

                  </View>

                  {section==='parties' && (
                    <>

                      <View style={styles.listHeader}>

                        <Text style={styles.listTitle}>
                          {tab==='customers'
                            ? 'Customer Accounts'
                            : 'Supplier Accounts'}
                        </Text>

                        <Text style={styles.listCount}>
                          {filteredList.length}
                        </Text>

                      </View>

                      <FlatList
                        data={filteredList}
                        keyExtractor={item=>item.id}
                        renderItem={partyCard}
                        scrollEnabled={false}
                        ListEmptyComponent={
                          <Text style={styles.empty}>
                            No records found
                          </Text>
                        }
                      />

                    </>
                  )}

                  {section==='passbook' && (
                    <View style={styles.sectionBox}>

                      <Text style={styles.bigSectionTitle}>
                        Passbook
                      </Text>

                      {transactions.length===0 ? (
                        <Text style={styles.empty}>
                          No transactions yet
                        </Text>
                      ) : transactions.map(t=>(
                        <View
                          key={t.id}
                          style={styles.transaction}
                        >
                          <View style={{flex:1}}>
                            <Text style={styles.transactionName}>
                              {t.party}
                            </Text>

                            <Text style={styles.transactionDate}>
                              {t.date}
                            </Text>

                            <Text style={styles.transactionType}>
                              {t.type} • {t.entry}
                            </Text>
                          </View>

                          <Text
                            style={[
                              styles.transactionAmount,
                              {
                                color:t.entry==='jama'
                                  ? '#16834b'
                                  : '#c62828'
                              }
                            ]}
                          >
                            {t.entry==='jama'?'+':'-'}
                            ₹{t.amount.toLocaleString('en-IN')}
                          </Text>
                        </View>
                      ))}

                    </View>
                  )}

                </ScrollView>

                <TouchableOpacity
                  style={styles.addButton}
                  onPress={openAddParty}
                >
                  <Text style={styles.addButtonText}>
                    ＋ {tab==='customers'
                      ? 'ADD CUSTOMER'
                      : 'ADD SUPPLIER'}
                  </Text>
                </TouchableOpacity>

                <View style={styles.bottomNav}>

                  <TouchableOpacity
                    onPress={()=>{
                      setSection('parties');
                    }}
                  >
                    <Text
                      style={[
                        styles.bottomText,
                        section==='parties' && styles.bottomActive
                      ]}
                    >
                      👥{'\n'}Parties
                    </Text>
                  </TouchableOpacity>

                  <TouchableOpacity
                    onPress={()=>{
                      setSection('loans');
                      Alert.alert(
                        'Loans',
                        'Loan records section ready for expansion.'
                      );
                    }}
                  >
                    <Text style={styles.bottomText}>
                      ₹{'\n'}Loans
                    </Text>
                  </TouchableOpacity>

                  <TouchableOpacity
                    onPress={()=>{
                      setCashModal(true);
                    }}
                  >
                    <Text style={styles.bottomText}>
                      ⋯{'\n'}More
                    </Text>
                  </TouchableOpacity>

                </View>

                <Modal
                  visible={!!modal}
                  transparent
                  animationType="slide"
                  onRequestClose={()=>setModal(false)}
                >

                  <View style={styles.modalBackground}>

                    <View style={styles.modalBox}>

                      {modal?.add ? (
                        <>
                          <Text style={styles.modalTitle}>
                            {tab==='customers'
                              ? 'Add Customer'
                              : 'Add Supplier'}
                          </Text>

                          <TextInput
                            style={styles.input}
                            placeholder="Name"
                            value={name}
                            onChangeText={setName}
                          />

                          <TextInput
                            style={styles.input}
                            placeholder="Phone Number"
                            keyboardType="phone-pad"
                            value={phone}
                            onChangeText={setPhone}
                          />

                          <TouchableOpacity
                            style={styles.modalGreen}
                            onPress={addParty}
                          >
                            <Text style={styles.modalButtonText}>
                              SAVE
                            </Text>
                          </TouchableOpacity>
                        </>
                      ) : (
                        <>
                          <Text style={styles.modalTitle}>
                            New Khata Entry
                          </Text>

                          <Text style={styles.selectedParty}>
                            {modal?.party?.name}
                          </Text>

                          <TextInput
                            style={styles.input}
                            placeholder="Amount (₹)"
                            keyboardType="numeric"
                            value={amount}
                            onChangeText={setAmount}
                          />

                          <View style={styles.modalRow}>

                            <TouchableOpacity
                              style={styles.modalRed}
                              onPress={()=>{
                                setEntryType('udhar');
                                savePartyEntry();
                              }}
                            >
                              <Text style={styles.modalButtonText}>
                                - Udhar
                              </Text>
                            </TouchableOpacity>

                            <TouchableOpacity
                              style={styles.modalGreen}
                              onPress={()=>{
                                setEntryType('jama');
                                savePartyEntry();
                              }}
                            >
                              <Text style={styles.modalButtonText}>
                                + Jama
                              </Text>
                            </TouchableOpacity>

                          </View>
                        </>
                      )}

                      <TouchableOpacity
                        onPress={()=>setModal(false)}
                        style={styles.cancel}
                      >
                        <Text style={styles.cancelText}>
                          Cancel
                        </Text>
                      </TouchableOpacity>

                    </View>
                  </View>

                </Modal>

                <Modal
                  visible={reportModal}
                  transparent
                  animationType="slide"
                  onRequestClose={()=>setReportModal(false)}
                >

                  <View style={styles.modalBackground}>

                    <View style={styles.modalBox}>

                      <Text style={styles.modalTitle}>
                        Business Reports
                      </Text>

                      <Text style={styles.reportLine}>
                        Customers: {customers.length}
                      </Text>

                      <Text style={styles.reportLine}>
                        Suppliers: {suppliers.length}
                      </Text>

                      <Text style={styles.reportLine}>
                        Transactions: {totalTransactions}
                      </Text>

                      <Text style={styles.reportLine}>
                        You will get: ₹{customerGet.toLocaleString('en-IN')}
                      </Text>

                      <Text style={styles.reportLine}>
                        You will give: ₹{customerGive.toLocaleString('en-IN')}
                      </Text>

                      <TouchableOpacity
                        style={styles.modalGreen}
                        onPress={()=>setReportModal(false)}
                      >
                        <Text style={styles.modalButtonText}>
                          CLOSE
                        </Text>
                      </TouchableOpacity>

                    </View>

                  </View>

                </Modal>

                <Modal
                  visible={cashModal}
                  transparent
                  animationType="slide"
                  onRequestClose={()=>setCashModal(false)}
                >

                  <View style={styles.modalBackground}>

                    <View style={styles.modalBox}>

                      <Text style={styles.modalTitle}>
                        More
                      </Text>

                      <TouchableOpacity
                        style={styles.moreItem}
                        onPress={()=>{
                          setCashModal(false);
                          setReportModal(true);
                        }}
                      >
                        <Text style={styles.moreText}>
                          📊 Reports
                        </Text>
                      </TouchableOpacity>

                      <TouchableOpacity
                        style={styles.moreItem}
                        onPress={()=>{
                          setCashModal(false);
                          setSection('passbook');
                        }}
                      >
                        <Text style={styles.moreText}>
                          📒 Passbook
                        </Text>
                      </TouchableOpacity>

                      <TouchableOpacity
                        style={styles.moreItem}
                        onPress={()=>{
                          setCashModal(false);
                          Alert.alert(
                            'Payment Reminder',
                            'Reminder feature selected.'
                          );
                        }}
                      >
                        <Text style={styles.moreText}>
                          🔔 Payment Reminder
                        </Text>
                      </TouchableOpacity>

                      <TouchableOpacity
                        style={styles.moreItem}
                        onPress={()=>{
                          setCashModal(false);
                          Alert.alert(
                            'Cashbook',
                            'Cashbook section selected.'
                          );
                        }}
                      >
                        <Text style={styles.moreText}>
                          💰 Cashbook
                        </Text>
                      </TouchableOpacity>

                      <TouchableOpacity
                        style={styles.cancel}
                        onPress={()=>setCashModal(false)}
                      >
                        <Text style={styles.cancelText}>
                          Close
                        </Text>
                      </TouchableOpacity>

                    </View>

                  </View>

                </Modal>

              </SafeAreaView>
            );
          }

          const styles=StyleSheet.create({

            container:{
              flex:1,
              backgroundColor:'#f4f6f8'
            },

            header:{
              backgroundColor:'#0759a8',
              paddingHorizontal:20,
              paddingTop:16,
              paddingBottom:14,
              flexDirection:'row',
              justifyContent:'space-between',
              alignItems:'center'
            },

            businessName:{
              color:'#fff',
              fontSize:22,
              fontWeight:'bold'
            },

            location:{
              color:'#dbeaff',
              fontSize:14,
              marginTop:4
            },

            headerIcon:{
              color:'#fff',
              fontSize:30
            },

            tabs:{
              flexDirection:'row',
              backgroundColor:'#0759a8',
              paddingHorizontal:18
            },

            tabButton:{
              paddingVertical:13,
              marginRight:30
            },

            activeTab:{
              borderBottomWidth:4,
              borderBottomColor:'#ffc928'
            },

            tabText:{
              color:'#d5e6fa',
              fontSize:15,
              fontWeight:'bold'
            },

            activeTabText:{
              color:'#fff'
            },

            summary:{
              backgroundColor:'#fff',
              margin:14,
              borderRadius:18,
              flexDirection:'row',
              paddingVertical:18,
              elevation:3
            },

            summaryBox:{
              flex:1,
              alignItems:'center'
            },

            summaryTitle:{
              fontSize:16,
              color:'#555'
            },

            giveAmount:{
              color:'#078447',
              fontSize:25,
              fontWeight:'bold',
              marginTop:8
            },

            getAmount:{
              color:'#c62828',
              fontSize:25,
              fontWeight:'bold',
              marginTop:8
            },

            divider:{
              width:1,
              backgroundColor:'#ddd'
            },

            quickRow:{
              flexDirection:'row',
              marginHorizontal:14,
              backgroundColor:'#e5f0fa',
              borderRadius:15,
              overflow:'hidden'
            },

            quickButton:{
              flex:1,
              flexDirection:'row',
              justifyContent:'center',
              alignItems:'center',
              paddingVertical:15
            },

            quickIcon:{
              fontSize:22,
              color:'#0759a8',
              marginRight:8
            },

            quickText:{
              color:'#0759a8',
              fontSize:17,
              fontWeight:'bold'
            },

            searchRow:{
              margin:14,
              backgroundColor:'#fff',
              borderRadius:15,
              flexDirection:'row',
              borderWidth:1,
              borderColor:'#ddd',
              overflow:'hidden'
            },

            searchInput:{
              flex:1,
              paddingHorizontal:16,
              fontSize:16,
              height:58,
              color:'#222'
            },

            filterButton:{
              width:75,
              justifyContent:'center',
              alignItems:'center',
              borderLeftWidth:1,
              borderLeftColor:'#ddd'
            },

            filterIcon:{
              color:'#0759a8',
              fontSize:25
            },

            filterText:{
              color:'#0759a8',
              fontSize:12
            },

            listHeader:{
              flexDirection:'row',
              justifyContent:'space-between',
              paddingHorizontal:18,
              marginBottom:8
            },

            listTitle:{
              fontSize:21,
              fontWeight:'bold',
              color:'#333'
            },

            listCount:{
              fontSize:17,
              color:'#777'
            },

            partyCard:{
              backgroundColor:'#fff',
              marginHorizontal:14,
              marginBottom:9,
              padding:13,
              borderRadius:15,
              flexDirection:'row',
              alignItems:'center',
              elevation:2
            },

            avatar:{
              width:45,
              height:45,
              borderRadius:25,
              backgroundColor:'#edf2f7',
              justifyContent:'center',
              alignItems:'center',
              marginRight:11
            },

            avatarText:{
              fontSize:19,
              fontWeight:'bold',
              color:'#555'
            },

            partyName:{
              fontSize:17,
              fontWeight:'bold',
              color:'#222'
            },

            phone:{
              fontSize:12,
              color:'#777',
              marginTop:3
            },

            accountText:{
              color:'#999',
              fontSize:11,
              marginTop:4
            },

            balance:{
              fontSize:18,
              fontWeight:'bold'
            },

            balanceType:{
              color:'#666',
              fontSize:11,
              marginTop:3
            },

            entryButtons:{
              flexDirection:'row',
              marginTop:7
            },

            smallRed:{
              backgroundColor:'#d83232',
              paddingHorizontal:7,
              paddingVertical:5,
              borderRadius:6,
              marginRight:4
            },

            smallGreen:{
              backgroundColor:'#2e7d32',
              paddingHorizontal:7,
              paddingVertical:5,
              borderRadius:6
            },

            smallButtonText:{
              color:'#fff',
              fontSize:10,
              fontWeight:'bold'
            },

            addButton:{
              position:'absolute',
              right:18,
              bottom:72,
              backgroundColor:'#b0005a',
              paddingHorizontal:24,
              paddingVertical:17,
              borderRadius:35,
              elevation:8
            },

            addButtonText:{
