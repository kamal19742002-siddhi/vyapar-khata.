name: Build Vyapar Khata AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate Project Root
        id: set-path
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found in the repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Found project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: ${{ steps.set-path.outputs.project_dir }}
        run: npm install

      - name: Auto-Patch Expo Modules Core for API 36
        working-directory: ${{ steps.set-path.outputs.project_dir }}
        run: |
          FILE=$(find node_modules/ -path "*/expo/modules/adapters/react/ModuleRegistryAdapter.kt" 2>/dev/null | head -n 1)
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
            echo "Patching $FILE..."
            sed -i 's/\.filterIsInstance/?.filterIsInstance/g' "$FILE"
            sed -i 's/\.map {/?.map {/g' "$FILE"
          fi
          mkdir -p android
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Configure Keystore and Signing
        working-directory: ${{ steps.set-path.outputs.project_dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          fi

          python3 - << 'EOF'
          import os

          gradle_file = "android/app/build.gradle"
          if os.path.exists(gradle_file):
              with open(gradle_file, "r") as f:
                  data = f.read()

              release_block = """
                      release {
                          storeFile file('upload-keystore.jks')
                          storePassword System.getenv('KEYSTORE_PASSWORD')
                          keyAlias System.getenv('KEY_ALIAS')
                          keyPassword System.getenv('KEY_PASSWORD')
                      }
              """
              if "signingConfigs {" in data and "release {" not in data:
                  data = data.replace("signingConfigs {", "signingConfigs {" + release_block, 1)
                  data = data.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
                  with open(gradle_file, "w") as f:
                      f.write(data)
                  print("Signing configuration injected successfully.")
          EOF

      - name: Grant Execute Permission for Gradlew
        working-directory: ${{ steps.set-path.outputs.project_dir }}/android
        run: chmod +x gradlew

      - name: Build Android App Bundle (AAB)
        working-directory: ${{ steps.set-path.outputs.project_dir }}/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: |
            **/android/app/build/outputs/bundle/release/*.aab
